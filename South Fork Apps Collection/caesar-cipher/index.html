<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caesar Cipher | South Fork Apps</title>
  <meta name="description" content="Encode and decode text with a Caesar or ROT cipher. Includes ROT13 preset. Free online Caesar cipher tool.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);font-size:.875rem}
  .nav a{color:var(--accent);text-decoration:none}.nav a:hover{text-decoration:underline}
  .nav-title{color:var(--muted)}
  main{flex:1;padding:1.5rem;max-width:760px;margin:0 auto;width:100%}
  h1{font-size:1.4rem;margin-bottom:.25rem}
  .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}
  .controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:1rem;padding:.875rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem}
  label{font-size:.875rem;color:var(--muted)}
  .slider-wrap{display:flex;align-items:center;gap:.75rem}
  input[type=range]{accent-color:var(--accent);width:160px}
  .rot-val{background:var(--surface-2);border:1px solid var(--border);border-radius:.375rem;padding:.25rem .6rem;font-size:.875rem;min-width:2.5rem;text-align:center;color:var(--accent);font-weight:600}
  .btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:.35rem .75rem;border-radius:.375rem;font-size:.8rem;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.accent{background:var(--accent);color:#111412;border-color:var(--accent);font-weight:600}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:1rem;margin-bottom:1rem}
  .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
  textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:.375rem;padding:.6rem;font-size:.875rem;font-family:'Courier New',monospace;resize:vertical;min-height:120px;line-height:1.5}
  .out-text{background:var(--surface-2);border:1px solid var(--border);border-radius:.375rem;padding:.6rem;font-size:.875rem;font-family:'Courier New',monospace;min-height:80px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
  .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.5rem}
  footer{text-align:center;padding:.75rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">← South Fork Apps</a><span class="nav-title">Caesar Cipher</span></nav>
<main>
  <h1>Caesar Cipher</h1>
  <p class="subtitle">Encode or decode text with any rotation from 1 to 25. Includes ROT13 preset.</p>
  <div class="controls">
    <label>Rotation:</label>
    <div class="slider-wrap">
      <input type="range" id="slider" min="1" max="25" value="13" oninput="onSlider()">
      <span class="rot-val" id="rotVal">13</span>
    </div>
    <button class="btn accent" onclick="setRot(13)">ROT13</button>
  </div>
  <div class="panel">
    <div class="panel-header"><strong>Input</strong><span id="inCount" style="font-size:.8rem;color:var(--muted)">0 chars</span></div>
    <textarea id="inputArea" placeholder="Type or paste text here…" oninput="convert()"></textarea>
  </div>
  <div class="panel">
    <div class="panel-header"><strong>Encoded</strong></div>
    <div class="out-text" id="encoded"></div>
    <div class="row"><span></span><button class="btn" onclick="copyText('encoded')">Copy</button></div>
  </div>
  <div class="panel">
    <div class="panel-header"><strong>Decoded</strong> <span style="font-size:.8rem;color:var(--muted)">(shift back by rotation)</span></div>
    <div class="out-text" id="decoded"></div>
    <div class="row"><span></span><button class="btn" onclick="copyText('decoded')">Copy</button></div>
  </div>
  <footer>v1.0</footer>
</main>
<script>
let rot=13;
function onSlider(){rot=parseInt(document.getElementById('slider').value);document.getElementById('rotVal').textContent=rot;convert();}
function setRot(n){rot=n;document.getElementById('slider').value=n;document.getElementById('rotVal').textContent=n;convert();}
function caesar(text,shift){
  return text.split('').map(c=>{
    if(c>='a'&&c<='z') return String.fromCharCode(((c.charCodeAt(0)-97+shift)%26+26)%26+97);
    if(c>='A'&&c<='Z') return String.fromCharCode(((c.charCodeAt(0)-65+shift)%26+26)%26+65);
    return c;
  }).join('');
}
function convert(){
  const t=document.getElementById('inputArea').value;
  document.getElementById('inCount').textContent=t.length+' chars';
  document.getElementById('encoded').textContent=caesar(t,rot);
  document.getElementById('decoded').textContent=caesar(t,-rot);
}
function copyText(id){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    const btns=document.querySelectorAll('.btn');
    btns.forEach(b=>{if(b.onclick&&b.onclick.toString().includes(id)){b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500);}});
  });
}
</script>
</body>
</html>
