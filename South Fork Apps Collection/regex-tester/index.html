<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Tester | South Fork Apps</title>
  <meta name="description" content="Test and debug regular expressions in real time with live match highlighting and group captures. Free online regex tester.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --danger: #f28b82; --warn: #f7c876;
      --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
      --match-bg: rgba(125,219,132,.25); --match-border: rgba(125,219,132,.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .pane:last-child { border-right: none; }
    .pane-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); }
    .regex-row { display: flex; align-items: center; background: var(--surface2); border-bottom: 1px solid var(--border); padding: 10px 16px; gap: 8px; }
    .regex-slash { font-size: 20px; color: var(--text-dim); font-family: monospace; }
    .regex-input { flex: 1; background: transparent; border: none; outline: none; color: var(--primary); font-family: 'Courier New', monospace; font-size: 15px; }
    .flags-input { width: 60px; background: transparent; border: none; outline: none; color: var(--warn); font-family: 'Courier New', monospace; font-size: 15px; }
    .regex-status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .regex-status.ok { background: rgba(125,219,132,.15); color: var(--primary); }
    .regex-status.err { background: rgba(242,139,130,.15); color: var(--danger); }
    textarea { flex: 1; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.7; padding: 16px; border: none; outline: none; resize: none; min-height: 300px; }
    .highlighted { flex: 1; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.7; padding: 16px; min-height: 200px; white-space: pre-wrap; word-break: break-word; overflow-y: auto; }
    mark { background: var(--match-bg); border: 1px solid var(--match-border); border-radius: 2px; color: var(--text); }
    .match-list { overflow-y: auto; flex: 1; }
    .match-item { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .match-index { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; }
    .match-val { font-family: 'Courier New', monospace; color: var(--primary); word-break: break-all; }
    .match-pos { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .match-groups { font-size: 12px; color: var(--text-mid); margin-top: 4px; }
    .stats-bar { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); display: flex; gap: 16px; }
    .stats-bar .ok { color: var(--primary); font-weight: 700; }
    .stats-bar .err { color: var(--danger); }
    .empty { color: var(--text-dim); font-size: 13px; padding: 16px; }
    .replace-row { display: flex; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; gap: 8px; font-size: 13px; color: var(--text-mid); }
    .replace-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; padding: 5px 10px; outline: none; }
    .replace-row input:focus { border-color: var(--primary); }
  </style>
</head>
<body>
<header>
  <a href="../../">← South Fork Apps</a>
  <h1>Regex Tester</h1>
</header>
<main>
  <div class="pane">
    <div class="pane-header">Pattern &amp; Test String</div>
    <div class="regex-row">
      <span class="regex-slash">/</span>
      <input class="regex-input" id="patternEl" placeholder="your regex here" oninput="run()" spellcheck="false">
      <span class="regex-slash">/</span>
      <input class="flags-input" id="flagsEl" value="g" oninput="run()" spellcheck="false" maxlength="6">
      <span class="regex-status" id="statusEl"></span>
    </div>
    <div class="replace-row">
      <span>Replace with:</span>
      <input id="replaceEl" placeholder="replacement string (optional)" oninput="run()" spellcheck="false">
    </div>
    <textarea id="testEl" placeholder="Paste test string here..." oninput="run()"></textarea>
    <div class="stats-bar" id="statsBar"><span>Enter a pattern above</span></div>
  </div>
  <div class="pane">
    <div class="pane-header">Matches</div>
    <div class="highlighted" id="highlightedEl"><span class="empty">Matches will be highlighted here.</span></div>
    <div style="border-top:1px solid var(--border);flex:1;display:flex;flex-direction:column;max-height:280px;">
      <div class="pane-header">Match Details</div>
      <div class="match-list" id="matchList"><p class="empty">No matches yet.</p></div>
    </div>
  </div>
</main>
<script>
function run() {
  const pattern = document.getElementById('patternEl').value;
  const flags   = document.getElementById('flagsEl').value.replace(/[^gimsuy]/g,'');
  const test    = document.getElementById('testEl').value;
  const replace = document.getElementById('replaceEl').value;
  const statusEl = document.getElementById('statusEl');

  if (!pattern) {
    statusEl.textContent = '';
    statusEl.className = 'regex-status';
    document.getElementById('highlightedEl').innerHTML = '<span class="empty">Matches will be highlighted here.</span>';
    document.getElementById('matchList').innerHTML = '<p class="empty">No matches yet.</p>';
    document.getElementById('statsBar').innerHTML = '<span>Enter a pattern above</span>';
    return;
  }

  let re;
  try {
    re = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
    statusEl.textContent = 'valid';
    statusEl.className = 'regex-status ok';
  } catch(e) {
    statusEl.textContent = 'error';
    statusEl.className = 'regex-status err';
    document.getElementById('statsBar').innerHTML = `<span class="err">${e.message}</span>`;
    document.getElementById('highlightedEl').textContent = test;
    document.getElementById('matchList').innerHTML = `<p class="empty" style="color:var(--danger)">${e.message}</p>`;
    return;
  }

  const matches = [...test.matchAll(re)];

  // Highlighted view
  let highlighted = '';
  let last = 0;
  matches.forEach(m => {
    highlighted += esc(test.slice(last, m.index));
    highlighted += `<mark>${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  });
  highlighted += esc(test.slice(last));
  document.getElementById('highlightedEl').innerHTML = highlighted || '<span class="empty">No matches.</span>';

  // Match list
  if (matches.length === 0) {
    document.getElementById('matchList').innerHTML = '<p class="empty">No matches found.</p>';
  } else {
    document.getElementById('matchList').innerHTML = matches.map((m, i) => {
      const groups = m.slice(1).map((g,j) => `Group ${j+1}: ${g === undefined ? '<em>undefined</em>' : `<code>${esc(g)}</code>`}`).join(' · ');
      return `<div class="match-item">
        <div class="match-index">Match ${i+1}</div>
        <div class="match-val">${esc(m[0])}</div>
        <div class="match-pos">Index ${m.index}–${m.index+m[0].length}</div>
        ${groups ? `<div class="match-groups">${groups}</div>` : ''}
      </div>`;
    }).join('');
  }

  // Replace preview
  let replaceInfo = '';
  if (replace !== '' && matches.length > 0) {
    const replaced = test.replace(re, replace);
    replaceInfo = ` · Replace: <span style="color:var(--warn)">${esc(replaced.slice(0,80))}${replaced.length>80?'…':''}</span>`;
  }

  document.getElementById('statsBar').innerHTML =
    `<span class="${matches.length?'ok':''}">${matches.length} match${matches.length!==1?'es':''}</span>${replaceInfo}`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
