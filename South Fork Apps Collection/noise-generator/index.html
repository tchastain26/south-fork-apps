<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noise Generator | South Fork Apps</title>
  <meta name="description" content="Play white, brown, or pink ambient noise in your browser. No download required. Free online noise generator for focus and sleep.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac; }
    * { box-sizing:border-box; }
    body { margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif; }
    .nav { display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border); }
    .nav-back { color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500; }
    .nav-back:hover { text-decoration:underline; }
    .nav-title { color:var(--text);font-size:.875rem;font-weight:600; }
    main { width:min(600px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;display:grid;gap:1rem; }
    .panel { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem; }
    h1 { margin:0 0 .5rem;font-size:clamp(2rem,7vw,4rem);line-height:1; }
    p { margin:0;color:var(--muted);line-height:1.6; }
    .noise-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:1.5rem 0; }
    .noise-btn { padding:1.25rem .5rem;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer;text-align:center;transition:border-color .15s,background .15s; }
    .noise-btn:hover { border-color:var(--accent); }
    .noise-btn.active { border-color:var(--accent);background:rgba(125,219,132,.08); }
    .noise-icon { font-size:2rem;margin-bottom:.4rem; }
    .noise-name { font-weight:800;font-size:.95rem;display:block; }
    .noise-desc { font-size:.75rem;color:var(--muted);margin-top:.2rem;display:block;line-height:1.4; }
    .noise-btn.active .noise-name { color:var(--accent); }
    .controls { display:grid;gap:1rem;margin-top:1rem; }
    .vol-row { display:flex;align-items:center;gap:1rem; }
    .vol-label { font-size:.84rem;font-weight:700;color:var(--muted);min-width:60px; }
    input[type=range] { flex:1;accent-color:var(--accent);height:6px;cursor:pointer; }
    .vol-val { font-size:.84rem;font-weight:700;min-width:36px;text-align:right; }
    .play-btn { width:100%;min-height:3.5rem;border:1px solid var(--accent);border-radius:12px;background:var(--accent);color:#102113;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;margin-top:.5rem;transition:background .15s; }
    .play-btn:hover { background:#5ec966; }
    .play-btn.playing { background:var(--surface-2);border-color:var(--border);color:var(--text); }
    .play-btn.playing:hover { border-color:var(--accent); }
    .vis-bar { display:flex;gap:3px;align-items:flex-end;justify-content:center;height:32px;margin-top:1rem; }
    .bar { width:4px;background:var(--accent);border-radius:2px;opacity:.6; }
    footer { margin-top:.75rem;text-align:center;color:var(--muted);font-size:.8rem; }
  </style>
</head>
<body>
<nav class="nav">
  <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">Noise Generator</span>
</nav>
<main>
  <section class="panel">
    <h1>Block it out.</h1>
    <p>Ambient noise for focus, sleep, and masking distractions. All audio generated locally in your browser.</p>

    <div class="noise-grid">
      <button class="noise-btn active" id="btn-white" type="button" onclick="selectNoise('white')">
        <div class="noise-icon">🌬</div>
        <span class="noise-name">White</span>
        <span class="noise-desc">All frequencies equally</span>
      </button>
      <button class="noise-btn" id="btn-pink" type="button" onclick="selectNoise('pink')">
        <div class="noise-icon">🌸</div>
        <span class="noise-name">Pink</span>
        <span class="noise-desc">Warmer, balanced tone</span>
      </button>
      <button class="noise-btn" id="btn-brown" type="button" onclick="selectNoise('brown')">
        <div class="noise-icon">🌊</div>
        <span class="noise-name">Brown</span>
        <span class="noise-desc">Deep, rumbling bass</span>
      </button>
    </div>

    <div class="controls">
      <div class="vol-row">
        <span class="vol-label">Volume</span>
        <input type="range" id="volume" min="0" max="100" value="60" oninput="setVolume(this.value)">
        <span class="vol-val" id="volVal">60%</span>
      </div>
    </div>

    <div class="vis-bar" id="vis"></div>

    <button class="play-btn" id="playBtn" type="button" onclick="togglePlay()">▶ Play</button>
    <footer>v1.0</footer>
  </section>
</main>
<script>
  let ctx=null, src=null, gain=null, playing=false, noiseType='white', animId=null;

  function selectNoise(type){
    noiseType=type;
    document.querySelectorAll('.noise-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+type).classList.add('active');
    if(playing){ stopNoise(); startNoise(); }
  }

  function setVolume(v){
    document.getElementById('volVal').textContent=v+'%';
    if(gain) gain.gain.value=v/100*0.4;
  }

  function makeWhiteBuffer(ctx){
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    return buf;
  }

  function makePinkBuffer(ctx){
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const data=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<data.length;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)/7; b6=w*0.115926;
    }
    return buf;
  }

  function makeBrownBuffer(ctx){
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const data=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<data.length;i++){
      const w=Math.random()*2-1;
      data[i]=(last+(0.02*w))/1.02; last=data[i]; data[i]*=3.5;
    }
    return buf;
  }

  function startNoise(){
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    gain=ctx.createGain();
    const vol=parseInt(document.getElementById('volume').value);
    gain.gain.value=vol/100*0.4;
    gain.connect(ctx.destination);

    const buf = noiseType==='white' ? makeWhiteBuffer(ctx) : noiseType==='pink' ? makePinkBuffer(ctx) : makeBrownBuffer(ctx);
    src=ctx.createBufferSource();
    src.buffer=buf; src.loop=true;
    src.connect(gain); src.start();
    playing=true;
    animateVis();
    document.getElementById('playBtn').textContent='■ Stop';
    document.getElementById('playBtn').classList.add('playing');
  }

  function stopNoise(){
    if(src){src.stop();src=null;}
    playing=false;
    cancelAnimationFrame(animId);
    document.getElementById('vis').innerHTML='';
    document.getElementById('playBtn').textContent='▶ Play';
    document.getElementById('playBtn').classList.remove('playing');
  }

  function togglePlay(){ playing?stopNoise():startNoise(); }

  function animateVis(){
    const vis=document.getElementById('vis');
    const bars=12;
    if(!vis.children.length){
      vis.innerHTML=Array.from({length:bars},()=>'<div class="bar"></div>').join('');
    }
    function frame(){
      if(!playing) return;
      [...vis.children].forEach(b=>{
        const h=Math.floor(Math.random()*28)+4;
        b.style.height=h+'px';
      });
      animId=requestAnimationFrame(()=>setTimeout(frame,80));
    }
    frame();
  }
</script>
</body>
</html>
