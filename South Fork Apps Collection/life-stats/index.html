<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Stats Calculator | South Fork Apps</title>
  <meta name="description" content="See how many heartbeats, breaths, and full moons you've lived through. Enter your birthday for live stats. Free tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    main { flex: 1; max-width: 700px; margin: 0 auto; width: 100%; padding: 28px 20px; display: flex; flex-direction: column; gap: 24px; }
    .dob-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    input[type=date] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 20px; font-weight: 700; padding: 12px 16px; outline: none; }
    input[type=date]:focus { border-color: var(--primary); }
    .age-hero { text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .age-number { font-size: 56px; font-weight: 800; color: var(--primary); line-height: 1; }
    .age-label { font-size: 14px; color: var(--text-dim); margin-top: 6px; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 500px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .stat-icon { font-size: 24px; }
    .stat-value { font-size: 20px; font-weight: 800; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 12px; color: var(--text-mid); line-height: 1.3; }
    .stat-note { font-size: 10px; color: var(--text-dim); }
    .live-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(125,219,132,.1); border: 1px solid rgba(125,219,132,.3); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: var(--primary); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .next-bday { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .next-label { font-size: 13px; color: var(--text-mid); }
    .next-value { font-size: 22px; font-weight: 800; color: var(--primary); }
    .empty { color: var(--text-dim); font-size: 15px; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
<header>
  <a href="../../">← South Fork Apps</a>
  <h1>Life Stats Calculator</h1>
</header>
<main>
  <div class="dob-card">
    <label>Your Birthday</label>
    <input type="date" id="dob" onchange="calculate()">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <span class="live-badge"><span class="live-dot"></span> Live — updates every second</span>
    </div>
  </div>
  <div id="results"><p class="empty">Enter your birthday above to see your life stats.</p></div>
</main>
<script>
let interval = null;

function calculate() {
  const dob = document.getElementById('dob').value;
  if (!dob) return;
  if (interval) clearInterval(interval);
  render(dob);
  interval = setInterval(() => render(dob), 1000);
}

function render(dob) {
  const birth = new Date(dob);
  const now = new Date();
  if (birth >= now) { document.getElementById('results').innerHTML = '<p class="empty">Birthday must be in the past.</p>'; return; }

  const msAlive = now - birth;
  const secAlive = msAlive / 1000;
  const minAlive = secAlive / 60;
  const hrAlive = minAlive / 60;
  const dayAlive = hrAlive / 24;
  const yrAlive = dayAlive / 365.25;

  const years = Math.floor(yrAlive);
  const months = Math.floor((yrAlive - years) * 12);
  const days = Math.floor(dayAlive);

  const heartbeats = Math.floor(secAlive * 1.2);      // ~72 bpm avg
  const breaths = Math.floor(secAlive * 0.267);        // ~16 per min
  const sleepHours = Math.floor(hrAlive * 0.333);      // ~8h/day
  const meals = Math.floor(dayAlive * 3);
  const steps = Math.floor(dayAlive * 8000);
  const blinks = Math.floor(secAlive * 0.283);         // ~17/min
  const words = Math.floor(minAlive * 130);             // ~130 wpm
  const fullMoons = Math.floor(dayAlive / 29.53);
  const weekends = Math.floor(dayAlive / 7) * 2;

  // Next birthday
  const nextBday = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
  if (nextBday <= now) nextBday.setFullYear(now.getFullYear() + 1);
  const daysToNext = Math.ceil((nextBday - now) / (1000 * 60 * 60 * 24));

  const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : n.toLocaleString();

  document.getElementById('results').innerHTML = `
    <div class="age-hero">
      <div class="age-number">${years}<span style="font-size:28px;color:var(--text-dim)">.${String(months).padStart(2,'0')}</span></div>
      <div class="age-label">${years} years, ${months} months, ${Math.floor((dayAlive % 30.44))} days old</div>
    </div>

    <div class="next-bday">
      <div><div class="next-label">Next Birthday</div><div style="font-size:14px;color:var(--text-mid);margin-top:2px;">${nextBday.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div></div>
      <div style="text-align:right"><div class="next-value">${daysToNext}</div><div class="next-label">days away</div></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value">${days.toLocaleString()}</div>
        <div class="stat-label">Days alive</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">❤️</div>
        <div class="stat-value">${fmt(heartbeats)}</div>
        <div class="stat-label">Heartbeats</div>
        <div class="stat-note">avg 72 bpm</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🌬️</div>
        <div class="stat-value">${fmt(breaths)}</div>
        <div class="stat-label">Breaths taken</div>
        <div class="stat-note">avg 16/min</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">😴</div>
        <div class="stat-value">${sleepHours.toLocaleString()}</div>
        <div class="stat-label">Hours slept</div>
        <div class="stat-note">avg 8h/day</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👁️</div>
        <div class="stat-value">${fmt(blinks)}</div>
        <div class="stat-label">Eye blinks</div>
        <div class="stat-note">avg 17/min</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🍽️</div>
        <div class="stat-value">${meals.toLocaleString()}</div>
        <div class="stat-label">Meals eaten</div>
        <div class="stat-note">avg 3/day</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👟</div>
        <div class="stat-value">${fmt(steps)}</div>
        <div class="stat-label">Steps taken</div>
        <div class="stat-note">avg 8,000/day</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🌕</div>
        <div class="stat-value">${fullMoons}</div>
        <div class="stat-label">Full moons</div>
        <div class="stat-note">every 29.5 days</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🗓️</div>
        <div class="stat-value">${weekends.toLocaleString()}</div>
        <div class="stat-label">Weekend days</div>
        <div class="stat-note">Sat + Sun</div>
      </div>
    </div>
  `;
}

// Set default to a reasonable date
const d = document.getElementById('dob');
d.max = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
