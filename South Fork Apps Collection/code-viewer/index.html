<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Viewer | South Fork Apps</title>
  <meta name="description" content="Paste code and get instant syntax highlighting for 30+ programming languages. Free online code viewer with auto-detect and line numbers.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1b1e;
      color: #e1e4e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #24262b;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    h1 { font-size: 14px; font-weight: 600; color: #e1e4e8; margin-right: 4px; }

    select {
      background: #1a1b1e;
      color: #e1e4e8;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      height: 28px;
    }
    select:focus { outline: none; border-color: #58a6ff; }

    .btn {
      background: #2d333b;
      color: #cdd9e5;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 4px 11px;
      font-size: 13px;
      cursor: pointer;
      height: 28px;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: #373e47; }
    .btn.success { background: #1a3a2a; border-color: #3fb950; color: #3fb950; }

    .spacer { flex: 1; }

    main { flex: 1; display: flex; overflow: hidden; }

    .pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    .pane-label {
      padding: 5px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      background: #1f2024;
      border-bottom: 1px solid #2d2d2d;
      flex-shrink: 0;
    }

    .divider { width: 1px; background: #333; flex-shrink: 0; }

    /* CodeMirror fill */
    #editor-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .CodeMirror {
      flex: 1;
      height: 100% !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace !important;
      font-size: 13px !important;
      line-height: 1.65 !important;
    }
    .CodeMirror-scroll { height: 100%; }

    /* Right pane */
    .output-scroll { flex: 1; overflow: auto; }
    .output-scroll pre {
      margin: 0; padding: 12px 0;
      background: transparent !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 13px; line-height: 1.65;
    }
    .output-scroll code.hljs { background: transparent !important; padding: 0 !important; }
    .line-table { border-collapse: collapse; width: 100%; }
    .ln { user-select: none; color: #3d444d; border-right: 1px solid #2d2d2d; padding: 0 12px 0 14px; text-align: right; min-width: 2.5em; vertical-align: top; }
    .lc { padding: 0 14px 0 12px; white-space: pre; }
    .empty-state { padding: 16px 14px; color: #3d444d; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; }

    #preview-frame { flex: 1; border: none; width: 100%; display: none; background: white; }

    @media (max-width: 680px) {
      main { flex-direction: column; }
      .divider { width: 100%; height: 1px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Code Viewer</h1>
    <select id="lang">
      <option value="auto">Auto-Detect</option>
      <optgroup label="Web">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="json">JSON</option>
        <option value="xml">XML / SVG</option>
      </optgroup>
      <optgroup label="Scripts &amp; Data">
        <option value="python">Python</option>
        <option value="bash">Bash / Shell</option>
        <option value="sql">SQL</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
      </optgroup>
      <optgroup label="Compiled">
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="swift">Swift</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="php">PHP</option>
        <option value="ruby">Ruby</option>
      </optgroup>
      <optgroup label="Other">
        <option value="diff">Diff / Patch</option>
        <option value="plaintext">Plain Text</option>
      </optgroup>
    </select>

    <button class="btn" id="openBtn">Open File</button>
    <input type="file" id="fileInput" style="display:none">

    <div class="spacer"></div>

    <button class="btn" id="copyBtn">Copy</button>
    <button class="btn" id="clearBtn">Clear</button>
  </header>

  <main>
    <div class="pane">
      <div class="pane-label">Input — paste, type, or drop a file</div>
      <div id="editor-container"></div>
    </div>
    <div class="divider"></div>
    <div class="pane">
      <div class="pane-label" id="outLabel">Output</div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      <div class="output-scroll" id="output">
        <div class="empty-state">Highlighted output will appear here.</div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/ruby/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/diff/diff.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const langEl     = document.getElementById('lang');
    const outLabel   = document.getElementById('outLabel');
    const outputEl   = document.getElementById('output');
    const previewEl  = document.getElementById('preview-frame');
    let timer;

    const CM_MODE = {
      html:       'htmlmixed',
      css:        'css',
      javascript: 'javascript',
      typescript: {name: 'javascript', typescript: true},
      json:       {name: 'javascript', json: true},
      xml:        'xml',
      python:     'python',
      bash:       'shell',
      sql:        'sql',
      yaml:       'yaml',
      markdown:   'markdown',
      go:         'go',
      rust:       'rust',
      swift:      'clike',
      java:       'clike',
      cpp:        'clike',
      c:          'clike',
      php:        'htmlmixed',
      ruby:       'ruby',
      diff:       'diff',
    };

    const editor = CodeMirror(document.getElementById('editor-container'), {
      value: '',
      mode: null,
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: false,
      tabSize: 2,
      indentWithTabs: false,
      autofocus: true,
      extraKeys: { Tab: cm => cm.replaceSelection('  ') },
    });

    editor.on('change', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
    langEl.addEventListener('change', () => { applyEditorMode(langEl.value); render(); });

    function applyEditorMode(lang) {
      editor.setOption('mode', CM_MODE[lang] || null);
    }

    function render() {
      const code = editor.getValue();
      if (!code.trim()) {
        showHighlight('<div class="empty-state">Highlighted output will appear here.</div>');
        outLabel.textContent = 'Output';
        return;
      }

      let lang = langEl.value;

      if (lang === 'auto') {
        const detected = hljs.highlightAuto(code);
        lang = detected.language || 'plaintext';
        // hljs calls HTML "php-template" or "xml" — normalize to html
        if ((lang === 'php-template' || lang === 'xml') && /<(!DOCTYPE|html|head|body)\b/i.test(code)) {
          lang = 'html';
        }
        applyEditorMode(lang);
      }

      if (lang === 'html') {
        previewEl.style.display = 'block';
        outputEl.style.display = 'none';
        previewEl.srcdoc = code;
        outLabel.textContent = 'Preview — rendered in browser';
        return;
      }

      let result;
      if (lang === 'plaintext' || !lang) {
        result = { value: hljs.escapeHtml(code), language: 'plaintext' };
      } else {
        try { result = hljs.highlight(code, { language: lang, ignoreIllegals: true }); }
        catch(e) { result = hljs.highlightAuto(code); }
      }

      outLabel.textContent = 'Output — ' + (result.language || 'plaintext');
      const lines = result.value.split('\n');
      if (lines[lines.length - 1] === '') lines.pop();
      const rows = lines.map((ln, i) =>
        `<tr><td class="ln">${i + 1}</td><td class="lc">${ln || ' '}</td></tr>`
      ).join('');
      showHighlight(`<pre><code class="hljs"><table class="line-table">${rows}</table></code></pre>`);
    }

    function showHighlight(html) {
      previewEl.style.display = 'none';
      outputEl.style.display = '';
      outputEl.innerHTML = html;
    }

    const EXT_MAP = {
      html: 'html', htm: 'html', css: 'css',
      js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript',
      ts: 'typescript', tsx: 'typescript',
      py: 'python', pyw: 'python',
      md: 'markdown', markdown: 'markdown',
      json: 'json', yaml: 'yaml', yml: 'yaml',
      sh: 'bash', bash: 'bash', zsh: 'bash',
      sql: 'sql', php: 'php', rb: 'ruby', go: 'go',
      swift: 'swift', java: 'java', kt: 'java',
      c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cpp',
      rs: 'rust', xml: 'xml', svg: 'xml', diff: 'diff', patch: 'diff',
    };

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        editor.setValue(ev.target.result);
        const ext = file.name.split('.').pop().toLowerCase();
        const mapped = EXT_MAP[ext];
        if (mapped) { langEl.value = mapped; applyEditorMode(mapped); }
        render();
      };
      reader.readAsText(file);
    }

    document.getElementById('openBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
      e.target.value = '';
    });

    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const code = editor.getValue();
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('success');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('success'); }, 1500);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      editor.setValue('');
      render();
      editor.focus();
    });
  </script>
</body>
</html>
