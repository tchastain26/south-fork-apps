<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Shadow Generator | South Fork Apps</title>
  <meta name="description" content="Generate CSS box shadows visually. Stack multiple layers, adjust blur, spread, and offset. Free online box shadow tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .shadows-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
    .shadow-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .shadow-item.active { border-color: var(--primary); }
    .shadow-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; background: #888; }
    .shadow-label { flex: 1; font-size: 12px; font-weight: 600; color: var(--text-mid); font-family: 'Courier New', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shadow-del { background: transparent; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
    .shadow-del:hover { color: var(--danger, #f28b82); }
    .add-shadow-btn { margin: 12px; background: transparent; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-dim); font-family: var(--font); font-size: 12px; font-weight: 700; padding: 8px; cursor: pointer; }
    .add-shadow-btn:hover { border-color: var(--primary); color: var(--primary); }
    .controls { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); display: flex; justify-content: space-between; }
    .val-display { color: var(--primary); font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--primary); }
    .color-row { display: flex; gap: 8px; align-items: center; }
    input[type=color] { width: 40px; height: 36px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; padding: 2px; }
    .opacity-field { display: flex; gap: 6px; align-items: center; }
    input[type=number] { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 13px; padding: 4px 8px; outline: none; width: 60px; text-align: center; }
    .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-mid); }
    input[type=checkbox] { accent-color: var(--primary); }
    .main-content { display: flex; flex-direction: column; }
    .preview-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; min-height: 300px; position: relative; overflow: hidden; }
    .preview-bg-toggle { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
    .bg-btn { width: 24px; height: 24px; border-radius: 4px; border: 2px solid var(--border); cursor: pointer; }
    .bg-btn.active { border-color: var(--primary); }
    .preview-box { width: 160px; height: 160px; border-radius: 12px; background: white; transition: box-shadow .2s; }
    .code-area { border-top: 1px solid var(--border); }
    .code-header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); }
    .code-block { padding: 14px 16px; font-family: 'Courier New', monospace; font-size: 13px; color: var(--primary); line-height: 1.6; background: var(--surface2); overflow-x: auto; white-space: pre; }
    .copy-btn { font-size: 11px; font-weight: 700; background: transparent; border: 1px solid var(--border); color: var(--text-mid); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-family: var(--font); }
    .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
    .presets-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
    .preset-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text-mid); font-family: var(--font); }
    .preset-btn:hover { border-color: var(--primary); color: var(--primary); }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); padding: 10px 12px 4px; }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Box Shadow Generator</h1>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="section-label">Shadows</div>
    <div class="shadows-list" id="shadowsList"></div>
    <button class="add-shadow-btn" onclick="addShadow()">+ Add Shadow Layer</button>

    <div class="presets-row">
      <button class="preset-btn" onclick="loadPreset('soft')">Soft</button>
      <button class="preset-btn" onclick="loadPreset('hard')">Hard</button>
      <button class="preset-btn" onclick="loadPreset('glow')">Glow</button>
      <button class="preset-btn" onclick="loadPreset('inset')">Inset</button>
      <button class="preset-btn" onclick="loadPreset('layered')">Layered</button>
    </div>

    <div class="controls" id="controls"></div>
  </div>

  <div class="main-content">
    <div class="preview-area" id="previewArea">
      <div class="preview-bg-toggle">
        <div class="bg-btn active" style="background:#1d201e" onclick="setBg('#1d201e',this)"></div>
        <div class="bg-btn" style="background:#f0f4f8" onclick="setBg('#f0f4f8',this)"></div>
        <div class="bg-btn" style="background:#000" onclick="setBg('#000',this)"></div>
      </div>
      <div class="preview-box" id="previewBox"></div>
    </div>
    <div class="code-area">
      <div class="code-header">
        <span>CSS Code</span>
        <button class="copy-btn" onclick="copyCSS()">Copy CSS</button>
      </div>
      <div class="code-block" id="codeBlock"></div>
    </div>
  </div>
</div>
<script>
const PRESETS = {
  soft:    [{ x:0, y:4, blur:24, spread:0, color:'#000000', opacity:.12, inset:false }],
  hard:    [{ x:6, y:6, blur:0, spread:0, color:'#000000', opacity:.9, inset:false }],
  glow:    [{ x:0, y:0, blur:30, spread:0, color:'#7ddb84', opacity:.6, inset:false }],
  inset:   [{ x:0, y:2, blur:8, spread:0, color:'#000000', opacity:.2, inset:true }],
  layered: [
    { x:0, y:1, blur:3, spread:0, color:'#000000', opacity:.12, inset:false },
    { x:0, y:4, blur:16, spread:0, color:'#000000', opacity:.08, inset:false },
    { x:0, y:12, blur:32, spread:0, color:'#000000', opacity:.06, inset:false },
  ],
};

let shadows = [{ x:0, y:8, blur:24, spread:0, color:'#000000', opacity:.15, inset:false }];
let activeIdx = 0;

function hexToRgba(hex, opacity) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${opacity})`;
}

function shadowStr(s) {
  return `${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.blur}px ${s.spread}px ${hexToRgba(s.color, s.opacity)}`;
}

function fullCSS() { return shadows.map(shadowStr).join(',\n  '); }

function generate() {
  const css = fullCSS();
  document.getElementById('previewBox').style.boxShadow = css;
  document.getElementById('codeBlock').textContent = `box-shadow: ${css};`;
  renderList();
}

function renderList() {
  document.getElementById('shadowsList').innerHTML = shadows.map((s,i) => `
    <div class="shadow-item ${i===activeIdx?'active':''}" onclick="selectShadow(${i})">
      <div class="shadow-dot" style="box-shadow:${shadowStr(s)};background:#fff;border:1px solid #3f493e"></div>
      <span class="shadow-label">${shadowStr(s)}</span>
      <button class="shadow-del" onclick="event.stopPropagation();deleteShadow(${i})">×</button>
    </div>
  `).join('');
}

function renderControls() {
  const s = shadows[activeIdx];
  document.getElementById('controls').innerHTML = `
    <div class="field"><label>Horizontal <span class="val-display" id="xv">${s.x}px</span></label><input type="range" min="-100" max="100" value="${s.x}" oninput="upd('x',+this.value);document.getElementById('xv').textContent=this.value+'px'"></div>
    <div class="field"><label>Vertical <span class="val-display" id="yv">${s.y}px</span></label><input type="range" min="-100" max="100" value="${s.y}" oninput="upd('y',+this.value);document.getElementById('yv').textContent=this.value+'px'"></div>
    <div class="field"><label>Blur <span class="val-display" id="bv">${s.blur}px</span></label><input type="range" min="0" max="200" value="${s.blur}" oninput="upd('blur',+this.value);document.getElementById('bv').textContent=this.value+'px'"></div>
    <div class="field"><label>Spread <span class="val-display" id="sv">${s.spread}px</span></label><input type="range" min="-50" max="100" value="${s.spread}" oninput="upd('spread',+this.value);document.getElementById('sv').textContent=this.value+'px'"></div>
    <div class="field"><label>Color</label><div class="color-row"><input type="color" value="${s.color}" oninput="upd('color',this.value)"><span style="font-size:13px;color:var(--text-dim)">Opacity:</span><input type="number" value="${Math.round(s.opacity*100)}" min="0" max="100" oninput="upd('opacity',this.value/100)" style="width:60px">%</div></div>
    <div class="toggle-row"><input type="checkbox" ${s.inset?'checked':''} onchange="upd('inset',this.checked)"> Inset shadow</div>
  `;
}

function upd(key, val) { shadows[activeIdx][key] = val; generate(); }
function selectShadow(i) { activeIdx = i; renderControls(); renderList(); }
function addShadow() { shadows.push({x:0,y:4,blur:16,spread:0,color:'#000000',opacity:.12,inset:false}); activeIdx=shadows.length-1; renderControls(); generate(); }
function deleteShadow(i) { if(shadows.length<=1)return; shadows.splice(i,1); activeIdx=Math.min(activeIdx,shadows.length-1); renderControls(); generate(); }
function loadPreset(key) { shadows=[...PRESETS[key].map(s=>({...s}))]; activeIdx=0; renderControls(); generate(); }
function setBg(color, btn) { document.getElementById('previewArea').style.background=color; document.querySelectorAll('.bg-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function copyCSS() { navigator.clipboard.writeText(document.getElementById('codeBlock').textContent); }

renderControls();
generate();
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
