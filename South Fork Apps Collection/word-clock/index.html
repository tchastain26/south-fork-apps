<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Clock | South Fork Apps</title>
  <meta name="description" content="A live clock that spells out the current time in words on a glowing letter grid. Free online word clock with fullscreen mode.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7ddb84;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111412; font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; border-bottom: 1px solid #3f493e; display: flex; align-items: center; gap: 12px; position: relative; z-index: 10; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; color: #e1e3df; }
    .controls { margin-left: auto; display: flex; gap: 8px; }
    .ctrl-btn { background: transparent; border: 1px solid #3f493e; border-radius: 6px; color: #899486; font-family: var(--font); font-size: 12px; font-weight: 700; padding: 5px 12px; cursor: pointer; }
    .ctrl-btn:hover { border-color: var(--primary); color: var(--primary); }
    .clock-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: clamp(6px, 1.5vw, 14px); max-width: 660px; width: 100%; }
    .cell { text-align: center; font-size: clamp(13px, 2.5vw, 22px); font-weight: 800; letter-spacing: .05em; color: #282b29; transition: color .5s, text-shadow .5s; user-select: none; cursor: default; padding: clamp(2px,0.5vw,6px) 0; }
    .cell.lit { color: var(--primary); text-shadow: 0 0 20px rgba(125,219,132,.4); }
    .cell.lit2 { color: #aaccda; text-shadow: 0 0 20px rgba(170,204,218,.3); }
    .exact-time { text-align: center; padding: 16px; font-size: 13px; color: #899486; font-weight: 600; letter-spacing: .08em; }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Word Clock</h1>
  <div class="controls">
    <button class="ctrl-btn" onclick="toggleTheme()">Toggle Theme</button>
    <button class="ctrl-btn" onclick="toggleFullscreen()">Fullscreen</button>
  </div>
</header>
<div class="clock-wrap">
  <div>
    <div class="grid" id="grid"></div>
    <div class="exact-time" id="exactTime"></div>
  </div>
</div>
<script>
// 11x11 letter grid — each row carefully laid out
const ROWS = [
  'I T L I S A M P M T A',
  'A C Q U A R T E R D C',
  'T W E N T Y F I V E X',
  'H A L F S T E N F T O',
  'P A S T E R U N I N E',
  'O N E S I X T H R E E',
  'F O U R F I V E T W O',
  'E I G H T E L E V E N',
  'S E V E N T W E L V E',
  'T E N S E O C L O C K',
  'I T I S E X A C T L Y',
];

// Word positions: [row, startCol, length]
const WORDS = {
  IT:      [[0,0,2]],
  IS:      [[0,3,2]],
  A:       [[0,5,1]],
  QUARTER: [[1,2,7]],
  TWENTY:  [[2,0,6]],
  FIVE_M:  [[2,6,4]],
  HALF:    [[3,0,4]],
  TEN_M:   [[3,5,3]],
  PAST:    [[4,0,4]],
  TO:      [[3,9,2]],
  NINE:    [[4,7,4]],
  ONE:     [[5,0,3]],
  SIX:     [[5,3,3]],
  THREE:   [[5,6,5]],
  FOUR:    [[6,0,4]],
  FIVE_H:  [[6,4,4]],
  TWO:     [[6,8,3]],
  EIGHT:   [[7,0,5]],
  ELEVEN:  [[7,5,6]],
  SEVEN:   [[8,0,5]],
  TWELVE:  [[8,5,6]],
  TEN_H:   [[9,0,3]],
  OCLOCK:  [[9,5,6]],
};

const HOUR_WORDS = ['TWELVE','ONE','TWO','THREE','FOUR','FIVE_H','SIX','SEVEN','EIGHT','NINE','TEN_H','ELEVEN','TWELVE'];
const MINUTE_WORDS = {
  0:  ['OCLOCK'],
  5:  ['FIVE_M','PAST'],
  10: ['TEN_M','PAST'],
  15: ['QUARTER','PAST'],
  20: ['TWENTY','PAST'],
  25: ['TWENTY','FIVE_M','PAST'],
  30: ['HALF','PAST'],
  35: ['TWENTY','FIVE_M','TO'],
  40: ['TWENTY','TO'],
  45: ['QUARTER','TO'],
  50: ['TEN_M','TO'],
  55: ['FIVE_M','TO'],
};

let darkMode = true;

function buildGrid() {
  const grid = document.getElementById('grid');
  ROWS.forEach((row, r) => {
    row.split('').filter(c => c !== ' ').forEach((letter, c) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `c${r}_${c}`;
      cell.textContent = letter;
      grid.appendChild(cell);
    });
  });
}

function lightCells(wordKey, cls) {
  const positions = WORDS[wordKey];
  if (!positions) return;
  positions.forEach(([row, start, len]) => {
    for (let c = start; c < start + len; c++) {
      const el = document.getElementById(`c${row}_${c}`);
      if (el) el.classList.add(cls || 'lit');
    }
  });
}

function tick() {
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const roundMin = Math.round(m / 5) * 5;
  const isTo = roundMin > 30;
  const dispHour = isTo ? (h + 1) % 12 : h;

  // Reset all
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('lit','lit2'));

  lightCells('IT');
  lightCells('IS');

  if (roundMin !== 0) lightCells('A', 'lit2');

  const minuteKeys = MINUTE_WORDS[roundMin % 60] || MINUTE_WORDS[0];
  minuteKeys.forEach(k => lightCells(k));
  lightCells(HOUR_WORDS[dispHour]);

  const timeStr = now.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit',second:'2-digit'});
  document.getElementById('exactTime').textContent = timeStr;
}

function toggleTheme() {
  darkMode = !darkMode;
  document.body.style.background = darkMode ? '#111412' : '#f0f4f8';
  document.querySelectorAll('.cell:not(.lit):not(.lit2)').forEach(el => {
    el.style.color = darkMode ? '' : '#d0d8d4';
  });
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

buildGrid();
tick();
setInterval(tick, 1000);
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
