<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter | South Fork Apps</title>
  <meta name="description" content="Convert between 30+ world currencies instantly using a built-in rate table. Free online currency converter.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#111412;color:#e8e8e8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:1rem;padding:0.75rem 1.5rem;background:#1a1f1b;border-bottom:1px solid #2a2f2b;font-family:'Plus Jakarta Sans',sans-serif}
.nav-back{color:#7ddb84;text-decoration:none;font-size:0.875rem;font-weight:500}
.nav-back:hover{text-decoration:underline}
.nav-title{color:#e8e8e8;font-size:0.875rem;font-weight:600}
main{flex:1;padding:2rem 1rem;max-width:640px;margin:0 auto;width:100%}
h1{font-size:1.75rem;font-weight:700;margin-bottom:0.5rem}
.subtitle{color:#a0a8a1;font-size:0.9rem;margin-bottom:2rem}
.card{background:#1a1f1b;border:1px solid #2a2f2b;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.row{display:flex;gap:0.75rem;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:0.4rem;flex:1;min-width:140px}
label{font-size:0.8rem;font-weight:600;color:#a0a8a1;text-transform:uppercase;letter-spacing:0.05em}
input,select{background:#111412;border:1px solid #2a2f2b;color:#e8e8e8;font-family:'Plus Jakarta Sans',sans-serif;font-size:1rem;padding:0.6rem 0.8rem;border-radius:8px;width:100%;transition:border-color 0.2s}
input:focus,select:focus{outline:none;border-color:#7ddb84}
.swap-btn{background:#1a1f1b;border:1px solid #2a2f2b;color:#7ddb84;font-size:1.2rem;padding:0.6rem 1rem;border-radius:8px;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.swap-btn:hover{background:#2a2f2b}
.result-box{background:#111412;border:1px solid #7ddb84;border-radius:10px;padding:1.25rem 1.5rem;margin-top:1.25rem;display:flex;flex-direction:column;gap:0.25rem}
.result-big{font-size:2rem;font-weight:700;color:#7ddb84}
.result-label{font-size:0.85rem;color:#a0a8a1}
.rate-note{font-size:0.75rem;color:#6a726b;margin-top:0.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.5rem;margin-top:1rem}
.rate-chip{background:#111412;border:1px solid #2a2f2b;border-radius:8px;padding:0.5rem 0.75rem;font-size:0.8rem;cursor:pointer;transition:border-color 0.2s;display:flex;justify-content:space-between}
.rate-chip:hover{border-color:#7ddb84;color:#7ddb84}
.rate-chip .sym{color:#a0a8a1;font-size:0.75rem}
footer{text-align:center;padding:1.5rem;color:#4a524b;font-size:0.8rem;border-top:1px solid #1a1f1b}
</style>
<!-- SFA_ADS_START -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3076043873825717" crossorigin="anonymous"></script>
<!-- SFA_ADS_END -->
</head>
<body>
<nav class="nav">
  <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">Currency Converter</span>
</nav>
<main>
  <h1>Currency Converter</h1>
  <p class="subtitle">Convert between 30+ currencies. Rates are indicative — last updated May 2025.</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Amount</label>
        <input type="number" id="amount" value="1" min="0" step="any">
      </div>
      <div class="field">
        <label>From</label>
        <select id="from"></select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap currencies">⇄</button>
      <div class="field">
        <label>To</label>
        <select id="to"></select>
      </div>
    </div>
    <div class="result-box" id="resultBox">
      <div class="result-label" id="resultLabel">Result</div>
      <div class="result-big" id="resultBig">—</div>
      <div class="rate-note" id="rateNote"></div>
    </div>
  </div>

  <div class="card">
    <label style="display:block;margin-bottom:0.75rem">Quick convert 1 <span id="quickBase">USD</span> to all currencies</label>
    <div class="grid" id="quickGrid"></div>
  </div>
</main>
<footer>Currency Converter — South Fork Apps — v1.0 — Indicative rates, not for financial transactions</footer>

<script>
const RATES = {
  USD:{name:"US Dollar",symbol:"$",rate:1},
  EUR:{name:"Euro",symbol:"€",rate:0.9215},
  GBP:{name:"British Pound",symbol:"£",rate:0.7872},
  JPY:{name:"Japanese Yen",symbol:"¥",rate:155.42},
  CAD:{name:"Canadian Dollar",symbol:"C$",rate:1.3641},
  AUD:{name:"Australian Dollar",symbol:"A$",rate:1.5298},
  CHF:{name:"Swiss Franc",symbol:"Fr",rate:0.9001},
  CNY:{name:"Chinese Yuan",symbol:"¥",rate:7.2318},
  INR:{name:"Indian Rupee",symbol:"₹",rate:83.47},
  MXN:{name:"Mexican Peso",symbol:"$",rate:17.18},
  BRL:{name:"Brazilian Real",symbol:"R$",rate:5.082},
  KRW:{name:"South Korean Won",symbol:"₩",rate:1352.4},
  SGD:{name:"Singapore Dollar",symbol:"S$",rate:1.338},
  HKD:{name:"Hong Kong Dollar",symbol:"HK$",rate:7.811},
  NOK:{name:"Norwegian Krone",symbol:"kr",rate:10.54},
  SEK:{name:"Swedish Krona",symbol:"kr",rate:10.33},
  DKK:{name:"Danish Krone",symbol:"kr",rate:6.877},
  NZD:{name:"New Zealand Dollar",symbol:"NZ$",rate:1.6602},
  ZAR:{name:"South African Rand",symbol:"R",rate:18.63},
  AED:{name:"UAE Dirham",symbol:"د.إ",rate:3.6725},
  SAR:{name:"Saudi Riyal",symbol:"﷼",rate:3.7512},
  THB:{name:"Thai Baht",symbol:"฿",rate:35.12},
  IDR:{name:"Indonesian Rupiah",symbol:"Rp",rate:15983},
  MYR:{name:"Malaysian Ringgit",symbol:"RM",rate:4.695},
  PHP:{name:"Philippine Peso",symbol:"₱",rate:56.21},
  PLN:{name:"Polish Zloty",symbol:"zł",rate:3.952},
  CZK:{name:"Czech Koruna",symbol:"Kč",rate:23.27},
  HUF:{name:"Hungarian Forint",symbol:"Ft",rate:360.4},
  RON:{name:"Romanian Leu",symbol:"lei",rate:4.591},
  ILS:{name:"Israeli Shekel",symbol:"₪",rate:3.712},
  CLP:{name:"Chilean Peso",symbol:"$",rate:967.4},
  ARS:{name:"Argentine Peso",symbol:"$",rate:1020.0},
  COP:{name:"Colombian Peso",symbol:"$",rate:3955.0},
  TRY:{name:"Turkish Lira",symbol:"₺",rate:32.89},
};

const fromSel=document.getElementById('from');
const toSel=document.getElementById('to');
const amountEl=document.getElementById('amount');
const resultBig=document.getElementById('resultBig');
const resultLabel=document.getElementById('resultLabel');
const rateNote=document.getElementById('rateNote');
const quickGrid=document.getElementById('quickGrid');
const quickBase=document.getElementById('quickBase');

Object.entries(RATES).forEach(([code,{name}])=>{
  [fromSel,toSel].forEach(sel=>{
    const opt=document.createElement('option');
    opt.value=code;
    opt.textContent=`${code} — ${name}`;
    sel.appendChild(opt);
  });
});
fromSel.value='USD';
toSel.value='EUR';

function toUSD(code,amount){return amount/RATES[code].rate;}
function fromUSD(code,amount){return amount*RATES[code].rate;}
function fmt(n){return n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:2}):n<0.01?n.toFixed(6):n.toFixed(2);}

function convert(){
  const amt=parseFloat(amountEl.value);
  if(isNaN(amt)||amt<0){resultBig.textContent='—';return;}
  const fc=fromSel.value,tc=toSel.value;
  const usd=toUSD(fc,amt);
  const result=fromUSD(tc,usd);
  resultBig.textContent=`${RATES[tc].symbol}${fmt(result)} ${tc}`;
  resultLabel.textContent=`${fmt(amt)} ${fc} =`;
  const rate=fromUSD(tc,toUSD(fc,1));
  rateNote.textContent=`1 ${fc} = ${fmt(rate)} ${tc}`;
  buildQuickGrid(fc);
}

function buildQuickGrid(base){
  quickBase.textContent=base;
  quickGrid.innerHTML='';
  const usd=toUSD(base,1);
  Object.entries(RATES).forEach(([code,{symbol}])=>{
    if(code===base)return;
    const val=fromUSD(code,usd);
    const chip=document.createElement('div');
    chip.className='rate-chip';
    chip.title=`Click to convert to ${code}`;
    chip.innerHTML=`<span>${code}</span><span class="sym">${fmt(val)}</span>`;
    chip.addEventListener('click',()=>{toSel.value=code;convert();});
    quickGrid.appendChild(chip);
  });
}

[fromSel,toSel,amountEl].forEach(el=>el.addEventListener('input',convert));
document.getElementById('swapBtn').addEventListener('click',()=>{
  const tmp=fromSel.value;fromSel.value=toSel.value;toSel.value=tmp;convert();
});

convert();
</script>
</body>
</html>
