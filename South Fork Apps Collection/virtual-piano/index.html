<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(900px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;text-align:center;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1rem;color:var(--muted);line-height:1.6;}
  .controls{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:1.25rem;font-size:.85rem;}
  .ctrl-group{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.4rem .85rem;}
  .ctrl-group label{color:var(--muted);font-weight:600;white-space:nowrap;}
  select,input[type=range]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.25rem .5rem;border-radius:5px;font:inherit;font-size:.82rem;cursor:pointer;}
  input[type=range]{width:80px;accent-color:var(--accent);padding:0;}
  .display-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;margin-bottom:1.25rem;min-height:2.5rem;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;}
  .pressed-note{background:rgba(125,219,132,.12);border:1px solid rgba(125,219,132,.3);border-radius:5px;padding:.15rem .5rem;font-size:.88rem;font-weight:700;color:var(--accent);}
  .piano-wrap{overflow-x:auto;padding-bottom:1rem;}
  .piano{display:flex;position:relative;height:180px;user-select:none;width:max-content;margin:0 auto;}
  .white-key{width:42px;height:160px;background:#e8e8e8;border:1.5px solid #555;border-radius:0 0 6px 6px;position:relative;cursor:pointer;transition:background .05s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;margin-right:1px;flex-shrink:0;}
  .white-key:hover{background:#d0eed2;}
  .white-key.pressed,.white-key.mouse-pressed{background:#7ddb84;}
  .white-key .key-label{font-size:.62rem;font-weight:700;color:#333;pointer-events:none;}
  .white-key .kb-label{font-size:.55rem;color:#888;pointer-events:none;display:block;}
  .black-key{width:28px;height:100px;background:#1a1a1a;border:1.5px solid #000;border-radius:0 0 5px 5px;position:absolute;top:0;z-index:2;cursor:pointer;transition:background .05s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;flex-shrink:0;}
  .black-key:hover{background:#2d4a2e;}
  .black-key.pressed,.black-key.mouse-pressed{background:#4a9e50;}
  .black-key .key-label{font-size:.55rem;font-weight:700;color:#aaa;pointer-events:none;}
  .black-key .kb-label{font-size:.5rem;color:#666;pointer-events:none;display:block;}
  .octave-sep{width:2px;background:rgba(125,219,132,.2);align-self:stretch;margin:0 2px;}
  .hint{font-size:.75rem;color:var(--muted);margin-top:.5rem;}
  footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Virtual Piano</span></nav>
<main>
  <h1>Virtual Piano</h1>
  <p class="sub">Click keys or use your keyboard to play. Two octaves starting from C4 (middle C).</p>
  <div class="controls">
    <div class="ctrl-group">
      <label>Waveform</label>
      <select id="wave"><option value="sine">Sine</option><option value="triangle" selected>Triangle</option><option value="square">Square</option><option value="sawtooth">Sawtooth</option></select>
    </div>
    <div class="ctrl-group">
      <label>Sustain</label>
      <input type="range" id="sustain" min="0.3" max="3" step="0.1" value="1.2">
      <span id="sustainVal">1.2s</span>
    </div>
    <div class="ctrl-group">
      <label>Volume</label>
      <input type="range" id="vol" min="0.05" max="0.5" step="0.05" value="0.3">
    </div>
  </div>
  <div class="display-bar" id="displayBar"><span style="color:var(--muted);font-size:.82rem">Play a note…</span></div>
  <div class="piano-wrap"><div class="piano" id="piano"></div></div>
  <p class="hint">Keyboard: A S D F G H J K L (white keys) · W E T Y U O P (black keys)</p>
  <footer>v1.0</footer>
</main>
<script>
const OCTAVES=[4,5];
const WHITE_NOTES=['C','D','E','F','G','A','B'];
const ALL_NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DISPLAY=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const KB_WHITE=['a','s','d','f','g','h','j','k','l',';'];
const KB_BLACK=['w','e','','t','y','u','','o','p'];

let audioCtx=null,activeNodes={};
const displayNotes=[];

function getFreq(note,octave){
  const semi=ALL_NOTES.indexOf(note);
  const semiFromA4=(octave-4)*12+(semi-9);
  return 440*Math.pow(2,semiFromA4/12);
}

function playNote(note,octave){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const key=`${note}${octave}`;
  if(activeNodes[key])return;
  const freq=getFreq(note,octave);
  const wave=document.getElementById('wave').value;
  const vol=parseFloat(document.getElementById('vol').value);
  const sustain=parseFloat(document.getElementById('sustain').value);
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type=wave;osc.frequency.value=freq;
  gain.gain.setValueAtTime(vol,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+sustain);
  osc.start();osc.stop(audioCtx.currentTime+sustain);
  activeNodes[key]={osc,gain};
  osc.onended=()=>delete activeNodes[key];
  showNote(note,octave);
}

function showNote(note,octave){
  const disp=document.getElementById('displayBar');
  const dn=DISPLAY[ALL_NOTES.indexOf(note)];
  const html=`<span class="pressed-note">${dn}${octave}</span>`;
  disp.innerHTML=html;
}

function buildPiano(){
  const piano=document.getElementById('piano');
  let html='';
  let wIdx=0;
  OCTAVES.forEach((oct,oi)=>{
    if(oi>0)html+='<div class="octave-sep"></div>';
    const whitePositions=[];
    let wPos=0;
    ALL_NOTES.forEach((n,i)=>{
      const isBlack=n.includes('#');
      if(!isBlack){whitePositions.push({note:n,semi:i,wPos});wPos++;}
    });
    const totalWhiteW=43;
    html+=`<div style="position:relative;display:flex">`;
    whitePositions.forEach(({note,semi,wPos:wp},wi)=>{
      const kbLabel=wIdx<KB_WHITE.length?KB_WHITE[wIdx]:'';
      wIdx++;
      html+=`<div class="white-key" data-note="${note}" data-oct="${oct}" onmousedown="handleDown('${note}',${oct},this)" onmouseup="handleUp('${note}',${oct},this)" onmouseleave="handleUp('${note}',${oct},this)">
        <span class="kb-label">${kbLabel.toUpperCase()}</span>
        <span class="key-label">${note}${oct}</span>
      </div>`;
    });
    let bIdx=0;
    ALL_NOTES.forEach((n,i)=>{
      const isBlack=n.includes('#');
      if(isBlack){
        const prevWhite=ALL_NOTES.slice(0,i).filter(x=>!x.includes('#')).length;
        const leftPx=prevWhite*totalWhiteW-14;
        const kbLabel=KB_BLACK[bIdx]||'';
        bIdx++;
        html+=`<div class="black-key" data-note="${n}" data-oct="${oct}" style="left:${leftPx}px" onmousedown="handleDown('${n}',${oct},this)" onmouseup="handleUp('${n}',${oct},this)" onmouseleave="handleUp('${n}',${oct},this)">
          <span class="kb-label">${kbLabel.toUpperCase()}</span>
          <span class="key-label">${DISPLAY[i]}</span>
        </div>`;
      }
    });
    html+='</div>';
  });
  piano.innerHTML=html;
}

function handleDown(note,oct,el){el.classList.add('mouse-pressed');playNote(note,oct);}
function handleUp(note,oct,el){el.classList.remove('mouse-pressed');}

const KB_MAP={};
let bkIdx=0,wkIdx=0;
OCTAVES.forEach(oct=>{
  ALL_NOTES.forEach(n=>{
    const isBlack=n.includes('#');
    if(isBlack){const k=KB_BLACK[bkIdx];if(k)KB_MAP[k]={note:n,oct};bkIdx++;}
    else{const k=KB_WHITE[wkIdx];if(k)KB_MAP[k]={note:n,oct};wkIdx++;}
  });
});

const heldKeys=new Set();
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(KB_MAP[k]&&!heldKeys.has(k)){
    heldKeys.add(k);
    const {note,oct}=KB_MAP[k];
    playNote(note,oct);
    document.querySelectorAll(`[data-note="${note}"][data-oct="${oct}"]`).forEach(el=>el.classList.add('pressed'));
  }
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  heldKeys.delete(k);
  if(KB_MAP[k]){
    const {note,oct}=KB_MAP[k];
    document.querySelectorAll(`[data-note="${note}"][data-oct="${oct}"]`).forEach(el=>el.classList.remove('pressed'));
  }
});

document.getElementById('sustain').addEventListener('input',function(){
  document.getElementById('sustainVal').textContent=this.value+'s';
});

buildPiano();
</script>
</body>
</html>
