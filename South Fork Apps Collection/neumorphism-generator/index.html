<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphism Generator | South Fork Apps</title>
  <meta name="description" content="Generate neumorphism (soft UI) CSS with live preview. Adjust background color, size, blur, and distance to create pressed or raised neumorphic elements. Free online neumorphism generator.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(860px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem;}
    h1{margin:0 0 .4rem;font-size:clamp(1.6rem,3.5vw,2.2rem);}
    .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    @media(max-width:640px){.layout{grid-template-columns:1fr;}}
    .controls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;}
    .field{margin-bottom:.85rem;}
    label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.3rem;}
    label span{color:var(--accent);}
    input[type=range]{width:100%;accent-color:var(--accent);}
    input[type=color]{width:48px;height:32px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--surface2);cursor:pointer;}
    .color-row{display:flex;gap:.6rem;align-items:center;}
    .color-row input[type=text]{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.38rem .6rem;font:inherit;font-family:monospace;font-size:.85rem;outline:none;}
    .color-row input[type=text]:focus{border-color:var(--accent);}
    .shape-toggle{display:flex;gap:.4rem;margin-bottom:.85rem;}
    .shape-btn{padding:.3rem .75rem;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;}
    .shape-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(125,219,132,.1);}
    .type-toggle{display:flex;gap:.4rem;margin-bottom:.85rem;}
    .type-btn{padding:.3rem .75rem;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;}
    .type-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(125,219,132,.1);}
    .preview-side{display:flex;flex-direction:column;gap:.75rem;}
    .preview-box{border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;min-height:220px;padding:2rem;}
    .neu-el{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:rgba(255,255,255,.4);}
    pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.85rem;font-size:.75rem;font-family:monospace;overflow-x:auto;line-height:1.6;margin:0;}
    .copy-btn{width:100%;padding:.5rem;border:none;border-radius:7px;background:var(--accent);color:#0a1a0c;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;margin-top:.5rem;}
    .copy-btn:hover{filter:brightness(1.07);}
    footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>

</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Neumorphism Generator</span></nav>
<main>
  <h1>Neumorphism Generator</h1>
  <p class="sub">Design soft-UI neumorphic elements visually and copy the CSS box-shadow.</p>

  <div class="layout">
    <div class="controls">
      <div class="field">
        <label>Shape</label>
        <div class="shape-toggle">
          <button class="shape-btn active" data-shape="0" onclick="setShape(this)">Flat</button>
          <button class="shape-btn" data-shape="1" onclick="setShape(this)">Concave</button>
          <button class="shape-btn" data-shape="2" onclick="setShape(this)">Convex</button>
        </div>
      </div>
      <div class="field">
        <label>Type</label>
        <div class="type-toggle">
          <button class="type-btn active" data-type="raised" onclick="setType(this)">Raised</button>
          <button class="type-btn" data-type="pressed" onclick="setType(this)">Pressed</button>
        </div>
      </div>
      <div class="field">
        <label>Background color</label>
        <div class="color-row">
          <input type="color" id="bgColor" value="#e0e5ec" oninput="syncColor()">
          <input type="text" id="bgHex" value="#e0e5ec" oninput="syncHex()" maxlength="7">
        </div>
      </div>
      <div class="field">
        <label>Size <span id="sizeVal">150px</span></label>
        <input type="range" id="size" min="50" max="300" value="150" oninput="update()">
      </div>
      <div class="field">
        <label>Blur radius <span id="blurVal">20px</span></label>
        <input type="range" id="blur" min="0" max="60" value="20" oninput="update()">
      </div>
      <div class="field">
        <label>Distance <span id="distVal">10px</span></label>
        <input type="range" id="dist" min="0" max="50" value="10" oninput="update()">
      </div>
      <div class="field">
        <label>Intensity <span id="intensityVal">15%</span></label>
        <input type="range" id="intensity" min="1" max="40" value="15" oninput="update()">
      </div>
      <div class="field">
        <label>Border radius <span id="radiusVal">20px</span></label>
        <input type="range" id="radius" min="0" max="200" value="20" oninput="update()">
      </div>
    </div>

    <div class="preview-side">
      <div class="preview-box" id="previewBox">
        <div class="neu-el" id="neuEl">Element</div>
      </div>
      <pre id="cssOut"></pre>
      <button class="copy-btn" onclick="copyCss()">Copy CSS</button>
    </div>
  </div>
  <footer>v1.0 · Based on CSS box-shadow technique</footer>
</main>
<script>
let shape = 0, type = 'raised';

function setShape(btn) {
  shape = parseInt(btn.dataset.shape);
  document.querySelectorAll('.shape-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  update();
}

function setType(btn) {
  type = btn.dataset.type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  update();
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function adjustColor(hex, amount) {
  const {r,g,b} = hexToRgb(hex);
  const nr = Math.max(0,Math.min(255,r+amount));
  const ng = Math.max(0,Math.min(255,g+amount));
  const nb = Math.max(0,Math.min(255,b+amount));
  return `#${[nr,ng,nb].map(v=>v.toString(16).padStart(2,'0')).join('')}`;
}

function syncColor() {
  document.getElementById('bgHex').value = document.getElementById('bgColor').value;
  update();
}
function syncHex() {
  const v = document.getElementById('bgHex').value;
  if (/^#[0-9a-f]{6}$/i.test(v)) { document.getElementById('bgColor').value = v; update(); }
}

function update() {
  const bg = document.getElementById('bgColor').value;
  const size = document.getElementById('size').value;
  const blur = document.getElementById('blur').value;
  const dist = document.getElementById('dist').value;
  const intensity = document.getElementById('intensity').value / 100;
  const radius = document.getElementById('radius').value;

  document.getElementById('sizeVal').textContent = size+'px';
  document.getElementById('blurVal').textContent = blur+'px';
  document.getElementById('distVal').textContent = dist+'px';
  document.getElementById('intensityVal').textContent = Math.round(intensity*100)+'%';
  document.getElementById('radiusVal').textContent = radius+'px';

  const {r,g,b} = hexToRgb(bg);
  const dark  = `rgba(${Math.max(0,r-50)},${Math.max(0,g-50)},${Math.max(0,b-50)},${intensity})`;
  const light = `rgba(${Math.min(255,r+50)},${Math.min(255,g+50)},${Math.min(255,b+50)},${intensity})`;

  let boxShadow, background;
  if (type === 'raised') {
    boxShadow = `${dist}px ${dist}px ${blur}px ${dark}, -${dist}px -${dist}px ${blur}px ${light}`;
  } else {
    boxShadow = `inset ${dist}px ${dist}px ${blur}px ${dark}, inset -${dist}px -${dist}px ${blur}px ${light}`;
  }

  if (shape === 1) background = `linear-gradient(145deg, ${adjustColor(bg,-20)}, ${adjustColor(bg,20)})`;
  else if (shape === 2) background = `linear-gradient(145deg, ${adjustColor(bg,20)}, ${adjustColor(bg,-20)})`;
  else background = bg;

  const box = document.getElementById('previewBox');
  box.style.background = bg;
  const el = document.getElementById('neuEl');
  el.style.cssText = `width:${size}px;height:${size}px;border-radius:${radius}px;background:${background};box-shadow:${boxShadow};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:rgba(0,0,0,.3);`;

  document.getElementById('cssOut').textContent =
`.neumorphic {
  width: ${size}px;
  height: ${size}px;
  border-radius: ${radius}px;
  background: ${background};
  box-shadow: ${boxShadow};
}`;
}

function copyCss() {
  navigator.clipboard.writeText(document.getElementById('cssOut').textContent).catch(()=>{});
  const btn = document.querySelector('.copy-btn');
  btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy CSS',1500);
}

update();
</script>
</body>
</html>
