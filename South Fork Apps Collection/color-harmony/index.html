<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Harmony Explorer | South Fork Apps</title>
  <meta name="description" content="Explore complementary, analogous, triadic, split-complementary, tetradic, and square color harmonies from any base color. Copy HEX, RGB, or HSL values. Free online color harmony tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(860px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem;}
    h1{margin:0 0 .4rem;font-size:clamp(1.6rem,3.5vw,2.2rem);}
    .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
    .base-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;}
    .base-swatch{width:60px;height:60px;border-radius:10px;border:2px solid rgba(255,255,255,.1);flex-shrink:0;}
    input[type=color]{width:60px;height:60px;border:none;background:none;cursor:pointer;padding:0;border-radius:10px;}
    .base-info{flex:1;}
    .base-hex{font-size:1.1rem;font-weight:800;font-family:monospace;cursor:pointer;}
    .base-hex:hover{color:var(--accent);}
    .base-hsl{font-size:.8rem;color:var(--muted);}
    .harmonies{display:grid;gap:.9rem;}
    .harmony{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;}
    .harmony-name{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.65rem;}
    .swatches{display:flex;gap:.5rem;flex-wrap:wrap;}
    .swatch-wrap{text-align:center;cursor:pointer;}
    .swatch-wrap:hover .swatch{transform:scale(1.05);}
    .swatch{width:70px;height:56px;border-radius:8px;border:1px solid rgba(255,255,255,.08);transition:transform .12s;}
    .swatch-hex{font-size:.7rem;font-family:monospace;color:var(--muted);margin-top:.3rem;font-weight:700;}
    .copied{font-size:.65rem;color:var(--accent);}
    footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
<!-- SFA_ADS_START -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3076043873825717" crossorigin="anonymous"></script>
<!-- SFA_ADS_END -->
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Color Harmony Explorer</span></nav>
<main>
  <h1>Color Harmony Explorer</h1>
  <p class="sub">Pick a base color and explore complementary, analogous, triadic, and more harmonies. Click any swatch to copy its HEX.</p>

  <div class="base-row">
    <input type="color" id="colorPicker" value="#4DA8DA" oninput="update()">
    <div class="base-info">
      <div class="base-hex" id="baseHex" onclick="copyVal('#4DA8DA')">#4DA8DA</div>
      <div class="base-hsl" id="baseHSL"></div>
    </div>
  </div>

  <div class="harmonies" id="harmonies"></div>
  <footer>v1.0 · Click any swatch to copy its HEX value</footer>
</main>
<script>
function hexToHSL(hex) {
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h, s, l=(max+min)/2;
  if(max===min){h=s=0;}else{
    const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}
    h/=6;
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function hslToHex(h, s, l) {
  h=((h%360)+360)%360; s/=100; l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1);};
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}

const HARMONIES = [
  { name:'Complementary', offsets:[0,180] },
  { name:'Analogous (±30°)', offsets:[0,-30,30] },
  { name:'Analogous (±60°)', offsets:[0,-60,60] },
  { name:'Triadic', offsets:[0,120,240] },
  { name:'Split-Complementary', offsets:[0,150,210] },
  { name:'Tetradic (Square)', offsets:[0,90,180,270] },
  { name:'Double Split-Complementary', offsets:[0,30,150,180,210] },
  { name:'Shades', special:'shades' },
  { name:'Tints', special:'tints' },
];

function update() {
  const hex = document.getElementById('colorPicker').value;
  const [h,s,l] = hexToHSL(hex);
  document.getElementById('baseHex').textContent = hex.toUpperCase();
  document.getElementById('baseHex').onclick = ()=>copyVal(hex.toUpperCase());
  document.getElementById('baseHSL').textContent = `hsl(${h}, ${s}%, ${l}%)`;

  document.getElementById('harmonies').innerHTML = HARMONIES.map(harm => {
    let colors;
    if (harm.special === 'shades') {
      colors = [0,15,30,45,60,75].map(d => hslToHex(h, s, Math.max(5, l-d)));
    } else if (harm.special === 'tints') {
      colors = [0,10,20,30,40,50].map(d => hslToHex(h, Math.max(5,s-d), Math.min(95, l+d*0.8)));
    } else {
      colors = harm.offsets.map(off => hslToHex(h+off, s, l));
    }
    const swatches = colors.map(c => {
      const brightness = parseInt(c.slice(1,3),16)*299+parseInt(c.slice(3,5),16)*587+parseInt(c.slice(5,7),16)*114;
      return `<div class="swatch-wrap" onclick="copyVal('${c.toUpperCase()}',this)">
        <div class="swatch" style="background:${c}"></div>
        <div class="swatch-hex">${c.toUpperCase()}</div>
      </div>`;
    }).join('');
    return `<div class="harmony"><div class="harmony-name">${harm.name}</div><div class="swatches">${swatches}</div></div>`;
  }).join('');
}

function copyVal(val, el) {
  navigator.clipboard.writeText(val).catch(()=>{});
  if (el) {
    const hex = el.querySelector('.swatch-hex');
    const orig = hex.textContent; hex.textContent='✓ Copied'; hex.className='copied';
    setTimeout(()=>{hex.textContent=orig;hex.className='swatch-hex';},1500);
  }
}

update();
</script>
</body>
</html>
