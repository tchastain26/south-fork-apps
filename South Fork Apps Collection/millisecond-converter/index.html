<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millisecond Converter | South Fork Apps</title>
  <meta name="description" content="Convert milliseconds to seconds, minutes, hours, and more. Free online time unit converter for developers.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412;
      --surface: #1a1f1b;
      --surface-2: #202722;
      --border: #2a2f2b;
      --accent: #7ddb84;
      --text: #e8e8e8;
      --muted: #aab5ac;
      --danger: #ff9f9f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-back {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .nav-back:hover { text-decoration: underline; }
    .nav-title {
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
    }
    main {
      width: min(640px, calc(100% - 2rem));
      margin: 3rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: var(--border); font-weight: 400; }
    input[type="text"]:focus { border-color: var(--accent); }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .result-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }
    .result-value.accent { color: var(--accent); }
    .breakdown-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .breakdown-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
    }
    .breakdown-text.empty { color: var(--muted); font-weight: 400; }
    .copy-btn {
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { background: var(--border); border-color: var(--accent); }
    .copy-btn:disabled { color: var(--muted); cursor: default; border-color: var(--border); }
    .copy-btn.copied { color: var(--accent); border-color: var(--accent); }
    .empty-state { color: var(--border); font-size: 1.4rem; font-weight: 700; }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 420px) {
      .results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">Millisecond Converter</span>
</nav>

<main>
  <div>
    <h1>Millisecond <span>Converter</span></h1>
    <p class="subtitle">Paste a millisecond value. See it in every unit that matters.</p>
  </div>

  <div class="input-group">
    <label for="ms-input">Milliseconds</label>
    <input
      type="text"
      id="ms-input"
      placeholder="e.g. 86400000"
      autocomplete="off"
      spellcheck="false"
    >
  </div>

  <div class="results">
    <div class="result-card">
      <div class="result-label">Seconds</div>
      <div class="result-value" id="out-seconds"><span class="empty-state">—</span></div>
    </div>
    <div class="result-card">
      <div class="result-label">Minutes</div>
      <div class="result-value" id="out-minutes"><span class="empty-state">—</span></div>
    </div>
    <div class="result-card">
      <div class="result-label">Hours</div>
      <div class="result-value" id="out-hours"><span class="empty-state">—</span></div>
    </div>
    <div class="result-card">
      <div class="result-label">Days</div>
      <div class="result-value" id="out-days"><span class="empty-state">—</span></div>
    </div>
  </div>

  <div class="breakdown-card">
    <div class="breakdown-text empty" id="out-breakdown">Enter a value to see a readable breakdown.</div>
    <button class="copy-btn" id="copy-btn" disabled>Copy</button>
  </div>

  <p class="hint">Commas and underscores are stripped automatically (e.g. 86_400_000 or 86,400,000)</p>
</main>

<script>
  const input = document.getElementById('ms-input');
  const outSeconds = document.getElementById('out-seconds');
  const outMinutes = document.getElementById('out-minutes');
  const outHours = document.getElementById('out-hours');
  const outDays = document.getElementById('out-days');
  const outBreakdown = document.getElementById('out-breakdown');
  const copyBtn = document.getElementById('copy-btn');

  const EMPTY = '<span class="empty-state">—</span>';

  function fmt(n, decimals = 4) {
    if (!isFinite(n)) return '—';
    const s = n.toLocaleString('en-US', {
      maximumFractionDigits: decimals,
      minimumFractionDigits: 0,
    });
    return s;
  }

  function buildBreakdown(ms) {
    if (ms === 0) return '0 milliseconds';

    const negative = ms < 0;
    const abs = Math.abs(ms);

    const totalSeconds = Math.floor(abs / 1000);
    const totalMinutes = Math.floor(abs / 60000);
    const totalHours = Math.floor(abs / 3600000);
    const days = Math.floor(abs / 86400000);

    const remAfterDays = abs - days * 86400000;
    const hours = Math.floor(remAfterDays / 3600000);
    const remAfterHours = remAfterDays - hours * 3600000;
    const minutes = Math.floor(remAfterHours / 60000);
    const remAfterMinutes = remAfterHours - minutes * 60000;
    const seconds = Math.floor(remAfterMinutes / 1000);
    const remMs = remAfterMinutes - seconds * 1000;

    const parts = [];
    if (days > 0) parts.push(`${days.toLocaleString()} day${days !== 1 ? 's' : ''}`);
    if (hours > 0) parts.push(`${hours} hour${hours !== 1 ? 's' : ''}`);
    if (minutes > 0) parts.push(`${minutes} minute${minutes !== 1 ? 's' : ''}`);
    if (seconds > 0) parts.push(`${seconds} second${seconds !== 1 ? 's' : ''}`);
    if (remMs > 0) parts.push(`${remMs} ms`);

    if (parts.length === 0) parts.push('0 ms');

    return (negative ? '−' : '') + parts.join(', ');
  }

  function convert() {
    const raw = input.value.replace(/[,_\s]/g, '');
    if (raw === '' || raw === '-') {
      outSeconds.innerHTML = EMPTY;
      outMinutes.innerHTML = EMPTY;
      outHours.innerHTML = EMPTY;
      outDays.innerHTML = EMPTY;
      outBreakdown.textContent = 'Enter a value to see a readable breakdown.';
      outBreakdown.className = 'breakdown-text empty';
      copyBtn.disabled = true;
      return;
    }

    const ms = parseFloat(raw);
    if (isNaN(ms)) {
      outSeconds.innerHTML = EMPTY;
      outMinutes.innerHTML = EMPTY;
      outHours.innerHTML = EMPTY;
      outDays.innerHTML = EMPTY;
      outBreakdown.textContent = 'Not a valid number.';
      outBreakdown.className = 'breakdown-text empty';
      copyBtn.disabled = true;
      return;
    }

    const seconds = ms / 1000;
    const minutes = ms / 60000;
    const hours = ms / 3600000;
    const days = ms / 86400000;

    outSeconds.innerHTML = `<span class="accent">${fmt(seconds)}</span>`;
    outMinutes.innerHTML = `<span class="accent">${fmt(minutes)}</span>`;
    outHours.innerHTML = `<span class="accent">${fmt(hours)}</span>`;
    outDays.innerHTML = `<span class="accent">${fmt(days)}</span>`;

    const breakdown = buildBreakdown(ms);
    outBreakdown.textContent = breakdown;
    outBreakdown.className = 'breakdown-text';
    copyBtn.disabled = false;
  }

  input.addEventListener('input', convert);

  copyBtn.addEventListener('click', () => {
    const text = outBreakdown.textContent;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  });
</script>


<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
