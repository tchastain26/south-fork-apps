<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inflation Calculator | South Fork Apps</title>
  <meta name="description" content="Calculate the inflation-adjusted value of money over time. See what a dollar from any year is worth today or in the future. Free online inflation calculator.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(640px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem;}
    h1{margin:0 0 .4rem;font-size:clamp(1.6rem,3.5vw,2.2rem);}
    .sub{margin:0 0 1.5rem;color:var(--muted);line-height:1.6;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
    .field{margin-bottom:.9rem;}
    label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.35rem;}
    .input-wrap{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .input-wrap:focus-within{border-color:var(--accent);}
    .input-prefix{padding:0 .7rem;color:var(--muted);font-weight:700;font-size:.9rem;}
    .input-wrap input,.plain-input{flex:1;background:transparent;color:var(--text);border:none;padding:.65rem .5rem;font:inherit;font-size:.95rem;outline:none;}
    .plain-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.65rem .8rem;width:100%;}
    .plain-input:focus{border-color:var(--accent);outline:none;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
    .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem;}
    .result-card{background:var(--surface2);border-radius:8px;padding:.85rem;text-align:center;}
    .result-val{font-size:1.4rem;font-weight:800;color:var(--accent);}
    .result-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:.2rem;}
    .note{font-size:.78rem;color:var(--muted);line-height:1.55;margin-top:.75rem;padding:.7rem;background:var(--surface2);border-radius:8px;}
    footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
<!-- SFA_ADS_START -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3076043873825717" crossorigin="anonymous"></script>
<!-- SFA_ADS_END -->
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Inflation Calculator</span></nav>
<main>
  <h1>Inflation Calculator</h1>
  <p class="sub">See what a dollar amount from one year is worth in another year, adjusted for inflation.</p>

  <div class="card">
    <div class="field">
      <label>Amount</label>
      <div class="input-wrap"><span class="input-prefix">$</span><input type="number" id="amount" value="1000" min="0" oninput="calc()"></div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>From year</label>
        <input class="plain-input" type="number" id="fromYear" value="2000" min="1913" max="2030" oninput="calc()">
      </div>
      <div class="field">
        <label>To year</label>
        <input class="plain-input" type="number" id="toYear" value="2024" min="1913" max="2030" oninput="calc()">
      </div>
    </div>
    <div class="field">
      <label>Annual inflation rate (%)</label>
      <input class="plain-input" type="number" id="rate" value="3.1" min="0" step="0.1" oninput="calc()">
    </div>
  </div>

  <div class="results" id="results"></div>

  <div class="note">The default 3.1% approximates US average CPI inflation since 1913. Edit the rate to use your own figure or a specific period's average.</div>

  <footer>v1.0</footer>
</main>
<script>
function fmt(n) {
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
}

function calc() {
  const amount = +document.getElementById('amount').value;
  const fromY  = +document.getElementById('fromYear').value;
  const toY    = +document.getElementById('toYear').value;
  const rate   = +document.getElementById('rate').value / 100;
  if (!amount || !fromY || !toY || rate < 0) return;

  const years = toY - fromY;
  const adjusted = amount * Math.pow(1 + rate, years);
  const pctChange = ((adjusted - amount) / amount) * 100;
  const powerLost = amount - amount / Math.pow(1 + rate, years);

  const items = [
    { label: `${fmt(amount)} in ${fromY} equals`, val: fmt(adjusted) + ` in ${toY}` },
    { label: 'Cumulative inflation', val: pctChange.toFixed(1) + '%' },
    { label: 'Purchasing power lost', val: fmt(powerLost) },
    { label: 'Years', val: Math.abs(years).toString() },
  ];

  document.getElementById('results').innerHTML = items.map(it => `
    <div class="result-card">
      <div class="result-val" style="font-size:${it.val.length > 10 ? '1.1rem' : '1.4rem'}">${it.val}</div>
      <div class="result-label">${it.label}</div>
    </div>`).join('');
}

calc();
</script>
</body>
</html>
