<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Payment Calculator | South Fork Apps</title>
  <meta name="description" content="Calculate monthly loan payments, total interest, and a full amortization schedule. Free online loan calculator.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --danger: #f28b82; --radius: 12px;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 0; }
    .inputs { padding: 20px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--border); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .input-row { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .input-prefix { padding: 0 10px; font-size: 14px; color: var(--text-dim); font-weight: 700; background: var(--surface2); border-right: 1px solid var(--border); height: 40px; display: flex; align-items: center; }
    input[type=number] { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font); font-size: 15px; font-weight: 700; padding: 10px 12px; }
    .results { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .result-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
    .result-label { font-size: 12px; color: var(--text-mid); }
    .result-value { font-size: 20px; font-weight: 800; color: var(--primary); }
    .result-value.danger { color: var(--danger); }
    .main-content { display: flex; flex-direction: column; }
    .content-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); display: flex; justify-content: space-between; align-items: center; }
    .amort-table { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface); padding: 8px 12px; text-align: right; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); position: sticky; top: 0; }
    th:first-child { text-align: left; }
    td { padding: 7px 12px; text-align: right; border-bottom: 1px solid rgba(63,73,62,.4); font-variant-numeric: tabular-nums; }
    td:first-child { text-align: left; color: var(--text-dim); }
    td.principal { color: var(--primary); }
    td.interest { color: var(--danger); }
    tr:hover td { background: var(--surface); }
    .btn { font-size: 11px; font-weight: 700; background: transparent; border: 1px solid var(--border); color: var(--text-mid); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-family: var(--font); }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .empty { color: var(--text-dim); font-size: 13px; padding: 20px; }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Loan Payment Calculator</h1>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="inputs">
      <div class="field">
        <label>Loan Amount</label>
        <div class="input-row"><span class="input-prefix">$</span><input type="number" id="principal" value="25000" min="1" oninput="calc()"></div>
      </div>
      <div class="field">
        <label>Annual Interest Rate</label>
        <div class="input-row"><input type="number" id="rate" value="6.5" min="0" step="0.1" oninput="calc()"><span class="input-prefix" style="border-left:1px solid var(--border);border-right:none;">%</span></div>
      </div>
      <div class="field">
        <label>Loan Term</label>
        <div class="input-row"><input type="number" id="years" value="5" min="1" max="50" oninput="calc()"><span class="input-prefix" style="border-left:1px solid var(--border);border-right:none;">yrs</span></div>
      </div>
    </div>
    <div class="results" id="resultsEl">
      <p class="empty">Enter loan details above.</p>
    </div>
  </div>
  <div class="main-content">
    <div class="content-header">
      <span>Amortization Schedule</span>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="amort-table">
      <table id="amortTable">
        <thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
        <tbody id="amortBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let schedule = [];

function fmt(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function calc() {
  const P = parseFloat(document.getElementById('principal').value) || 0;
  const annualRate = parseFloat(document.getElementById('rate').value) || 0;
  const years = parseInt(document.getElementById('years').value) || 0;

  if (!P || !years) { document.getElementById('resultsEl').innerHTML = '<p class="empty">Enter loan details above.</p>'; document.getElementById('amortBody').innerHTML = ''; return; }

  const r = annualRate / 100 / 12;
  const n = years * 12;
  const payment = r === 0 ? P / n : P * (r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);

  let balance = P, totalInterest = 0;
  schedule = [];

  for (let i = 1; i <= n; i++) {
    const interest = balance * r;
    const principal = payment - interest;
    balance -= principal;
    totalInterest += interest;
    schedule.push({ month: i, payment, principal, interest, balance: Math.max(0, balance) });
  }

  const totalPaid = payment * n;
  document.getElementById('resultsEl').innerHTML = `
    <div class="result-item"><span class="result-label">Monthly Payment</span><span class="result-value">${fmt(payment)}</span></div>
    <div class="result-item"><span class="result-label">Total Interest</span><span class="result-value danger">${fmt(totalInterest)}</span></div>
    <div class="result-item"><span class="result-label">Total Paid</span><span class="result-value">${fmt(totalPaid)}</span></div>
    <div class="result-item"><span class="result-label">Payoff Date</span><span class="result-value" style="font-size:14px">${payoffDate(n)}</span></div>
  `;

  const today = new Date();
  document.getElementById('amortBody').innerHTML = schedule.map(row => `
    <tr>
      <td>${monthLabel(row.month)}</td>
      <td>${fmt(row.payment)}</td>
      <td class="principal">${fmt(row.principal)}</td>
      <td class="interest">${fmt(row.interest)}</td>
      <td>${fmt(row.balance)}</td>
    </tr>
  `).join('');
}

function monthLabel(m) {
  const d = new Date(); d.setMonth(d.getMonth() + m);
  return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function payoffDate(n) {
  const d = new Date(); d.setMonth(d.getMonth() + n);
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function exportCSV() {
  if (!schedule.length) return;
  const lines = ['Month,Payment,Principal,Interest,Balance'];
  schedule.forEach((r,i) => lines.push(`${monthLabel(r.month)},${r.payment.toFixed(2)},${r.principal.toFixed(2)},${r.interest.toFixed(2)},${r.balance.toFixed(2)}`));
  navigator.clipboard.writeText(lines.join('\n'));
}

calc();
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
