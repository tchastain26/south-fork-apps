<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome | South Fork Apps</title>
  <meta name="description" content="Free online metronome with BPM slider, tap tempo, visual beat, and audio click. Works in your browser with no install.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111412; --surface:#1a1f1b; --surface-2:#202722; --border:#2a2f2b; --accent:#7ddb84; --text:#e8e8e8; --muted:#aab5ac; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; }
    .nav { display:flex; align-items:center; gap:1rem; padding:.75rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); }
    .nav a { color:var(--accent); text-decoration:none; font-size:.875rem; font-weight:500; }
    .nav a:hover { text-decoration:underline; }
    .nav-title { color:var(--text); font-size:.875rem; font-weight:600; }
    main { width:min(560px,calc(100% - 2rem)); margin:0 auto; padding:2rem 0; display:flex; flex-direction:column; gap:1rem; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1.5rem; }
    h1 { margin:0 0 .4rem; font-size:clamp(2rem,7vw,3.5rem); line-height:1; }
    .sub { color:var(--muted); margin:0 0 1.5rem; line-height:1.6; }
    .bpm-display { text-align:center; margin-bottom:1rem; }
    .bpm-num { font-size:5rem; font-weight:800; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; }
    .bpm-label { font-size:.875rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
    .tempo-name { font-size:.875rem; color:var(--muted); margin-top:.25rem; min-height:1.4em; }
    input[type="range"] { width:100%; accent-color:var(--accent); height:6px; margin:.5rem 0 .25rem; }
    .range-labels { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-bottom:1rem; }
    .beat-indicator { width:60px; height:60px; border-radius:50%; background:var(--surface-2); border:3px solid var(--border); margin:1rem auto; transition:background .04s, border-color .04s; }
    .beat-indicator.flash { background:var(--accent); border-color:var(--accent); }
    .btn-row { display:flex; gap:.75rem; }
    .btn-start { flex:2; min-height:3.2rem; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#102113; font:inherit; font-weight:800; font-size:1.1rem; cursor:pointer; }
    .btn-start:hover { background:#5ec966; }
    .btn-tap { flex:1; min-height:3.2rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font:inherit; font-weight:700; cursor:pointer; }
    .btn-tap:hover { border-color:var(--accent); }
    .presets { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; margin-top:1rem; }
    .preset { padding:.5rem; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); color:var(--muted); font:inherit; font-size:.75rem; font-weight:700; cursor:pointer; text-align:center; }
    .preset:hover { border-color:var(--accent); color:var(--accent); }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:.75rem; }
    @media(max-width:480px) { .nav { padding-inline:1rem; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="https://southforkapps.com">← South Fork Apps</a>
    <span class="nav-title">Metronome</span>
  </nav>
  <main>
    <div class="panel">
      <h1>Keep time.</h1>
      <p class="sub">Set your BPM, tap to find a tempo, or pick a preset.</p>

      <div class="bpm-display">
        <div class="bpm-num" id="bpmNum">120</div>
        <div class="bpm-label">BPM</div>
        <div class="tempo-name" id="tempoName">Allegro</div>
      </div>

      <input type="range" id="bpmSlider" min="20" max="280" value="120" oninput="setBpm(this.value)">
      <div class="range-labels"><span>20</span><span>280</span></div>

      <div class="beat-indicator" id="beat"></div>

      <div class="btn-row">
        <button class="btn-start" id="startBtn" onclick="startStop()">▶ Start</button>
        <button class="btn-tap" onclick="tap()">Tap</button>
      </div>

      <div class="presets">
        <button class="preset" onclick="setBpm(52)">Largo<br>52</button>
        <button class="preset" onclick="setBpm(66)">Adagio<br>66</button>
        <button class="preset" onclick="setBpm(84)">Andante<br>84</button>
        <button class="preset" onclick="setBpm(108)">Moderato<br>108</button>
        <button class="preset" onclick="setBpm(132)">Allegro<br>132</button>
        <button class="preset" onclick="setBpm(176)">Presto<br>176</button>
      </div>
      <footer>v1.0</footer>
    </div>
  </main>

  <script>
    let bpm = 120, running = false, interval = null, ctx = null;
    let tapTimes = [], tapTimeout = null;

    const TEMPOS = [[20,'Larghissimo'],[40,'Grave'],[60,'Largo'],[66,'Larghetto'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[156,'Allegro'],[176,'Vivace'],[200,'Presto'],[220,'Prestissimo']];

    function getTempoName(b) {
      let name = TEMPOS[0][1];
      for (const [limit, n] of TEMPOS) { if (b >= limit) name = n; }
      return name;
    }

    function setBpm(val) {
      bpm = Math.min(Math.max(parseInt(val), 20), 280);
      document.getElementById('bpmNum').textContent = bpm;
      document.getElementById('bpmSlider').value = bpm;
      document.getElementById('tempoName').textContent = getTempoName(bpm);
      if (running) { clearInterval(interval); scheduleBeats(); }
    }

    function click() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.05);
      const beat = document.getElementById('beat');
      beat.classList.add('flash');
      setTimeout(() => beat.classList.remove('flash'), 60);
    }

    function scheduleBeats() {
      click();
      interval = setInterval(click, (60 / bpm) * 1000);
    }

    function startStop() {
      if (running) {
        clearInterval(interval); running = false;
        document.getElementById('startBtn').textContent = '▶ Start';
      } else {
        running = true;
        document.getElementById('startBtn').textContent = '■ Stop';
        scheduleBeats();
      }
    }

    function tap() {
      const now = Date.now();
      tapTimes.push(now);
      clearTimeout(tapTimeout);
      tapTimeout = setTimeout(() => { tapTimes = []; }, 2500);
      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
        const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
        setBpm(Math.round(60000/avg));
      }
    }
  </script>
</body>
</html>
