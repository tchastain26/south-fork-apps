<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(820px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;text-align:center;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1.5rem;color:var(--muted);line-height:1.6;}
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
  @media(max-width:560px){.layout{grid-template-columns:1fr;}}
  .staff-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;}
  .staff-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.75rem;}
  svg.staff{width:100%;height:120px;}
  .info-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.75rem;justify-content:center;}
  .note-big{font-size:2.5rem;font-weight:800;color:var(--accent);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
  .info-item .lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .info-item .val{font-size:.9rem;font-weight:700;color:var(--text);}
  .piano-wrap{overflow-x:auto;padding-bottom:.5rem;margin-bottom:.5rem;}
  .piano{display:inline-flex;position:relative;height:110px;user-select:none;}
  .wk{width:32px;height:90px;background:#e8ece9;border:1.5px solid #555;border-radius:0 0 4px 4px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;margin-right:1px;flex-shrink:0;transition:background .08s;}
  .wk:hover{background:#c8e8ca;}
  .wk.active{background:#7ddb84;}
  .wk .nl{font-size:.52rem;font-weight:700;color:#333;pointer-events:none;}
  .bk{width:20px;height:55px;background:#1a1a1a;border:1.5px solid #000;border-radius:0 0 3px 3px;position:relative;margin-left:-10px;margin-right:-10px;z-index:2;flex-shrink:0;cursor:pointer;transition:background .08s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;}
  .bk:hover{background:#222;}
  .bk.active{background:#2d7a30;}
  .bk .nl{font-size:.47rem;font-weight:700;color:#888;pointer-events:none;}
  .hint{font-size:.75rem;color:var(--muted);}
  footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;}

<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Piano Notes on Staff</span></nav>
<main>
  <h1>Piano Notes on Staff</h1>
  <p class="sub">Click any piano key to see the note placed on the treble and bass clef staff.</p>
  <div class="layout">
    <div class="staff-panel">
      <div class="staff-title">Treble Clef</div>
      <svg class="staff" id="trebleStaff" viewBox="0 0 300 120"></svg>
    </div>
    <div class="info-panel" id="infoPanel">
      <p style="color:var(--muted);font-size:.85rem">Click a key to see the note</p>
    </div>
  </div>
  <div class="staff-panel" style="margin-bottom:1.25rem">
    <div class="staff-title">Bass Clef</div>
    <svg class="staff" id="bassStaff" viewBox="0 0 300 120"></svg>
  </div>
  <div class="piano-wrap"><div class="piano" id="piano"></div></div>
  <p class="hint">Covers C2 through C6 (4 octaves)</p>
  <footer>v1.0</footer>
</main>
<script>
const NOTES_S=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const IS_BLACK=[false,true,false,true,false,false,true,false,true,false,true,false];
let audioCtx=null,activeEl=null;

// Staff drawing: 5 lines, lineY array, note positions relative to staff
const T_LINES=[20,32,44,56,68]; // treble staff line y
const B_LINES=[20,32,44,56,68]; // bass staff line y

// Treble: bottom line = E4 (MIDI 64), each staff step = 6px up
// Position 0 = bottom line (E4), step +1 = next space/line up
// MIDI to treble position: (midi - 64) * 0.5... actually:
// Treble line notes (bottom to top): E4(0) G4(2) B4(4) D5(6) F5(8)
// Position in half-steps on staff (0=E4 line, 1=F4 space, 2=G4 line...)
function midiToTreblePos(midi){
  // staff pos: 0 = E4 bottom line
  // notes per octave: C=0, D=1, E=2, F=3, G=4, A=5, B=6 (diatonic positions)
  const NOTE_DEG=[0,0,1,1,2,3,3,4,4,5,5,6]; // chromatic to diatonic step
  const E4_MIDI=64;
  const noteIdx=midi%12;
  const octave=Math.floor(midi/12)-Math.floor(E4_MIDI/12);
  const noteDeg=NOTE_DEG[noteIdx];
  const e4Deg=NOTE_DEG[E4_MIDI%12];
  return (octave*7+noteDeg-e4Deg);
}

function midiToBassPos(midi){
  const G2_MIDI=43;
  const NOTE_DEG=[0,0,1,1,2,3,3,4,4,5,5,6];
  const noteIdx=midi%12;
  const octave=Math.floor(midi/12)-Math.floor(G2_MIDI/12);
  const noteDeg=NOTE_DEG[noteIdx];
  const g2Deg=NOTE_DEG[G2_MIDI%12];
  return (octave*7+noteDeg-g2Deg);
}

function isNatural(midi){return !IS_BLACK[midi%12];}

function drawStaff(svgId,clef,noteMidi){
  const svg=document.getElementById(svgId);
  const W=300,lineY=[20,32,44,56,68],noteX=200;
  let html='';
  lineY.forEach(y=>html+=`<line x1="40" y1="${y}" x2="280" y2="${y}" stroke="#3a4a3b" stroke-width="1.5"/>`);
  if(clef==='treble'){
    html+=`<text x="42" y="76" font-size="58" fill="#aab5ac" font-family="serif">𝄞</text>`;
  } else {
    html+=`<text x="42" y="58" font-size="40" fill="#aab5ac" font-family="serif">𝄢</text>`;
  }
  if(noteMidi!==null){
    const pos=clef==='treble'?midiToTreblePos(noteMidi):midiToBassPos(noteMidi);
    const noteY=lineY[4]-pos*6;
    const isAcc=IS_BLACK[noteMidi%12];
    // Ledger lines
    if(pos<0){for(let p=0;p>=pos;p-=2){if(p%2===0){const ly=lineY[4]-p*6;html+=`<line x1="${noteX-13}" y1="${ly}" x2="${noteX+13}" y2="${ly}" stroke="#aab5ac" stroke-width="1.5"/>`;}} }
    if(pos>8){for(let p=10;p<=pos;p+=2){const ly=lineY[4]-p*6;html+=`<line x1="${noteX-13}" y1="${ly}" x2="${noteX+13}" y2="${ly}" stroke="#aab5ac" stroke-width="1.5"/>`;}}
    // Accidental
    if(isAcc)html+=`<text x="${noteX-20}" y="${noteY+4}" font-size="16" fill="#aab5ac" font-family="serif">♯</text>`;
    // Note head
    html+=`<ellipse cx="${noteX}" cy="${noteY}" rx="10" ry="7.5" fill="#7ddb84" transform="rotate(-15,${noteX},${noteY})"/>`;
    // Stem
    const stemDir=pos>=4?-1:1;
    const stemX=stemDir===1?noteX+9:noteX-9;
    html+=`<line x1="${stemX}" y1="${noteY}" x2="${stemX}" y2="${noteY+stemDir*36}" stroke="#7ddb84" stroke-width="2"/>`;
    // "Out of range" indicator
    const inTreble=noteMidi>=52&&noteMidi<=88;
    const inBass=noteMidi>=28&&noteMidi<=64;
    if((clef==='treble'&&!inTreble)||(clef==='bass'&&!inBass)){
      html+=`<text x="240" y="90" font-size="9" fill="#ff9980" font-family="sans-serif">out of range</text>`;
    }
  }
  svg.innerHTML=html;
}

function playNote(midi){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const freq=440*Math.pow(2,(midi-69)/12);
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type='triangle';osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.35,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.0);
  osc.start();osc.stop(audioCtx.currentTime+1.0);
}

function selectNote(midi,el){
  if(activeEl){activeEl.classList.remove('active');}
  el.classList.add('active');activeEl=el;
  playNote(midi);
  drawStaff('trebleStaff','treble',midi);
  drawStaff('bassStaff','bass',midi);
  const noteName=NOTES_S[midi%12];
  const octave=Math.floor(midi/12)-1;
  const freq=(440*Math.pow(2,(midi-69)/12)).toFixed(2);
  document.getElementById('infoPanel').innerHTML=`
    <div class="note-big">${noteName}<sub style="font-size:1.2rem">${octave}</sub></div>
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Note</div><div class="val">${noteName}</div></div>
      <div class="info-item"><div class="lbl">Octave</div><div class="val">${octave}</div></div>
      <div class="info-item"><div class="lbl">MIDI #</div><div class="val">${midi}</div></div>
      <div class="info-item"><div class="lbl">Frequency</div><div class="val">${freq} Hz</div></div>
    </div>`;
}

function buildPiano(){
  const piano=document.getElementById('piano');
  let html='';
  // C2 (MIDI 36) to C6 (MIDI 84)
  for(let midi=36;midi<=84;midi++){
    const semi=midi%12;
    const noteName=NOTES_S[semi];
    const octave=Math.floor(midi/12)-1;
    const isBlack=IS_BLACK[semi];
    if(isBlack){
      html+=`<div class="bk" onclick="selectNote(${midi},this)"><span class="nl">${noteName}</span></div>`;
    } else {
      html+=`<div class="wk" onclick="selectNote(${midi},this)"><span class="nl">${noteName}${octave}</span></div>`;
      if(midi<84&&IS_BLACK[(semi+1)%12]){
        // black key will follow
      }
    }
  }
  piano.innerHTML=html;
}

drawStaff('trebleStaff','treble',null);
drawStaff('bassStaff','bass',null);
buildPiano();
</script>
</body>
</html>
