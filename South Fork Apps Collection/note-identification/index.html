<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(600px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;text-align:center;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1rem;color:var(--muted);line-height:1.6;}
  .config-row{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.25rem;}
  .cfg{display:flex;flex-direction:column;gap:.3rem;text-align:left;}
  label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:7px;font:inherit;font-size:.85rem;cursor:pointer;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.25rem;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem;}
  .stat-val{font-size:1.4rem;font-weight:800;color:var(--accent);}
  .stat-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.15rem;}
  .staff-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1.25rem;}
  svg.staff{width:100%;max-width:400px;height:140px;}
  .feedback{font-size:1.1rem;font-weight:700;min-height:1.8rem;margin-bottom:.85rem;}
  .feedback.correct{color:var(--accent);}
  .feedback.wrong{color:#ff7a6a;}
  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem;}
  @media(max-width:400px){.choices{grid-template-columns:repeat(3,1fr);}}
  .choice-btn{padding:.55rem .25rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .12s;}
  .choice-btn:hover{border-color:var(--accent);color:var(--accent);}
  .choice-btn.correct{border-color:var(--accent);background:rgba(125,219,132,.15);color:var(--accent);}
  .choice-btn.wrong{border-color:#ff7a6a;background:rgba(255,122,106,.1);color:#ff7a6a;}
  .choice-btn:disabled{cursor:default;}
  .play-btn{padding:.45rem 1rem;border:1px solid var(--accent);border-radius:7px;background:transparent;color:var(--accent);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:.5rem;}
  footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Note Identification</span></nav>
<main>
  <h1>Note Identification</h1>
  <p class="sub">Identify the note shown on the staff. Select the correct letter name.</p>
  <div class="config-row">
    <div class="cfg">
      <label>Clef</label>
      <select id="clef">
        <option value="treble">Treble Clef</option>
        <option value="bass">Bass Clef</option>
      </select>
    </div>
    <div class="cfg">
      <label>Range</label>
      <select id="range">
        <option value="easy">Easy (lines only)</option>
        <option value="medium" selected>Medium (lines + spaces)</option>
        <option value="hard">Hard (with ledger lines)</option>
      </select>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">Score</div></div>
    <div class="stat"><div class="stat-val" id="streak">0</div><div class="stat-label">Streak</div></div>
    <div class="stat"><div class="stat-val" id="acc">—</div><div class="stat-label">Accuracy</div></div>
  </div>
  <div class="staff-wrap">
    <svg class="staff" id="staff" viewBox="0 0 400 140"></svg>
  </div>
  <button class="play-btn" id="playBtn" onclick="playCurrentNote()">▶ Hear note</button>
  <div class="feedback" id="feedback">&nbsp;</div>
  <div class="choices" id="choices"></div>
  <footer>v1.0</footer>
</main>
<script>
// Treble clef notes: position 0 = E4 (bottom line), each step = half step up on staff
// Staff positions (0=bottom line E4, 1=F4 space, 2=G4, 3=A4, 4=B4, 5=C5, 6=D5, 7=E5, 8=F5, 9=G5, 10=A5)
const TREBLE_NOTES=[
  {pos:-2,note:'C4',label:'C',midi:60}, // ledger below
  {pos:-1,note:'D4',label:'D',midi:62},
  {pos:0, note:'E4',label:'E',midi:64}, // bottom line
  {pos:1, note:'F4',label:'F',midi:65},
  {pos:2, note:'G4',label:'G',midi:67},
  {pos:3, note:'A4',label:'A',midi:69},
  {pos:4, note:'B4',label:'B',midi:71},
  {pos:5, note:'C5',label:'C',midi:72},
  {pos:6, note:'D5',label:'D',midi:74},
  {pos:7, note:'E5',label:'E',midi:76},
  {pos:8, note:'F5',label:'F',midi:77},
  {pos:9, note:'G5',label:'G',midi:79},
  {pos:10,note:'A5',label:'A',midi:81},
  {pos:11,note:'B5',label:'B',midi:83},
  {pos:12,note:'C6',label:'C',midi:84}, // ledger above
];
const BASS_NOTES=[
  {pos:-2,note:'E2',label:'E',midi:40},
  {pos:-1,note:'F2',label:'F',midi:41},
  {pos:0, note:'G2',label:'G',midi:43},
  {pos:1, note:'A2',label:'A',midi:45},
  {pos:2, note:'B2',label:'B',midi:47},
  {pos:3, note:'C3',label:'C',midi:48},
  {pos:4, note:'D3',label:'D',midi:50},
  {pos:5, note:'E3',label:'E',midi:52},
  {pos:6, note:'F3',label:'F',midi:53},
  {pos:7, note:'G3',label:'G',midi:55},
  {pos:8, note:'A3',label:'A',midi:57},
  {pos:9, note:'B3',label:'B',midi:59},
  {pos:10,note:'C4',label:'C',midi:60},
  {pos:11,note:'D4',label:'D',midi:62},
  {pos:12,note:'E4',label:'E',midi:64},
];

let currentNote=null,score=0,total=0,streak=0,answered=false;
let audioCtx=null;

function getRange(){
  const r=document.getElementById('range').value;
  const notes=document.getElementById('clef').value==='treble'?TREBLE_NOTES:BASS_NOTES;
  if(r==='easy') return notes.filter(n=>n.pos>=0&&n.pos<=8&&n.pos%2===0);
  if(r==='medium') return notes.filter(n=>n.pos>=0&&n.pos<=8);
  return notes;
}

function drawStaff(note){
  const svg=document.getElementById('staff');
  const W=400,H=140;
  const lineY=[40,52,64,76,88]; // 5 staff lines
  const noteX=200;
  const clef=document.getElementById('clef').value;
  let html='';
  // Staff lines
  lineY.forEach(y=>html+=`<line x1="60" y1="${y}" x2="340" y2="${y}" stroke="#3a4a3b" stroke-width="1.5"/>`);
  // Clef
  if(clef==='treble'){
    html+=`<text x="65" y="90" font-size="72" fill="#aab5ac" font-family="serif" style="font-weight:normal">𝄞</text>`;
  } else {
    html+=`<text x="65" y="72" font-size="48" fill="#aab5ac" font-family="serif">𝄢</text>`;
  }
  // Calculate note Y position
  // pos 0 = bottom staff line (y=88), each step = 6px up
  const noteY=lineY[4]-note.pos*6;
  // Ledger lines
  if(note.pos<0){
    for(let p=note.pos;p<0;p+=2){
      const ly=lineY[4]-p*6;
      if(p%2===0)html+=`<line x1="${noteX-14}" y1="${ly}" x2="${noteX+14}" y2="${ly}" stroke="#aab5ac" stroke-width="1.5"/>`;
    }
  }
  if(note.pos>8){
    for(let p=10;p<=note.pos;p+=2){
      const ly=lineY[4]-p*6;
      if(p%2===0)html+=`<line x1="${noteX-14}" y1="${ly}" x2="${noteX+14}" y2="${ly}" stroke="#aab5ac" stroke-width="1.5"/>`;
    }
  }
  // Note head
  html+=`<ellipse cx="${noteX}" cy="${noteY}" rx="11" ry="8.5" fill="#7ddb84" transform="rotate(-15,${noteX},${noteY})"/>`;
  // Stem
  const stemDir=note.pos>=4?-1:1;
  const stemX=stemDir===1?noteX+10:noteX-10;
  html+=`<line x1="${stemX}" y1="${noteY}" x2="${stemX}" y2="${noteY+stemDir*40}" stroke="#7ddb84" stroke-width="2"/>`;
  svg.innerHTML=html;
}

function playCurrentNote(){
  if(!currentNote)return;
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const freq=440*Math.pow(2,(currentNote.midi-69)/12);
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type='sine';osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.0);
  osc.start();osc.stop(audioCtx.currentTime+1.0);
}

function buildChoices(correct){
  const allLabels=['C','D','E','F','G','A','B'];
  const others=allLabels.filter(l=>l!==correct.label);
  const wrong=others.sort(()=>Math.random()-.5).slice(0,3);
  const choices=[correct.label,...wrong].sort(()=>Math.random()-.5);
  return choices;
}

function nextQuestion(){
  answered=false;
  document.getElementById('feedback').textContent=' ';
  document.getElementById('feedback').className='feedback';
  const pool=getRange();
  currentNote=pool[Math.floor(Math.random()*pool.length)];
  drawStaff(currentNote);
  const choices=buildChoices(currentNote);
  document.getElementById('choices').innerHTML=choices.map(c=>
    `<button class="choice-btn" onclick="answer('${c}')">${c}</button>`
  ).join('');
}

function answer(chosen){
  if(answered)return;
  answered=true;
  total++;
  const btns=document.querySelectorAll('.choice-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===currentNote.label)b.classList.add('correct');
    else if(b.textContent===chosen&&chosen!==currentNote.label)b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  if(chosen===currentNote.label){
    score++;streak++;
    fb.textContent=`✓ Correct! That's ${currentNote.note}`;
    fb.className='feedback correct';
  } else {
    streak=0;
    fb.textContent=`✗ It was ${currentNote.label} (${currentNote.note})`;
    fb.className='feedback wrong';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('acc').textContent=Math.round(score/total*100)+'%';
  setTimeout(nextQuestion,1200);
}

document.getElementById('clef').addEventListener('change',()=>{score=0;total=0;streak=0;document.getElementById('score').textContent=0;document.getElementById('streak').textContent=0;document.getElementById('acc').textContent='—';nextQuestion();});
document.getElementById('range').addEventListener('change',nextQuestion);
nextQuestion();
</script>
</body>
</html>
