<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Ukulele chord diagram browser. View fingering diagrams for common ukulele chords in standard GCEA tuning across all roots and types.">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(1000px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
  .filters{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:flex-end;}
  .fg{display:flex;flex-direction:column;gap:.3rem;}
  label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:7px;font:inherit;font-size:.88rem;cursor:pointer;}
  .chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.85rem;}
  .chord-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;text-align:center;transition:border-color .15s;}
  .chord-card:hover{border-color:rgba(125,219,132,.4);}
  .chord-card h3{margin:0 0 .5rem;font-size:.95rem;color:var(--accent);}
  .chord-type{font-size:.7rem;color:var(--muted);margin-top:.3rem;}
  footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Ukulele Chords</span></nav>
<main>
  <h1>Ukulele Chords</h1>
  <p class="sub">Fingering diagrams for ukulele in standard GCEA tuning. Strings shown left-to-right (G C E A). × = muted, ○ = open.</p>
  <div class="filters">
    <div class="fg"><label>Root</label><select id="rootSel"><option value="all">All Roots</option></select></div>
    <div class="fg"><label>Type</label><select id="typeSel"><option value="all">All Types</option></select></div>
  </div>
  <div class="chord-grid" id="grid"></div>
  <footer>v1.0</footer>
</main>
<script>
// frets: [G,C,E,A] strings — 0=open, -1=muted, N=fret
const CHORDS=[
  {name:'C',  root:'C', type:'Major',  frets:[0,0,0,3]},
  {name:'Cm', root:'C', type:'Minor',  frets:[0,3,3,3],barre:{fret:3,from:1,to:3}},
  {name:'C7', root:'C', type:'Dom 7',  frets:[0,0,0,1]},
  {name:'Cmaj7',root:'C',type:'Maj 7', frets:[0,0,0,2]},
  {name:'Cm7',root:'C', type:'Min 7',  frets:[3,3,3,3],barre:{fret:3,from:0,to:3}},
  {name:'D',  root:'D', type:'Major',  frets:[2,2,2,0]},
  {name:'Dm', root:'D', type:'Minor',  frets:[2,2,1,0]},
  {name:'D7', root:'D', type:'Dom 7',  frets:[2,2,2,3]},
  {name:'Dmaj7',root:'D',type:'Maj 7', frets:[2,2,2,4]},
  {name:'E',  root:'E', type:'Major',  frets:[4,4,4,2]},
  {name:'Em', root:'E', type:'Minor',  frets:[0,4,3,2]},
  {name:'E7', root:'E', type:'Dom 7',  frets:[1,2,0,2]},
  {name:'F',  root:'F', type:'Major',  frets:[2,0,1,0]},
  {name:'Fm', root:'F', type:'Minor',  frets:[1,0,1,3]},
  {name:'F7', root:'F', type:'Dom 7',  frets:[2,3,1,3]},
  {name:'Fmaj7',root:'F',type:'Maj 7', frets:[2,4,1,3]},
  {name:'G',  root:'G', type:'Major',  frets:[0,2,3,2]},
  {name:'Gm', root:'G', type:'Minor',  frets:[0,2,3,1]},
  {name:'G7', root:'G', type:'Dom 7',  frets:[0,2,1,2]},
  {name:'Gmaj7',root:'G',type:'Maj 7', frets:[0,2,2,2]},
  {name:'A',  root:'A', type:'Major',  frets:[2,1,0,0]},
  {name:'Am', root:'A', type:'Minor',  frets:[2,0,0,0]},
  {name:'A7', root:'A', type:'Dom 7',  frets:[0,1,0,0]},
  {name:'Amaj7',root:'A',type:'Maj 7', frets:[1,1,0,0]},
  {name:'Am7',root:'A', type:'Min 7',  frets:[0,0,0,0]},
  {name:'B',  root:'B', type:'Major',  frets:[4,3,2,2],barre:{fret:2,from:2,to:3}},
  {name:'Bm', root:'B', type:'Minor',  frets:[4,2,2,2],barre:{fret:2,from:1,to:3}},
  {name:'B7', root:'B', type:'Dom 7',  frets:[2,3,2,2]},
  {name:'Bb', root:'B♭',type:'Major',  frets:[3,2,1,1],barre:{fret:1,from:2,to:3}},
  {name:'Bbm',root:'B♭',type:'Minor',  frets:[3,1,1,1],barre:{fret:1,from:1,to:3}},
];

const TYPES=[...new Set(CHORDS.map(c=>c.type))];
const ROOTS=[...new Set(CHORDS.map(c=>c.root))];
document.getElementById('rootSel').innerHTML+= ROOTS.map(r=>`<option value="${r}">${r}</option>`).join('');
document.getElementById('typeSel').innerHTML+= TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');

function drawUkeDiagram(chord){
  const W=90,H=110,padL=10,padR=8,padT=22,padB=8;
  const gW=W-padL-padR,gH=H-padT-padB;
  const nFrets=4,nStrings=4;
  const sStep=gW/(nStrings-1),fStep=gH/nFrets;
  const validFrets=chord.frets.filter(f=>f>0);
  const minFret=validFrets.length?Math.min(...validFrets):0;
  const startFret=minFret<=3?0:minFret;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:90px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">`;
  if(startFret===0){
    svg+=`<rect x="${padL}" y="${padT}" width="${gW}" height="2.5" fill="#e8e8e8" rx="1"/>`;
  } else {
    svg+=`<text x="${padL-3}" y="${padT+fStep*.55}" text-anchor="end" font-size="8" fill="#aab5ac" font-family="sans-serif">${startFret}fr</text>`;
  }
  for(let f=1;f<=nFrets;f++){
    const y=padT+f*fStep;
    svg+=`<line x1="${padL}" y1="${y}" x2="${padL+gW}" y2="${y}" stroke="#2a2f2b" stroke-width="1"/>`;
  }
  for(let s=0;s<nStrings;s++){
    const x=padL+s*sStep;
    svg+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+gH}" stroke="#3a4a3b" stroke-width="1.2"/>`;
  }
  if(chord.barre){
    const by=padT+(chord.barre.fret-startFret-.5)*fStep;
    svg+=`<rect x="${padL+chord.barre.from*sStep}" y="${by-4}" width="${(chord.barre.to-chord.barre.from)*sStep}" height="8" rx="4" fill="#7ddb84"/>`;
  }
  chord.frets.forEach((f,si)=>{
    const x=padL+si*sStep;
    if(f===-1){
      svg+=`<text x="${x}" y="${padT-7}" text-anchor="middle" font-size="8" fill="#aab5ac" font-family="monospace">×</text>`;
    } else if(f===0){
      svg+=`<circle cx="${x}" cy="${padT-7}" r="3.5" fill="none" stroke="#aab5ac" stroke-width="1.2"/>`;
    } else {
      const fy=padT+(f-startFret-.5)*fStep;
      const onBarre=chord.barre&&f===chord.barre.fret&&si>=chord.barre.from&&si<=chord.barre.to;
      if(!onBarre)svg+=`<circle cx="${x}" cy="${fy}" r="5" fill="#7ddb84"/>`;
    }
  });
  const strLabels=['G','C','E','A'];
  strLabels.forEach((l,si)=>{
    svg+=`<text x="${padL+si*sStep}" y="${padT+gH+10}" text-anchor="middle" font-size="7" fill="#aab5ac" font-family="sans-serif">${l}</text>`;
  });
  svg+='</svg>';
  return svg;
}

function render(){
  const root=document.getElementById('rootSel').value;
  const type=document.getElementById('typeSel').value;
  const filtered=CHORDS.filter(c=>(root==='all'||c.root===root)&&(type==='all'||c.type===type));
  const grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML='<p style="color:var(--muted)">No chords found.</p>';return;}
  grid.innerHTML=filtered.map(c=>`
    <div class="chord-card">
      <h3>${c.name}</h3>
      ${drawUkeDiagram(c)}
      <div class="chord-type">${c.type}</div>
    </div>`).join('');
}

document.getElementById('rootSel').addEventListener('change',render);
document.getElementById('typeSel').addEventListener('change',render);
render();
</script>
</body>
</html>
