<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(900px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
  .toolbar{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1.25rem;}
  .tb-group{display:flex;flex-direction:column;gap:.3rem;}
  label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:7px;font:inherit;font-size:.88rem;cursor:pointer;}
  .filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;}
  .filter-btn{padding:.35rem .85rem;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;}
  .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface2);}
  .prog-grid{display:grid;gap:.85rem;}
  .prog-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;transition:border-color .15s;}
  .prog-card:hover{border-color:rgba(125,219,132,.3);}
  .prog-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.7rem;}
  .prog-name{font-weight:700;font-size:.95rem;}
  .prog-tags{display:flex;gap:.4rem;flex-wrap:wrap;}
  .tag{padding:.1rem .45rem;border-radius:3px;font-size:.68rem;font-weight:700;}
  .tag-pop{background:rgba(125,219,132,.1);color:var(--accent);}
  .tag-rock{background:rgba(170,204,218,.1);color:#aaccda;}
  .tag-blues{background:rgba(225,193,164,.1);color:#e1c1a4;}
  .tag-jazz{background:rgba(200,162,255,.1);color:#c8a2ff;}
  .tag-classical{background:rgba(255,153,128,.1);color:#ff9980;}
  .tag-folk{background:rgba(255,220,100,.1);color:#ffd764;}
  .chords-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
  .roman-pills{display:flex;gap:.4rem;flex-wrap:wrap;}
  .r-pill{display:inline-flex;flex-direction:column;align-items:center;gap:.15rem;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.35rem .6rem;min-width:2.5rem;}
  .r-roman{font-size:.8rem;font-weight:800;color:var(--text);}
  .r-chord{font-size:.72rem;color:var(--accent);font-weight:600;}
  .play-btn{padding:.35rem .85rem;border:1px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .play-btn:hover{background:rgba(125,219,132,.1);}
  .prog-desc{font-size:.8rem;color:var(--muted);margin-top:.5rem;}
  footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Common Chord Progressions</span></nav>
<main>
  <h1>Common Chord Progressions</h1>
  <p class="sub">Classic progressions across genres. Select a key to see chord names, or just use Roman numerals to apply to any key.</p>
  <div class="toolbar">
    <div class="tb-group">
      <label>Key</label>
      <select id="keySel"></select>
    </div>
    <div class="tb-group">
      <label>Mode</label>
      <select id="modeSel">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
      </select>
    </div>
  </div>
  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-genre="all">All</button>
    <button class="filter-btn" data-genre="pop">Pop</button>
    <button class="filter-btn" data-genre="rock">Rock</button>
    <button class="filter-btn" data-genre="blues">Blues</button>
    <button class="filter-btn" data-genre="jazz">Jazz</button>
    <button class="filter-btn" data-genre="folk">Folk</button>
    <button class="filter-btn" data-genre="classical">Classical</button>
  </div>
  <div class="prog-grid" id="grid"></div>
  <footer>v1.0</footer>
</main>
<script>
const NOTES_S=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NOTES_F=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const FLAT_ROOTS=[5,10,3,8,1,6];

const MAJOR_SCALE=[0,2,4,5,7,9,11];
const MINOR_SCALE=[0,2,3,5,7,8,10];
const MAJOR_Q=['','m','m','','','m','dim'];
const MINOR_Q=['m','dim','','m','m','',''];
const MAJOR_R=['I','ii','iii','IV','V','vi','vii°'];
const MINOR_R=['i','ii°','III','iv','v','VI','VII'];

const PROGRESSIONS=[
  {name:'I – V – vi – IV',genres:['pop','folk'],romans:[1,5,6,4],mode:'major',desc:"The most-used pop progression. Four Chords, Let It Be, Don't Stop Believin'."},
  {name:'I – IV – V',genres:['pop','rock','blues','folk'],romans:[1,4,5],mode:'major',desc:'The foundation of blues and rock. Works in 12-bar form or shortened.'},
  {name:'I – IV – vi – V',genres:['pop','rock'],romans:[1,4,6,5],mode:'major',desc:'Common in classic rock and pop anthems.'},
  {name:'vi – IV – I – V',genres:['pop','rock'],romans:[6,4,1,5],mode:'major',desc:"Minor-feeling variant of the four-chord progression. Axis of Awesome's common version."},
  {name:'I – vi – IV – V',genres:['pop','folk','classical'],romans:[1,6,4,5],mode:'major',desc:"The '50s progression. Stand By Me, Blue Moon, Earth Angel."},
  {name:'I – vi – ii – V',genres:['jazz','pop'],romans:[1,6,2,5],mode:'major',desc:"Jazz turnaround. Also called 'rhythm changes' variation."},
  {name:'ii – V – I',genres:['jazz'],romans:[2,5,1],mode:'major',desc:'The quintessential jazz resolution. Found in almost every jazz standard.'},
  {name:'I – II – IV – I',genres:['rock','pop'],romans:[1,2,4,1],mode:'major',desc:'Mixolydian-flavored. Used by The Beatles and countless rock songs.'},
  {name:'I – bVII – IV – I',genres:['rock','folk'],romans:[1,7,4,1],mode:'major',desc:'Mixolydian power move. Sweet Home Alabama, Free Bird.'},
  {name:'12-Bar Blues',genres:['blues','rock'],romans:[1,1,1,1,4,4,1,1,5,4,1,5],mode:'major',desc:'The backbone of blues. I I I I / IV IV I I / V IV I V (12 bars).'},
  {name:'i – VII – VI – VII',genres:['rock','pop'],romans:[1,7,6,7],mode:'minor',desc:"Andalusian-influenced minor descent. Used in flamenco and rock."},
  {name:'i – iv – v',genres:['classical','rock'],romans:[1,4,5],mode:'minor',desc:'Pure minor key movement. Dark and tense.'},
  {name:'i – VI – III – VII',genres:['pop','rock'],romans:[1,6,3,7],mode:'minor',desc:"Natural minor I VI III VII loop. Stairway to Heaven's intro."},
  {name:'i – iv – VII – III',genres:['folk','classical'],romans:[1,4,7,3],mode:'minor',desc:'Descending minor progression with baroque feel.'},
  {name:'i – VII – VI – V',genres:['classical','rock'],romans:[1,7,6,5],mode:'minor',desc:"Andalusian cadence. Canon-like falling motion. Used in Sultans of Swing."},
  {name:'I – V – vi – iii – IV',genres:['classical','pop'],romans:[1,5,6,3,4],mode:'major',desc:"Canon in D progression. Pachelbel's famous ground bass."},
  {name:'I – IV – I – V',genres:['folk','country'],romans:[1,4,1,5],mode:'major',desc:'Country two-step staple. Simple and driving.'},
  {name:'I – iii – IV – V',genres:['pop','rock'],romans:[1,3,4,5],mode:'major',desc:'Classic ascent. Adds movement before the subdominant.'},
  {name:'vi – V – IV – III',genres:['pop','rock'],romans:[6,5,4,3],mode:'major',desc:'Descending progression from the relative minor. Dramatic feel.'},
  {name:'i – v – i – VII',genres:['rock','classical'],romans:[1,5,1,7],mode:'minor',desc:'Minor vamp with leading dominant. Common in cinematic scores.'},
];

let audioCtx=null;
let activeGenre='all';

function getChordName(rootIdx,scaleStep,mode){
  const scale=mode==='major'?MAJOR_SCALE:MINOR_SCALE;
  const qualities=mode==='major'?MAJOR_Q:MINOR_Q;
  const semi=(rootIdx+scale[scaleStep-1])%12;
  const pf=FLAT_ROOTS.includes(rootIdx);
  const name=(pf?NOTES_F:NOTES_S)[semi];
  return name+qualities[scaleStep-1];
}

function getRoman(step,mode){
  const romans=mode==='major'?MAJOR_R:MINOR_R;
  return romans[step-1];
}

function playProg(rootIdx,romans,mode){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const scale=mode==='major'?MAJOR_SCALE:MINOR_SCALE;
  const qualities=mode==='major'?MAJOR_Q:MINOR_Q;
  const CHORD_INTERVALS={'':[0,4,7],'m':[0,3,7],'dim':[0,3,6]};
  const a4=440;
  romans.forEach((step,ci)=>{
    const rootSemi=(rootIdx+scale[step-1])%12;
    const q=qualities[step-1];
    const intv=CHORD_INTERVALS[q]||[0,4,7];
    intv.forEach((iv,ni)=>{
      const semi=(rootSemi+iv)%12;
      const semiFromA4=(4-4)*12+(semi-9);
      const freq=a4*Math.pow(2,semiFromA4/12)*2;
      const t=audioCtx.currentTime+ci*0.7+ni*0.05;
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.type='triangle';osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.18,t+0.04);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.65);
      osc.start(t);osc.stop(t+0.65);
    });
  });
}

function render(){
  const rootIdx=parseInt(document.getElementById('keySel').value);
  const mode=document.getElementById('modeSel').value;
  const filtered=PROGRESSIONS.filter(p=>{
    const modeMatch=p.mode===mode;
    const genreMatch=activeGenre==='all'||p.genres.includes(activeGenre);
    return modeMatch&&genreMatch;
  });
  const grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML='<p style="color:var(--muted)">No progressions found.</p>';return;}
  grid.innerHTML=filtered.map(p=>{
    const pills=p.romans.map(r=>`<div class="r-pill">
      <span class="r-roman">${getRoman(r,mode)}</span>
      <span class="r-chord">${getChordName(rootIdx,r,mode)}</span>
    </div>`).join('');
    const tags=p.genres.map(g=>`<span class="tag tag-${g}">${g}</span>`).join('');
    return`<div class="prog-card">
      <div class="prog-top">
        <div class="prog-name">${p.name}</div>
        <div class="prog-tags">${tags}</div>
      </div>
      <div class="chords-row">
        <div class="roman-pills">${pills}</div>
        <button class="play-btn" onclick="playProg(${rootIdx},[${p.romans}],'${mode}')">▶ Hear it</button>
      </div>
      <div class="prog-desc">${p.desc}</div>
    </div>`;
  }).join('');
}

const kSel=document.getElementById('keySel');
NOTES_S.forEach((n,i)=>kSel.innerHTML+=`<option value="${i}">${n}${NOTES_S[i]!==NOTES_F[i]?' / '+NOTES_F[i]:''}</option>`);
document.getElementById('keySel').addEventListener('change',render);
document.getElementById('modeSel').addEventListener('change',render);
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeGenre=btn.dataset.genre;
    render();
  });
});
render();
</script>
</body>
</html>
