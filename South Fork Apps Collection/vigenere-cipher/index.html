<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigenère Cipher | South Fork Apps</title>
  <meta name="description" content="Encode and decode text with the Vigenère cipher using a custom keyword. Free online Vigenère cipher tool.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);font-size:.875rem}
  .nav a{color:var(--accent);text-decoration:none}.nav a:hover{text-decoration:underline}
  .nav-title{color:var(--muted)}
  main{flex:1;padding:1.5rem;max-width:760px;margin:0 auto;width:100%}
  h1{font-size:1.4rem;margin-bottom:.25rem}
  .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}
  .controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:1rem;padding:.875rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem}
  label{font-size:.875rem;color:var(--muted)}
  input[type=text]{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:.4rem .65rem;border-radius:.375rem;font-size:.875rem;font-family:inherit;flex:1;min-width:0}
  .seg{display:flex;border:1px solid var(--border);border-radius:.375rem;overflow:hidden}
  .seg button{background:var(--surface-2);color:var(--muted);border:none;padding:.35rem .85rem;font-size:.875rem;font-family:inherit;cursor:pointer;transition:.15s}
  .seg button.active{background:var(--accent);color:#111412;font-weight:600}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:1rem;margin-bottom:1rem}
  .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
  textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:.375rem;padding:.6rem;font-size:.875rem;font-family:'Courier New',monospace;resize:vertical;min-height:120px;line-height:1.5}
  .out-text{background:var(--surface-2);border:1px solid var(--border);border-radius:.375rem;padding:.6rem;font-size:.875rem;font-family:'Courier New',monospace;min-height:80px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
  .key-pattern{background:var(--surface-2);border:1px solid var(--border);border-radius:.375rem;padding:.4rem .6rem;font-size:.78rem;font-family:'Courier New',monospace;color:var(--accent);min-height:2rem;word-break:break-all;margin-top:.4rem;letter-spacing:.05em}
  .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.5rem}
  .btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:.35rem .75rem;border-radius:.375rem;font-size:.8rem;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .muted{color:var(--muted);font-size:.8rem}
  footer{text-align:center;padding:.75rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">← South Fork Apps</a><span class="nav-title">Vigenère Cipher</span></nav>
<main>
  <h1>Vigenère Cipher</h1>
  <p class="subtitle">Encode or decode text with a keyword. See the repeating key pattern below the result.</p>
  <div class="controls">
    <label>Keyword:</label>
    <input type="text" id="keyInput" placeholder="e.g. SECRET" oninput="convert()" style="max-width:200px">
    <label>Mode:</label>
    <div class="seg">
      <button class="active" id="btnEnc" onclick="setMode('enc')">Encode</button>
      <button id="btnDec" onclick="setMode('dec')">Decode</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header"><strong>Input</strong><span id="inCount" class="muted">0 chars</span></div>
    <textarea id="inputArea" placeholder="Type or paste text here…" oninput="convert()"></textarea>
  </div>
  <div class="panel">
    <div class="panel-header"><strong>Output</strong></div>
    <div class="out-text" id="output"></div>
    <div class="muted" style="margin-top:.4rem">Repeating key pattern (letters only):</div>
    <div class="key-pattern" id="keyPattern"></div>
    <div class="row"><span></span><button class="btn" id="copyBtn" onclick="copyOut()">Copy</button></div>
  </div>
  <footer>v1.0</footer>
</main>
<script>
let mode='enc';
function setMode(m){
  mode=m;
  document.getElementById('btnEnc').className=m==='enc'?'active':'';
  document.getElementById('btnDec').className=m==='dec'?'active':'';
  convert();
}
function vigenere(text,key,encode){
  if(!key) return {out:text,pattern:''};
  const k=key.toUpperCase().replace(/[^A-Z]/g,'');
  if(!k) return {out:text,pattern:''};
  let ki=0,out='',pattern='';
  for(const c of text){
    if(/[a-zA-Z]/.test(c)){
      const base=c>='a'?97:65;
      const shift=k[ki%k.length].charCodeAt(0)-65;
      const s=encode?shift:-shift;
      out+=String.fromCharCode(((c.charCodeAt(0)-base+s+26)%26)+base);
      pattern+=k[ki%k.length];
      ki++;
    } else {
      out+=c;
      if(c!==' ')pattern+=c; else pattern+=' ';
    }
  }
  return {out,pattern};
}
function convert(){
  const t=document.getElementById('inputArea').value;
  const key=document.getElementById('keyInput').value;
  document.getElementById('inCount').textContent=t.length+' chars';
  const {out,pattern}=vigenere(t,key,mode==='enc');
  document.getElementById('output').textContent=out;
  document.getElementById('keyPattern').textContent=pattern||'(key pattern will appear here)';
}
function copyOut(){
  navigator.clipboard.writeText(document.getElementById('output').textContent).then(()=>{
    const b=document.getElementById('copyBtn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500);
  });
}
</script>
</body>
</html>
