<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Factorization | South Fork Apps</title>
  <meta name="description" content="Find the prime factors of any number instantly. Shows exponents, factor count, and sum. Free online prime factorization tool.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);font-size:.875rem}
  .nav a{color:var(--accent);text-decoration:none}.nav a:hover{text-decoration:underline}
  .nav-title{color:var(--muted)}
  main{flex:1;padding:1.5rem;max-width:640px;margin:0 auto;width:100%}
  h1{font-size:1.4rem;margin-bottom:.25rem}
  .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}
  .input-row{display:flex;gap:.5rem;margin-bottom:1rem}
  input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.55rem .75rem;border-radius:.5rem;font-size:1.1rem;font-family:inherit;flex:1;min-width:0}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--accent);color:#111412;border:none;padding:.55rem 1.2rem;border-radius:.5rem;font-size:.9rem;font-family:inherit;cursor:pointer;font-weight:600;transition:.15s}
  .btn:hover{opacity:.85}
  .result-box{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:1.25rem;margin-bottom:1rem}
  .factored{font-size:1.5rem;font-family:'Courier New',monospace;color:var(--accent);margin-bottom:.75rem;word-break:break-all}
  sup{font-size:.65em;vertical-align:super}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:.375rem;padding:.6rem .8rem}
  .stat-label{font-size:.75rem;color:var(--muted);margin-bottom:.2rem}
  .stat-value{font-size:1rem;font-weight:600}
  .badge{display:inline-block;padding:.25rem .6rem;border-radius:.25rem;font-size:.8rem;font-weight:600}
  .prime-yes{background:rgba(125,219,132,.15);color:var(--accent);border:1px solid var(--accent)}
  .prime-no{background:rgba(170,181,172,.1);color:var(--muted);border:1px solid var(--border)}
  .error{color:#f87171;font-size:.875rem;margin-bottom:.5rem}
  footer{text-align:center;padding:.75rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">← South Fork Apps</a><span class="nav-title">Prime Factorization</span></nav>
<main>
  <h1>Prime Factorization</h1>
  <p class="subtitle">Break any positive integer (up to 10¹⁵) into its prime factors.</p>
  <div class="input-row">
    <input type="text" id="numInput" placeholder="e.g. 360" oninput="factorize()" maxlength="16">
    <button class="btn" onclick="factorize()">Factor</button>
  </div>
  <div id="error" class="error" style="display:none"></div>
  <div id="results" style="display:none">
    <div class="result-box">
      <div id="factored" class="factored"></div>
      <div class="grid">
        <div class="stat"><div class="stat-label">Is Prime?</div><div class="stat-value" id="isPrime"></div></div>
        <div class="stat"><div class="stat-label">Number of Distinct Primes</div><div class="stat-value" id="numDistinct"></div></div>
        <div class="stat"><div class="stat-label">Number of Factors (total)</div><div class="stat-value" id="numFactors"></div></div>
        <div class="stat"><div class="stat-label">Sum of Factors</div><div class="stat-value" id="sumFactors"></div></div>
      </div>
    </div>
  </div>
  <footer>v1.0</footer>
</main>
<script>
function factorize(){
  const raw=document.getElementById('numInput').value.trim();
  const err=document.getElementById('error');
  const res=document.getElementById('results');
  if(!raw){err.style.display='none';res.style.display='none';return;}
  let n;
  try{n=BigInt(raw);}catch(e){err.textContent='Please enter a valid integer.';err.style.display='block';res.style.display='none';return;}
  if(n<=0n){err.textContent='Please enter a positive integer greater than 0.';err.style.display='block';res.style.display='none';return;}
  if(n>1000000000000000n){err.textContent='Number too large (max 10¹⁵).';err.style.display='block';res.style.display='none';return;}
  err.style.display='none';

  // Prime factorization
  const factors=new Map();
  let x=n;
  for(let d=2n;d*d<=x;d++){
    while(x%d===0n){factors.set(d,(factors.get(d)||0)+1);x/=d;}
  }
  if(x>1n) factors.set(x,(factors.get(x)||0)+1);

  // Build display
  const entries=[...factors.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
  let html='';
  if(entries.length===0){
    html=n.toString();
  } else {
    html=n.toString()+' = '+entries.map(([p,e])=>e===1?p.toString():'<b>'+p+'</b><sup>'+e+'</sup>').join(' × ');
  }
  document.getElementById('factored').innerHTML=html;

  const isPrime=entries.length===1&&entries[0][1]===1;
  document.getElementById('isPrime').innerHTML=isPrime?'<span class="badge prime-yes">Yes</span>':'<span class="badge prime-no">No</span>';
  document.getElementById('numDistinct').textContent=entries.length;

  // Total number of divisors = product of (e+1)
  let numDiv=1n;
  for(const[,e] of entries) numDiv*=BigInt(e+1);
  document.getElementById('numFactors').textContent=numDiv.toString();

  // Sum of divisors = product of (p^(e+1)-1)/(p-1)
  let sumDiv=1n;
  for(const[p,e] of entries){
    let num=p**(BigInt(e)+1n)-1n;
    let den=p-1n;
    sumDiv*=num/den;
  }
  document.getElementById('sumFactors').textContent=sumDiv.toString();

  res.style.display='block';
}
</script>
</body>
</html>
