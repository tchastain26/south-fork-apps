<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Could've Been an Email | South Fork Apps</title>
  <meta name="description" content="Answer 7 quick questions and get a blunt verdict on whether your meeting should have been an email. Free online meeting analyzer.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;--yes:rgba(125,219,132,.12);--yes-border:rgba(125,219,132,.4);--no:rgba(170,181,172,.07);--no-border:rgba(170,181,172,.25);}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav-back{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav-back:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(620px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 3rem;display:grid;gap:1rem;}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.75rem;}
    h1{margin:0 0 .3rem;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.02em;}
    .tagline{margin:0 0 1.75rem;color:var(--muted);line-height:1.6;font-size:.95rem;}

    /* Progress */
    .progress-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;}
    .progress-dots{display:flex;gap:.4rem;}
    .pdot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s,transform .3s;}
    .pdot.done{background:var(--accent);}
    .pdot.current{background:rgba(125,219,132,.5);transform:scale(1.2);}
    .progress-text{font-size:.78rem;font-weight:700;color:var(--muted);margin-left:auto;}
    .progress-bar-wrap{width:100%;height:4px;background:var(--border);border-radius:99px;margin-bottom:1.5rem;overflow:hidden;}
    .progress-bar{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}

    /* Question card */
    .q-card{animation:slideIn .28s ease;}
    @keyframes slideIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
    .q-number{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.6rem;}
    .q-text{font-size:1.15rem;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:1.5rem;}
    .q-buttons{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
    .q-btn{padding:1.1rem;border-radius:10px;border:2px solid;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;letter-spacing:.03em;transition:all .15s;background:transparent;}
    .q-btn.yes{border-color:var(--yes-border);color:var(--accent);background:var(--yes);}
    .q-btn.yes:hover{background:rgba(125,219,132,.2);border-color:var(--accent);}
    .q-btn.no{border-color:var(--no-border);color:var(--muted);background:var(--no);}
    .q-btn.no:hover{background:rgba(170,181,172,.12);border-color:var(--muted);}

    /* Result */
    .result{display:none;animation:fadeIn .4s ease;}
    .result.visible{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .verdict-hero{text-align:center;padding:1.5rem 1rem 1.25rem;}
    .verdict-pct{font-size:clamp(4rem,15vw,7rem);font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent);}
    .verdict-sublabel{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:.3rem;}
    .verdict-badge{display:inline-block;margin:1rem auto 0;padding:.45rem 1.1rem;border-radius:99px;font-size:.85rem;font-weight:800;letter-spacing:.04em;}
    .verdict-reason{margin-top:1.25rem;padding:1rem 1.1rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:.95rem;line-height:1.65;color:var(--text);}
    .verdict-breakdown{margin-top:1rem;padding:1rem 1.1rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;}
    .breakdown-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;}
    .breakdown-item{display:flex;align-items:flex-start;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.88rem;line-height:1.45;}
    .breakdown-item:last-child{border-bottom:none;}
    .breakdown-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:.35rem;}
    .breakdown-dot.yes{background:var(--accent);}
    .breakdown-dot.no{background:var(--border);}
    .breakdown-item.yes-item .bd-label{color:var(--text);}
    .breakdown-item.no-item .bd-label{color:var(--muted);}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1rem;}
    .action-btn{padding:.85rem;border-radius:10px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;}
    .action-btn.primary{background:var(--accent);border:none;color:#0d1f0f;}
    .action-btn.primary:hover{background:#6be073;}
    .action-btn.secondary{background:none;border:1.5px solid var(--border);color:var(--muted);}
    .action-btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
    .share-text-wrap{margin-top:.75rem;padding:.85rem 1rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:.83rem;color:var(--muted);line-height:1.55;}
    .share-text-wrap strong{display:block;color:var(--text);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem;}

    footer{margin-top:.75rem;text-align:center;color:var(--muted);font-size:.8rem;}
  </style>
</head>
<body>
<nav class="nav">
  <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">Meeting Could've Been an Email</span>
</nav>
<main>
  <section class="panel">
    <h1>Could've Been an Email</h1>
    <p class="tagline">Answer 7 questions. Get a blunt verdict. Forward results to your manager.</p>

    <!-- Quiz -->
    <div id="quiz">
      <div class="progress-row">
        <div class="progress-dots" id="dots"></div>
        <span class="progress-text" id="progressText">1 of 7</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div id="qCard" class="q-card"></div>
    </div>

    <!-- Result -->
    <div class="result" id="result"></div>

    <footer>v1.0</footer>
  </section>
</main>
<script>
  const QUESTIONS = [
    { text:"Was the primary purpose to share information rather than reach a decision together?", weight:18 },
    { text:"Could the key points have been summarized in a short written list or paragraph?", weight:16 },
    { text:"Did fewer than half the attendees actively speak or contribute?", weight:14 },
    { text:"Was there a document, slide deck, or report that could have been sent ahead instead?", weight:16 },
    { text:"Did the meeting run past its scheduled end time?", weight:12 },
    { text:"Could one person have made the necessary decision without gathering the group?", weight:14 },
    { text:"Did at least one person seem disengaged (phone out, side conversations, glazed eyes)?", weight:10 },
  ];

  const TIERS = [
    { min:0,  max:19,  verdict:"Shockingly Justified",      badge:"bg:rgba(125,219,132,.15);color:#7ddb84;border:1.5px solid rgba(125,219,132,.3)", reason:"This meeting had genuine, defensible reasons to exist. Decisions were made. People were heard. This is rare. Cherish it." },
    { min:20, max:39,  verdict:"Borderline Call",             badge:"bg:rgba(170,181,172,.12);color:#aab5ac;border:1.5px solid rgba(170,181,172,.3)", reason:"Could go either way. The meeting wasn't a complete disaster, but it could have been shorter, or at least had a tighter agenda." },
    { min:40, max:59,  verdict:"Leaning Email",               badge:"bg:rgba(200,150,80,.12);color:#c89650;border:1.5px solid rgba(200,150,80,.3)", reason:"More email than meeting. The information was mostly one-directional. A well-structured email with a reply deadline would have done the same job." },
    { min:60, max:79,  verdict:"This Was an Email",           badge:"bg:rgba(224,108,117,.12);color:#e06c75;border:1.5px solid rgba(224,108,117,.3)", reason:"Someone could have typed this up in 10 minutes and saved everyone 45 they are not getting back. A reply-all thread, at absolute worst." },
    { min:80, max:100, verdict:"Aggressively an Email",       badge:"bg:rgba(224,108,117,.18);color:#e06c75;border:1.5px solid rgba(224,108,117,.5)", reason:"This meeting was an email, a Slack message, a voice memo, AND a Post-it note stuck to someone's monitor. All at once. Simultaneously. For the cost of one meeting." },
  ];

  let current = 0;
  let score = 0;
  let answers = [];

  function buildDots() {
    const wrap = document.getElementById('dots');
    wrap.innerHTML = QUESTIONS.map((_, i) =>
      `<div class="pdot ${i === 0 ? 'current' : ''}" id="dot${i}"></div>`
    ).join('');
  }

  function updateProgress(index) {
    QUESTIONS.forEach((_, i) => {
      const d = document.getElementById('dot'+i);
      d.className = 'pdot' + (i < index ? ' done' : i === index ? ' current' : '');
    });
    document.getElementById('progressText').textContent = `${index + 1} of ${QUESTIONS.length}`;
    document.getElementById('progressBar').style.width = `${(index / QUESTIONS.length) * 100}%`;
  }

  function renderQuestion(index) {
    const q = QUESTIONS[index];
    const card = document.getElementById('qCard');
    card.innerHTML = `
      <div class="q-number">Question ${index + 1}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-buttons">
        <button class="q-btn yes" onclick="answer(true)">Yes</button>
        <button class="q-btn no" onclick="answer(false)">No</button>
      </div>
    `;
    // Restart animation
    card.classList.remove('q-card');
    void card.offsetWidth;
    card.classList.add('q-card');
  }

  function answer(yes) {
    answers.push({ question: QUESTIONS[current].text, yes });
    if (yes) score += QUESTIONS[current].weight;
    current++;
    if (current < QUESTIONS.length) {
      updateProgress(current);
      renderQuestion(current);
    } else {
      showResult();
    }
  }

  function getTier(s) {
    return TIERS.find(t => s >= t.min && s <= t.max);
  }

  function parseBadgeStyle(s) {
    const parts = {};
    s.split(';').forEach(p => {
      const [k,v] = p.split(':');
      if (k && v) parts[k.trim()] = v.trim();
    });
    return `background:${parts.bg||'transparent'};color:${parts.color||'#fff'};border:${parts.border||'1px solid transparent'}`;
  }

  function showResult() {
    document.getElementById('quiz').style.display = 'none';
    const tier = getTier(score);
    const emailPct = score;
    const yesAnswers = answers.filter(a => a.yes);
    const noAnswers = answers.filter(a => !a.yes);

    const shareText = `My meeting just scored ${emailPct}% on the email scale. Verdict: ${tier.verdict}. Test your next one at southforkapps.com`;

    const breakdownHtml = answers.map(a => `
      <div class="breakdown-item ${a.yes ? 'yes-item' : 'no-item'}">
        <div class="breakdown-dot ${a.yes ? 'yes' : 'no'}"></div>
        <span class="bd-label">${a.question}</span>
      </div>
    `).join('');

    const resultEl = document.getElementById('result');
    resultEl.innerHTML = `
      <div class="verdict-hero">
        <div class="verdict-pct" id="pctDisplay">0%</div>
        <div class="verdict-sublabel">Email Score</div>
        <div class="verdict-badge" style="${parseBadgeStyle(tier.badge)}">${tier.verdict}</div>
      </div>
      <div class="verdict-reason">${tier.reason}</div>
      <div class="verdict-breakdown">
        <div class="breakdown-title">Your Answers</div>
        ${breakdownHtml}
      </div>
      <div class="result-actions">
        <button class="action-btn primary" onclick="copyShare()">Copy Verdict</button>
        <button class="action-btn secondary" onclick="restart()">Test Another</button>
      </div>
      <div class="share-text-wrap">
        <strong>Shareable Text</strong>
        ${shareText}
      </div>
    `;

    resultEl.classList.add('visible');

    // Count up animation
    let n = 0;
    const step = emailPct / 40;
    const timer = setInterval(() => {
      n = Math.min(n + step, emailPct);
      document.getElementById('pctDisplay').textContent = Math.round(n) + '%';
      if (n >= emailPct) clearInterval(timer);
    }, 20);
  }

  function copyShare() {
    const tier = getTier(score);
    const text = `My meeting just scored ${score}% on the email scale. Verdict: ${tier.verdict}. Test your next one at southforkapps.com`;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy Verdict', 2000);
    });
  }

  function restart() {
    current = 0;
    score = 0;
    answers = [];
    document.getElementById('result').classList.remove('visible');
    document.getElementById('result').innerHTML = '';
    document.getElementById('quiz').style.display = 'block';
    buildDots();
    updateProgress(0);
    renderQuestion(0);
  }

  buildDots();
  renderQuestion(0);
</script>
</body>
</html>
