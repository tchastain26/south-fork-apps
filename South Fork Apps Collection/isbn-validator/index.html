<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN Validator | South Fork Apps</title>
  <meta name="description" content="Validate ISBN-10 or ISBN-13 numbers, format with hyphens, and convert between ISBN-10 and ISBN-13. Free online tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;--danger:#ff9f9f;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(680px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;}
    h1{margin:0 0 .5rem;font-size:clamp(1.8rem,4vw,2.6rem);}
    p.sub{margin:0 0 1.5rem;color:var(--muted);line-height:1.6;}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1rem;}
    label{display:block;margin-bottom:.4rem;color:var(--muted);font-size:.82rem;font-weight:700;}
    input[type=text]{width:100%;padding:.65rem .85rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font:inherit;font-size:1.05rem;font-family:ui-monospace,monospace;outline:none;letter-spacing:.08em;}
    input[type=text]:focus{border-color:var(--accent);}
    .badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-size:.82rem;font-weight:800;margin-top:.75rem;letter-spacing:.04em;}
    .badge.valid{background:rgba(125,219,132,.15);border:1px solid var(--accent);color:var(--accent);}
    .badge.invalid{background:rgba(255,159,159,.1);border:1px solid var(--danger);color:var(--danger);}
    .badge.neutral{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);}
    .result-list{display:grid;gap:.5rem;margin-top:.75rem;}
    .result-item{display:grid;grid-template-columns:160px 1fr 60px;align-items:center;gap:.75rem;padding:.65rem .85rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;}
    .result-item:hover{border-color:var(--accent);}
    .result-label{font-size:.8rem;color:var(--muted);font-weight:700;}
    .result-val{font-family:ui-monospace,monospace;font-size:.9rem;color:var(--text);overflow-wrap:anywhere;}
    .copy-hint{font-size:.72rem;color:var(--muted);text-align:right;}
    .copied-hint{color:var(--accent)!important;}
    .na{color:var(--muted)!important;font-style:italic;}
    footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">ISBN Validator</span></nav>
<main>
  <h1>ISBN Validator</h1>
  <p class="sub">Enter an ISBN-10 or ISBN-13. Validates, formats, and converts.</p>
  <div class="panel">
    <label for="isbnIn">ISBN (hyphens and spaces are ignored)</label>
    <input type="text" id="isbnIn" placeholder="e.g. 978-0-06-112008-4" oninput="validate()">
    <div id="badge"><span class="badge neutral">Waiting for input</span></div>
  </div>
  <div class="panel" id="resultPanel" style="display:none;">
    <label>Results &mdash; click to copy</label>
    <div class="result-list" id="resultList"></div>
  </div>
  <div class="panel"><footer>v1.0</footer></div>
</main>
<script>
function clean(s){return s.replace(/[-\s]/g,'').toUpperCase();}

function checkISBN10(s){
  if(s.length!==10)return false;
  let sum=0;
  for(let i=0;i<9;i++){
    if(!/\d/.test(s[i]))return false;
    sum+=(10-i)*parseInt(s[i]);
  }
  const check=s[9]==='X'?10:parseInt(s[9]);
  if(isNaN(check))return false;
  sum+=check;
  return sum%11===0;
}

function checkISBN13(s){
  if(s.length!==13)return false;
  if(!/^\d{13}$/.test(s))return false;
  let sum=0;
  for(let i=0;i<12;i++) sum+=parseInt(s[i])*(i%2===0?1:3);
  const check=(10-(sum%10))%10;
  return check===parseInt(s[12]);
}

function isbn10to13(s){
  const base='978'+s.slice(0,9);
  let sum=0;
  for(let i=0;i<12;i++) sum+=parseInt(base[i])*(i%2===0?1:3);
  const check=(10-(sum%10))%10;
  return base+check;
}

function isbn13to10(s){
  if(!s.startsWith('978'))return null;
  const core=s.slice(3,12);
  let sum=0;
  for(let i=0;i<9;i++) sum+=(10-i)*parseInt(core[i]);
  const check=(11-(sum%11))%11;
  return core+(check===10?'X':check.toString());
}

function formatISBN10(s){return s.slice(0,1)+'-'+s.slice(1,4)+'-'+s.slice(4,9)+'-'+s[9];}
function formatISBN13(s){return s.slice(0,3)+'-'+s.slice(3,4)+'-'+s.slice(4,6)+'-'+s.slice(6,12)+'-'+s[12];}

function validate(){
  const raw=document.getElementById('isbnIn').value;
  const s=clean(raw);
  const badgeEl=document.getElementById('badge');
  const panel=document.getElementById('resultPanel');
  const list=document.getElementById('resultList');

  if(!s){
    badgeEl.innerHTML='<span class="badge neutral">Waiting for input</span>';
    panel.style.display='none';
    return;
  }

  let valid=false,type='',formatted='',conv10='',conv13='';

  if(s.length===10){
    valid=checkISBN10(s);
    type='ISBN-10';
    formatted=valid?formatISBN10(s):'';
    if(valid){conv13=isbn10to13(s);conv10=s;}
  } else if(s.length===13){
    valid=checkISBN13(s);
    type='ISBN-13';
    formatted=valid?formatISBN13(s):'';
    if(valid){conv10=isbn13to10(s)||'N/A (not 978 prefix)';conv13=s;}
  } else {
    type='Unknown length ('+s.length+' chars)';
  }

  if(valid){
    badgeEl.innerHTML=`<span class="badge valid">&#10003; Valid ${type}</span>`;
  } else {
    badgeEl.innerHTML=`<span class="badge invalid">&#10007; Invalid ${type||'ISBN'}</span>`;
  }

  if(valid){
    const rows=[
      ['Type', type],
      ['Formatted', formatted],
      ['ISBN-10', type==='ISBN-13'?(conv10||'N/A'):s],
      ['ISBN-13', type==='ISBN-10'?conv13:s],
    ];
    list.innerHTML=rows.map(([l,v])=>
      `<div class="result-item" onclick="copyRow(this)">
        <span class="result-label">${l}</span>
        <span class="result-val${v==='N/A'?' na':''}">${v}</span>
        <span class="copy-hint">${v==='N/A'?'':'copy'}</span>
      </div>`
    ).join('');
    panel.style.display='';
  } else {
    panel.style.display='none';
  }
}

function copyRow(el){
  const val=el.querySelector('.result-val').textContent;
  if(val==='N/A')return;
  navigator.clipboard.writeText(val).then(()=>{
    const hint=el.querySelector('.copy-hint');
    hint.textContent='copied!';hint.classList.add('copied-hint');
    setTimeout(()=>{hint.textContent='copy';hint.classList.remove('copied-hint');},1500);
  });
}
</script>
</body>
</html>
