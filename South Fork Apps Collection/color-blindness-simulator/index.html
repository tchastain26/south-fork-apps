<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Blindness Simulator | South Fork Apps</title>
  <meta name="description" content="See how a color appears under protanopia, deuteranopia, tritanopia, and achromatopsia. Free online color blindness tool.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);font-size:.875rem}
  .nav a{color:var(--accent);text-decoration:none}.nav a:hover{text-decoration:underline}
  .nav-title{color:var(--muted)}
  main{flex:1;padding:1.5rem;max-width:760px;margin:0 auto;width:100%}
  h1{font-size:1.4rem;margin-bottom:.25rem}
  .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}
  .input-row{display:flex;gap:1rem;align-items:center;margin-bottom:1.5rem;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;flex-wrap:wrap}
  input[type=color]{width:48px;height:48px;border:2px solid var(--border);border-radius:.5rem;cursor:pointer;background:none;padding:0}
  input[type=text]{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:.5rem .75rem;border-radius:.375rem;font-size:1rem;font-family:'Courier New',monospace;width:130px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .preview-swatch{width:80px;height:48px;border-radius:.375rem;border:1px solid var(--border);flex-shrink:0}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
  .swatch-card{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;overflow:hidden}
  .swatch-color{height:80px;width:100%}
  .swatch-info{padding:.75rem}
  .swatch-name{font-weight:600;font-size:.9rem;margin-bottom:.2rem}
  .swatch-hex{font-family:'Courier New',monospace;font-size:.85rem;color:var(--accent);margin-bottom:.4rem}
  .swatch-desc{font-size:.75rem;color:var(--muted);line-height:1.4}
  footer{text-align:center;padding:.75rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">← South Fork Apps</a><span class="nav-title">Color Blindness Simulator</span></nav>
<main>
  <h1>Color Blindness Simulator</h1>
  <p class="subtitle">See how a color appears under four types of color blindness.</p>
  <div class="input-row">
    <input type="color" id="colorPicker" value="#7ddb84" oninput="onPicker()">
    <input type="text" id="hexInput" value="#7ddb84" placeholder="#rrggbb" oninput="onHex()">
    <div class="preview-swatch" id="previewSwatch" style="background:#7ddb84"></div>
    <span style="font-size:.8rem;color:var(--muted)">Enter any hex color</span>
  </div>
  <div class="swatches" id="swatches"></div>
  <footer>v1.0</footer>
</main>
<script>
// Brettel/Viénot simulation matrices (linearized sRGB)
// Source: Lindbloom / Machado et al. approximation
const SIMULATIONS=[
  {name:'Normal Vision',key:'normal',desc:'Full trichromatic color vision. No simulation applied.'},
  {name:'Protanopia',key:'protan',desc:'Red-blind. L-cones are missing or non-functional. Reds appear dark, red-green pairs look similar.'},
  {name:'Deuteranopia',key:'deutan',desc:'Green-blind. M-cones are missing. Red-green discrimination is severely impaired.'},
  {name:'Tritanopia',key:'tritan',desc:'Blue-blind. S-cones are missing. Blue-yellow pairs appear indistinguishable.'},
  {name:'Achromatopsia',key:'achro',desc:'Complete color blindness. Only rod cells active. The world appears in shades of gray.'},
];

// LMS simulation matrices (Viénot 1999 / Brettel 1997 simplified)
function simulate(r,g,b,key){
  // Convert to linear
  function lin(c){return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
  function srgb(c){return c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;}
  const rl=lin(r/255),gl=lin(g/255),bl=lin(b/255);
  let rO=rl,gO=gl,bO=bl;
  if(key==='normal'){rO=rl;gO=gl;bO=bl;}
  else if(key==='protan'){
    // Protanopia matrix (Viénot 1999)
    rO=0.56667*rl+0.43333*gl+0;
    gO=0.55833*rl+0.44167*gl+0;
    bO=0*rl+0.24167*gl+0.75833*bl;
  } else if(key==='deutan'){
    rO=0.625*rl+0.375*gl+0;
    gO=0.70*rl+0.30*gl+0;
    bO=0*rl+0.30*gl+0.70*bl;
  } else if(key==='tritan'){
    rO=0.95*rl+0.05*gl+0;
    gO=0*rl+0.43333*gl+0.56667*bl;
    bO=0*rl+0.475*gl+0.525*bl;
  } else if(key==='achro'){
    const lum=0.299*rl+0.587*gl+0.114*bl;
    rO=gO=bO=lum;
  }
  const ro=Math.round(Math.min(1,Math.max(0,srgb(rO)))*255);
  const go=Math.round(Math.min(1,Math.max(0,srgb(gO)))*255);
  const bo=Math.round(Math.min(1,Math.max(0,srgb(bO)))*255);
  return {r:ro,g:go,b:bo};
}

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
  return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}

function render(hex){
  const rgb=hexToRgb(hex);
  const container=document.getElementById('swatches');
  container.innerHTML='';
  SIMULATIONS.forEach(sim=>{
    const {r,g,b}=simulate(rgb.r,rgb.g,rgb.b,sim.key);
    const simHex=rgbToHex(r,g,b);
    const card=document.createElement('div');card.className='swatch-card';
    card.innerHTML=`<div class="swatch-color" style="background:${simHex}"></div><div class="swatch-info"><div class="swatch-name">${sim.name}</div><div class="swatch-hex">${simHex}</div><div class="swatch-desc">${sim.desc}</div></div>`;
    container.appendChild(card);
  });
}

function isValidHex(h){return /^#?[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(h);}

function onPicker(){
  const hex=document.getElementById('colorPicker').value;
  document.getElementById('hexInput').value=hex;
  document.getElementById('previewSwatch').style.background=hex;
  render(hex);
}

function onHex(){
  let hex=document.getElementById('hexInput').value.trim();
  if(!hex.startsWith('#')) hex='#'+hex;
  document.getElementById('previewSwatch').style.background=isValidHex(hex)?hex:'transparent';
  if(isValidHex(hex)){
    let h=hex.replace('#','');
    if(h.length===3) h=h.split('').map(x=>x+x).join('');
    document.getElementById('colorPicker').value='#'+h;
    render('#'+h);
  }
}

render('#7ddb84');
</script>
</body>
</html>
