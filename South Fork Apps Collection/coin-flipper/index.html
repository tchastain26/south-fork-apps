<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Flipper | South Fork Apps</title>
  <meta name="description" content="Flip a virtual coin with a satisfying animation. Tracks heads and tails counts and current streak. Free online coin flip tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(500px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;text-align:center;}
    h1{margin:0 0 .5rem;font-size:clamp(1.8rem,4vw,2.6rem);}
    p.sub{margin:0 0 2rem;color:var(--muted);line-height:1.6;}
    .coin-wrap{width:160px;height:160px;margin:0 auto 2rem;perspective:600px;}
    .coin{width:160px;height:160px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);}
    .coin.flip{animation:coinFlip .7s ease;}
    @keyframes coinFlip{
      0%{transform:rotateY(0);}
      40%{transform:rotateY(900deg) scale(1.1);}
      100%{transform:rotateY(var(--final-rot));}
    }
    .coin-face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:3.5rem;font-weight:900;border:4px solid var(--accent);user-select:none;}
    .coin-heads{background:radial-gradient(circle at 40% 35%, #2a3f2c, #1a2f1c);color:var(--accent);}
    .coin-tails{background:radial-gradient(circle at 40% 35%, #202722, #111412);color:var(--muted);transform:rotateY(180deg);}
    .result-label{font-size:1.5rem;font-weight:800;min-height:2rem;margin-bottom:.5rem;color:var(--accent);letter-spacing:.1em;}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1.5rem;}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem;}
    .stat-val{font-size:1.6rem;font-weight:800;color:var(--accent);}
    .stat-label{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:.2rem;}
    .btn-row{display:flex;gap:.75rem;justify-content:center;}
    .flip-btn{padding:1rem 2.5rem;border:none;border-radius:8px;background:var(--accent);color:#102113;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;transition:filter .15s;}
    .flip-btn:hover{filter:brightness(1.1);}
    .flip-btn:disabled{opacity:.5;cursor:default;}
    .reset-btn{padding:1rem 1.25rem;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;}
    .reset-btn:hover{color:var(--text);}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1rem;}
    footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Coin Flipper</span></nav>
<main>
  <h1>Coin Flipper</h1>
  <p class="sub">Press flip and let fate decide.</p>
  <div class="coin-wrap">
    <div class="coin" id="coin">
      <div class="coin-face coin-heads">H</div>
      <div class="coin-face coin-tails">T</div>
    </div>
  </div>
  <div class="result-label" id="resultLabel">&nbsp;</div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="headsCount">0</div><div class="stat-label">Heads</div></div>
    <div class="stat"><div class="stat-val" id="tailsCount">0</div><div class="stat-label">Tails</div></div>
    <div class="stat"><div class="stat-val" id="streakCount">0</div><div class="stat-label">Streak</div></div>
  </div>
  <div class="btn-row">
    <button class="flip-btn" id="flipBtn" onclick="flip()">Flip</button>
    <button class="reset-btn" onclick="reset()">Reset</button>
  </div>
  <div class="panel" style="margin-top:1.5rem;"><footer>v1.0</footer></div>
</main>
<script>
let heads=0,tails=0,streak=0,lastResult=null,flipping=false;
const coin=document.getElementById('coin');

function flip(){
  if(flipping)return;
  flipping=true;
  document.getElementById('flipBtn').disabled=true;
  const isHeads=Math.random()<.5;
  const spins=8+Math.floor(Math.random()*4);
  const finalRot=isHeads?spins*360:(spins*360+180);
  coin.style.setProperty('--final-rot',finalRot+'deg');
  coin.classList.remove('flip');
  void coin.offsetWidth;
  coin.classList.add('flip');
  setTimeout(()=>{
    coin.style.transform=`rotateY(${finalRot}deg)`;
    coin.classList.remove('flip');
    const result=isHeads?'HEADS':'TAILS';
    document.getElementById('resultLabel').textContent=result;
    if(isHeads)heads++;else tails++;
    if(lastResult===result)streak++;else streak=1;
    lastResult=result;
    document.getElementById('headsCount').textContent=heads;
    document.getElementById('tailsCount').textContent=tails;
    document.getElementById('streakCount').textContent=streak;
    flipping=false;
    document.getElementById('flipBtn').disabled=false;
  },700);
}

function reset(){
  heads=0;tails=0;streak=0;lastResult=null;
  document.getElementById('headsCount').textContent=0;
  document.getElementById('tailsCount').textContent=0;
  document.getElementById('streakCount').textContent=0;
  document.getElementById('resultLabel').textContent='\u00a0';
  coin.style.transform='rotateY(0deg)';
}
</script>
</body>
</html>
