<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Extractor | South Fork Apps</title>
  <meta name="description" content="Extract all URLs and links from any block of text. Free online link extractor tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav-back{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav-back:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(720px,calc(100% - 2rem));margin:3rem auto;display:flex;flex-direction:column;gap:1.5rem;}
    h1{font-size:1.75rem;font-weight:800;}
    h1 span{color:var(--accent);}
    .subtitle{color:var(--muted);font-size:.9rem;margin-top:.25rem;}
    label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
    .input-group{display:flex;flex-direction:column;gap:.5rem;}
    textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;line-height:1.6;outline:none;resize:vertical;min-height:160px;transition:border-color .15s;}
    textarea::placeholder{color:#3a3f3b;}
    textarea:focus{border-color:var(--accent);}
    .toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
    .count-badge{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.8rem;font-weight:700;color:var(--accent);}
    .count-badge.zero{color:var(--muted);}
    .btn{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--accent);font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:600;padding:.45rem 1rem;cursor:pointer;transition:background .15s,border-color .15s;}
    .btn:hover{background:var(--border);border-color:var(--accent);}
    .btn:disabled{color:var(--muted);cursor:default;border-color:var(--border);}
    .btn.copied{color:var(--accent);border-color:var(--accent);}
    .options{display:flex;gap:1rem;flex-wrap:wrap;}
    .option{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--muted);cursor:pointer;}
    .option input{accent-color:var(--accent);cursor:pointer;}
    .results-area{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-height:120px;max-height:380px;overflow-y:auto;}
    .url-item{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-bottom:1px solid var(--border);gap:.75rem;}
    .url-item:last-child{border-bottom:none;}
    .url-text{font-size:.82rem;color:var(--accent);word-break:break-all;flex:1;font-family:monospace;}
    .copy-link{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:600;padding:.25rem .5rem;cursor:pointer;transition:all .15s;}
    .copy-link:hover{border-color:var(--accent);color:var(--accent);}
    .copy-link.copied{color:var(--accent);border-color:var(--accent);}
    .empty-state{display:flex;align-items:center;justify-content:center;height:80px;color:var(--border);font-size:.9rem;}
  </style>
</head>
<body>
<nav class="nav">
  <a href="../../index.html" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">Extract URLs</span>
</nav>
<main>
  <div>
    <h1>Extract <span>URLs</span></h1>
    <p class="subtitle">Paste HTML, markdown, or plain text — pull out every link instantly.</p>
  </div>
  <div class="input-group">
    <label>Paste Content</label>
    <textarea id="input" placeholder="Paste HTML, markdown, or any text containing URLs..."></textarea>
  </div>
  <div class="options">
    <label class="option"><input type="checkbox" id="opt-dedup" checked> Remove duplicates</label>
    <label class="option"><input type="checkbox" id="opt-sort"> Sort alphabetically</label>
    <label class="option"><input type="checkbox" id="opt-http" checked> http/https only</label>
  </div>
  <div class="toolbar">
    <span class="count-badge zero" id="count">0 URLs found</span>
    <button class="btn" id="copy-all-btn" disabled>Copy All</button>
    <button class="btn" id="clear-btn">Clear</button>
  </div>
  <div class="results-area" id="results">
    <div class="empty-state">Paste something above to extract URLs</div>
  </div>
</main>
<script>
  // Matches http/https URLs and bare URLs with common TLDs
  const URL_RE = /https?:\/\/[^\s"'<>\]\)]+|(?<![a-zA-Z])(?:www\.)[^\s"'<>\]\)]+/gi;
  // Also extract from href="..." and src="..." and markdown [text](url)
  const HREF_RE = /(?:href|src|url|action)=["']([^"']+)["']/gi;
  const MD_RE = /\[(?:[^\]]*)\]\(([^)]+)\)/g;

  function clean(url) {
    return url.replace(/[.,;:!?)\]}>]+$/, '').trim();
  }

  function extract(text) {
    const found = new Set();
    let m;

    // href/src attributes
    HREF_RE.lastIndex = 0;
    while ((m = HREF_RE.exec(text)) !== null) {
      const u = clean(m[1]);
      if (u) found.add(u);
    }

    // markdown links
    MD_RE.lastIndex = 0;
    while ((m = MD_RE.exec(text)) !== null) {
      const u = clean(m[1]);
      if (u) found.add(u);
    }

    // bare URLs
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
      const u = clean(m[0]);
      if (u) found.add(u);
    }

    return [...found];
  }

  function render() {
    const text = document.getElementById('input').value;
    const dedup = document.getElementById('opt-dedup').checked;
    const sort = document.getElementById('opt-sort').checked;
    const httpOnly = document.getElementById('opt-http').checked;

    let urls = extract(text);

    if (httpOnly) urls = urls.filter(u => /^https?:\/\//i.test(u));
    if (dedup) urls = [...new Set(urls)];
    if (sort) urls.sort();

    const countEl = document.getElementById('count');
    const copyAllBtn = document.getElementById('copy-all-btn');
    const results = document.getElementById('results');

    countEl.textContent = `${urls.length} URL${urls.length !== 1 ? 's' : ''} found`;
    countEl.className = 'count-badge' + (urls.length === 0 ? ' zero' : '');
    copyAllBtn.disabled = urls.length === 0;

    if (urls.length === 0) {
      results.innerHTML = `<div class="empty-state">${text.trim() ? 'No URLs found' : 'Paste something above to extract URLs'}</div>`;
      return;
    }

    results.innerHTML = urls.map((url, i) => `
      <div class="url-item">
        <span class="url-text">${url.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>
        <button class="copy-link" data-url="${url.replace(/"/g,'&quot;')}" data-idx="${i}">Copy</button>
      </div>`).join('');

    results.querySelectorAll('.copy-link').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.url).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = btn.dataset.url; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        });
        btn.textContent = 'Copied!'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      });
    });
  }

  document.getElementById('input').addEventListener('input', render);
  ['opt-dedup','opt-sort','opt-http'].forEach(id => document.getElementById(id).addEventListener('change', render));

  document.getElementById('copy-all-btn').addEventListener('click', () => {
    const text = document.getElementById('input').value;
    const dedup = document.getElementById('opt-dedup').checked;
    const sort = document.getElementById('opt-sort').checked;
    const httpOnly = document.getElementById('opt-http').checked;
    let urls = extract(text);
    if (httpOnly) urls = urls.filter(u => /^https?:\/\//i.test(u));
    if (dedup) urls = [...new Set(urls)];
    if (sort) urls.sort();
    navigator.clipboard.writeText(urls.join('\n')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = urls.join('\n'); document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    });
    const btn = document.getElementById('copy-all-btn');
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy All'; btn.classList.remove('copied'); }, 1500);
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    document.getElementById('input').value = ''; render();
  });
</script>
</body>
</html>
