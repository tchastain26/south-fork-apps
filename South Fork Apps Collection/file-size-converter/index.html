<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Size Converter | South Fork Apps</title>
  <meta name="description" content="Convert between bytes, KB, MB, GB, TB, and PB instantly. Free online file size converter with bit equivalents.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111412; --surface:#1a1f1b; --surface-2:#202722; --border:#2a2f2b; --accent:#7ddb84; --text:#e8e8e8; --muted:#aab5ac; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; }
    .nav { display:flex; align-items:center; gap:1rem; padding:.75rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); }
    .nav a { color:var(--accent); text-decoration:none; font-size:.875rem; font-weight:500; }
    .nav a:hover { text-decoration:underline; }
    .nav-title { color:var(--text); font-size:.875rem; font-weight:600; }
    main { width:min(640px,calc(100% - 2rem)); margin:0 auto; padding:2rem 0; display:flex; flex-direction:column; gap:1rem; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1.5rem; }
    h1 { margin:0 0 .4rem; font-size:clamp(2rem,7vw,3.5rem); line-height:1; }
    .sub { color:var(--muted); margin:0 0 1.25rem; line-height:1.6; }
    .input-row { display:grid; grid-template-columns:1fr auto; gap:.75rem; align-items:end; }
    label { display:grid; gap:.4rem; color:var(--muted); font-size:.84rem; font-weight:700; }
    input[type="number"] { width:100%; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; font-size:1.1rem; padding:.9rem 1rem; outline:none; }
    input[type="number"]:focus { border-color:var(--accent); }
    select { border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; font-size:1rem; padding:.9rem 1rem; outline:none; cursor:pointer; }
    select:focus { border-color:var(--accent); }
    .results { display:grid; gap:.4rem; margin-top:1.25rem; }
    .result-row { display:flex; justify-content:space-between; align-items:center; padding:.75rem 1rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; cursor:pointer; }
    .result-row:hover { border-color:var(--accent); }
    .result-row.highlight { border-color:var(--accent); background:rgba(125,219,132,.05); }
    .unit-label { font-size:.875rem; font-weight:700; color:var(--muted); }
    .unit-val { font-size:1.1rem; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
    .result-row.highlight .unit-label,.result-row.highlight .unit-val { color:var(--accent); }
    .divider { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); opacity:.6; padding:.5rem 0 .25rem; }
    .copy-hint { font-size:.75rem; color:var(--muted); text-align:center; margin-top:.5rem; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:.75rem; }
    @media(max-width:480px) { .input-row { grid-template-columns:1fr; } .nav { padding-inline:1rem; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="https://southforkapps.com">← South Fork Apps</a>
    <span class="nav-title">File Size Converter</span>
  </nav>
  <main>
    <div class="panel">
      <h1>File size.</h1>
      <p class="sub">Enter a value, pick a unit, and see every conversion instantly. Click any row to copy.</p>

      <div class="input-row">
        <label>Value
          <input type="number" id="valInput" value="1" min="0" step="any" oninput="convert()">
        </label>
        <label>Unit
          <select id="unitSel" onchange="convert()">
            <option value="0">Bytes (B)</option>
            <option value="1">Kilobytes (KB)</option>
            <option value="2" selected>Megabytes (MB)</option>
            <option value="3">Gigabytes (GB)</option>
            <option value="4">Terabytes (TB)</option>
            <option value="5">Petabytes (PB)</option>
          </select>
        </label>
      </div>

      <div class="results" id="results"></div>
      <p class="copy-hint">Click any row to copy its value.</p>
      <footer>v1.0</footer>
    </div>
  </main>

  <script>
    const BYTE_UNITS = ['Bytes','Kilobytes','Megabytes','Gigabytes','Terabytes','Petabytes'];
    const BYTE_ABBR  = ['B','KB','MB','GB','TB','PB'];
    const BIT_UNITS  = ['Bits','Kilobits','Megabits','Gigabits','Terabits','Petabits'];
    const BIT_ABBR   = ['b','Kb','Mb','Gb','Tb','Pb'];

    function fmt(n) {
      if (n === 0) return '0';
      if (n >= 1e15) return (n/1e15).toLocaleString(undefined,{maximumFractionDigits:4}) + 'e15';
      if (Math.abs(n) < 0.0001 && n !== 0) return n.toExponential(4);
      return n.toLocaleString(undefined, {maximumFractionDigits:6, maximumSignificantDigits:10});
    }

    function convert() {
      const val = parseFloat(document.getElementById('valInput').value);
      const unit = parseInt(document.getElementById('unitSel').value);
      const results = document.getElementById('results');

      if (isNaN(val) || val < 0) { results.innerHTML = '<div style="color:var(--muted);padding:.5rem">Enter a valid number above.</div>'; return; }

      const bytes = val * Math.pow(1024, unit);
      results.innerHTML = '';

      const byteDiv = document.createElement('div'); byteDiv.className = 'divider'; byteDiv.textContent = 'Byte units'; results.appendChild(byteDiv);
      for (let i = 0; i < 6; i++) {
        const converted = bytes / Math.pow(1024, i);
        addRow(results, BYTE_ABBR[i], BYTE_UNITS[i], converted, i === unit);
      }

      const bitDiv = document.createElement('div'); bitDiv.className = 'divider'; bitDiv.textContent = 'Bit units'; results.appendChild(bitDiv);
      for (let i = 0; i < 6; i++) {
        const converted = (bytes * 8) / Math.pow(1024, i);
        addRow(results, BIT_ABBR[i], BIT_UNITS[i], converted, false);
      }
    }

    function addRow(container, abbr, name, val, highlight) {
      const row = document.createElement('div');
      row.className = 'result-row' + (highlight ? ' highlight' : '');
      row.innerHTML = `<span class="unit-label">${abbr} — ${name}</span><span class="unit-val">${fmt(val)}</span>`;
      row.onclick = () => { navigator.clipboard.writeText(String(val)); row.style.opacity='.5'; setTimeout(()=>row.style.opacity='',300); };
      container.appendChild(row);
    }

    convert();
  </script>
</body>
</html>
