<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Scaler | South Fork Apps</title>
  <meta name="description" content="Scale any recipe up or down by changing the number of servings. Free online recipe scaling tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412;
      --surface: #1a1f1b;
      --surface-2: #202722;
      --border: #2a2f2b;
      --accent: #7ddb84;
      --text: #e8e8e8;
      --muted: #aab5ac;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border); }
    .nav-back { color: var(--accent); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    .nav-back:hover { text-decoration: underline; }
    .nav-title { color: var(--text); font-size: 0.875rem; font-weight: 600; }
    main { width: min(980px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0; display: grid; gap: 1rem; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
    h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    textarea { width: 100%; min-height: 18rem; margin-top: 1rem; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; line-height: 1.6; padding: 1rem; outline: none; font-family: 'Courier New', monospace; font-size: 0.9rem; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(125,219,132,0.1); }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
    label { display: grid; gap: 0.4rem; color: var(--muted); font-size: 0.84rem; font-weight: 700; }
    input[type="number"] { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; padding: 0.9rem 1rem; outline: none; }
    input[type="number"]:focus { border-color: var(--accent); }
    .btn-row { display: flex; gap: 0.75rem; margin-top: 0.75rem; }
    button { min-height: 2.9rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; font-weight: 800; cursor: pointer; flex: 1; }
    button:hover { border-color: var(--accent); }
    .primary { border-color: var(--accent); background: var(--accent); color: #102113; }
    .primary:hover { background: #5ec966; }
    .status { min-height: 1.4rem; color: var(--muted); font-size: 0.88rem; font-weight: 700; margin-top: 0.5rem; }
    .status.error { color: #ff9f9f; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; word-break: break-word; color: var(--text); font-family: 'Courier New', monospace; font-size: 0.9rem; min-height: 10rem; line-height: 1.6; }
    footer { margin-top: 0.75rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 500px) { .controls { grid-template-columns: 1fr; } .nav { padding-inline: 1rem; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
    <span class="nav-title">Recipe Scaler</span>
  </nav>
  <main>
    <section class="panel">
      <h1>Scale any recipe.</h1>
      <p>Paste your recipe, set the original and target servings, and every ingredient adjusts instantly.</p>
      <textarea id="recipeInput" placeholder="Paste recipe here, one line per ingredient:

2 cups flour
1 tsp salt
3 large eggs
0.5 cup butter
1 tbsp sugar">2 cups flour
1 tsp salt
3 large eggs
0.5 cup butter
1 tbsp sugar</textarea>
      <div class="controls">
        <label>Original servings
          <input type="number" id="originalServings" value="4" min="1" step="1">
        </label>
        <label>New servings
          <input type="number" id="newServings" value="8" min="1" step="1">
        </label>
      </div>
      <div class="btn-row">
        <button class="primary" type="button" onclick="doScale()">Scale Recipe</button>
        <button type="button" onclick="clearAll()">Clear</button>
      </div>
      <div id="status" class="status"></div>
      <footer>v1.0</footer>
    </section>

    <section class="panel">
      <h1>Scaled result.</h1>
      <p>Lines with leading numbers are scaled. All other lines pass through unchanged.</p>
      <pre id="scaledRecipe">Scaled recipe will appear here.</pre>
      <div class="btn-row">
        <button type="button" onclick="copyResult()">Copy Result</button>
      </div>
    </section>
  </main>

  <script>
    const FRAC = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};

    function parseLeadingNum(str) {
      str = str.trim();
      if (FRAC[str]) return FRAC[str];
      const mixed1 = str.match(/^(\d+)\s*([½⅓⅔¼¾⅛⅜⅝⅞])$/);
      if (mixed1) return parseInt(mixed1[1]) + FRAC[mixed1[2]];
      const mixed2 = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
      if (mixed2) return parseInt(mixed2[1]) + parseInt(mixed2[2]) / parseInt(mixed2[3]);
      const frac = str.match(/^(\d+)\/(\d+)$/);
      if (frac) return parseInt(frac[1]) / parseInt(frac[2]);
      const n = parseFloat(str);
      return isNaN(n) ? null : n;
    }

    function formatNum(n) {
      if (n === Math.floor(n)) return String(Math.round(n));
      const r = Math.round(n * 1000) / 1000;
      const pairs = [[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']];
      for (const [val, sym] of pairs) {
        if (Math.abs(r - val) < 0.02) return sym;
        const w = Math.floor(r);
        if (w > 0 && Math.abs(r - w - val) < 0.02) return `${w}${sym}`;
      }
      return String(Math.round(n * 100) / 100);
    }

    function scaleLine(line, factor) {
      const m = line.match(/^(\s*)([\d½⅓⅔¼¾⅛⅜⅝⅞][^\s]*(?:\s+\d+\/\d+)?)(.*)$/);
      if (!m) return line;
      const num = parseLeadingNum(m[2]);
      if (num === null) return line;
      return m[1] + formatNum(num * factor) + m[3];
    }

    function doScale() {
      const text = document.getElementById('recipeInput').value.trim();
      const orig = parseFloat(document.getElementById('originalServings').value);
      const next = parseFloat(document.getElementById('newServings').value);
      const statusEl = document.getElementById('status');

      if (!text) {
        statusEl.textContent = 'Paste a recipe first.';
        statusEl.className = 'status error';
        return;
      }
      if (!orig || orig <= 0 || !next || next <= 0) {
        statusEl.textContent = 'Servings must be greater than zero.';
        statusEl.className = 'status error';
        return;
      }

      const factor = next / orig;
      const lines = text.split('\n').map(l => scaleLine(l, factor));
      document.getElementById('scaledRecipe').textContent = lines.join('\n');
      statusEl.textContent = `Scaled ×${Math.round(factor * 100) / 100} (${orig} → ${next} servings).`;
      statusEl.className = 'status';
    }

    function copyResult() {
      const text = document.getElementById('scaledRecipe').textContent;
      if (text && text !== 'Scaled recipe will appear here.') {
        navigator.clipboard.writeText(text);
        document.getElementById('status').textContent = 'Copied to clipboard.';
        document.getElementById('status').className = 'status';
      }
    }

    function clearAll() {
      document.getElementById('recipeInput').value = '';
      document.getElementById('scaledRecipe').textContent = 'Scaled recipe will appear here.';
      document.getElementById('status').textContent = '';
    }

    doScale();
  </script>
</body>
</html>
