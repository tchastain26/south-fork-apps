<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fibonacci Sequence | South Fork Apps</title>
  <meta name="description" content="Generate Fibonacci sequences, find the Nth term, or check if a number is a Fibonacci number. Free online Fibonacci tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(720px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;}
    h1{margin:0 0 .5rem;font-size:clamp(1.8rem,4vw,2.6rem);}
    p.sub{margin:0 0 1.5rem;color:var(--muted);line-height:1.6;}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1rem;}
    .mode-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;}
    .tab{padding:.45rem 1rem;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--muted);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;}
    .tab.active{border-color:var(--accent);color:var(--accent);}
    label{display:block;margin-bottom:.4rem;color:var(--muted);font-size:.82rem;font-weight:700;}
    input[type=text],input[type=number]{width:100%;padding:.65rem .85rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font:inherit;font-size:1rem;outline:none;}
    input:focus{border-color:var(--accent);}
    .run-btn{display:block;width:100%;margin-top:.75rem;padding:.65rem;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#102113;font:inherit;font-size:.95rem;font-weight:800;cursor:pointer;}
    .run-btn:hover{filter:brightness(1.08);}
    .result-box{margin-top:.75rem;padding:.85rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,monospace;font-size:.88rem;color:var(--text);line-height:1.6;word-break:break-all;min-height:60px;}
    .result-box.is-fib{color:var(--accent);}
    .result-meta{margin-top:.5rem;font-size:.8rem;color:var(--muted);}
    .copy-btn{display:block;width:100%;margin-top:.5rem;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--muted);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;}
    .copy-btn:hover{color:var(--accent);border-color:var(--accent);}
    footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Fibonacci Sequence</span></nav>
<main>
  <h1>Fibonacci Sequence</h1>
  <p class="sub">Generate sequences, find a specific term, or check if a number belongs.</p>
  <div class="panel">
    <div class="mode-tabs">
      <button class="tab active" onclick="setMode('gen',this)">Generate N Terms</button>
      <button class="tab" onclick="setMode('nth',this)">Find Nth Term</button>
      <button class="tab" onclick="setMode('check',this)">Is it Fibonacci?</button>
    </div>
    <div id="modeGen">
      <label for="nTerms">Number of terms (1&ndash;100)</label>
      <input type="number" id="nTerms" value="10" min="1" max="100">
      <button class="run-btn" onclick="run()">Generate</button>
    </div>
    <div id="modeNth" style="display:none;">
      <label for="nthN">Which term? (1-indexed, 1&ndash;100)</label>
      <input type="number" id="nthN" value="10" min="1" max="100">
      <button class="run-btn" onclick="run()">Find Term</button>
    </div>
    <div id="modeCheck" style="display:none;">
      <label for="checkNum">Number to check</label>
      <input type="text" id="checkNum" value="89" placeholder="Enter a non-negative integer">
      <button class="run-btn" onclick="run()">Check</button>
    </div>
  </div>
  <div class="panel" id="outPanel" style="display:none;">
    <label>Result</label>
    <div class="result-box" id="resultBox"></div>
    <div class="result-meta" id="resultMeta"></div>
    <button class="copy-btn" onclick="copyOut()">Copy</button>
  </div>
  <div class="panel"><footer>v1.0</footer></div>
</main>
<script>
let mode='gen';

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('modeGen').style.display=m==='gen'?'':'none';
  document.getElementById('modeNth').style.display=m==='nth'?'':'none';
  document.getElementById('modeCheck').style.display=m==='check'?'':'none';
  document.getElementById('outPanel').style.display='none';
}

function fibSeq(n){
  const seq=[0n,1n];
  for(let i=2;i<n;i++) seq.push(seq[i-1]+seq[i-2]);
  return seq.slice(0,n);
}

function isPerfectSquare(n){
  if(n<0n)return false;
  const r=BigInt(Math.round(Math.sqrt(Number(n))));
  for(let c=r-2n;c<=r+2n;c++) if(c>=0n&&c*c===n)return true;
  return false;
}

function isFibNum(n){
  if(n<0n)return false;
  return isPerfectSquare(5n*n*n+4n)||isPerfectSquare(5n*n*n-4n);
}

function run(){
  const box=document.getElementById('resultBox');
  const meta=document.getElementById('resultMeta');
  const panel=document.getElementById('outPanel');
  panel.style.display='';
  box.className='result-box';

  if(mode==='gen'){
    let n=parseInt(document.getElementById('nTerms').value);
    if(isNaN(n)||n<1)n=1;if(n>100)n=100;
    const seq=fibSeq(n);
    box.textContent=seq.join(', ');
    meta.textContent=`${n} terms. Largest: ${seq[seq.length-1].toLocaleString()}`;
  } else if(mode==='nth'){
    let n=parseInt(document.getElementById('nthN').value);
    if(isNaN(n)||n<1)n=1;if(n>100)n=100;
    const seq=fibSeq(n);
    const val=seq[n-1];
    box.textContent='F('+n+') = '+val.toLocaleString();
    meta.textContent=`Term #${n} in the Fibonacci sequence (0-indexed as F(0)=0, F(1)=1...).`;
  } else {
    const raw=document.getElementById('checkNum').value.trim();
    let n;
    try{n=BigInt(raw);}catch(e){box.textContent='Not a valid integer.';meta.textContent='';return;}
    if(n<0n){box.textContent='Must be non-negative.';meta.textContent='';return;}
    const isFib=isFibNum(n);
    box.className='result-box'+(isFib?' is-fib':'');
    box.textContent=isFib?'YES — '+n.toLocaleString()+' is a Fibonacci number.':'NO — '+n.toLocaleString()+' is not a Fibonacci number.';
    meta.textContent='';
  }
}

function copyOut(){
  const val=document.getElementById('resultBox').textContent;
  navigator.clipboard.writeText(val).then(()=>{
    const b=document.querySelector('.copy-btn');
    b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500);
  });
}
</script>
</body>
</html>
