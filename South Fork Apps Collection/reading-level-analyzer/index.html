<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Level Analyzer | South Fork Apps</title>
  <meta name="description" content="Analyze the reading level of any text. Get Flesch-Kincaid grade level and readability scores instantly. Free online tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .pane:last-child { border-right: none; }
    .pane-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); }
    textarea { flex: 1; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.7; padding: 16px; border: none; outline: none; resize: none; min-height: 400px; }
    .results { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .empty { color: var(--text-dim); font-size: 14px; padding: 20px 0; }
    .grade-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: center; }
    .grade-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 8px; }
    .grade-value { font-size: 56px; font-weight: 800; color: var(--primary); line-height: 1; }
    .grade-name { font-size: 15px; color: var(--text-mid); margin-top: 8px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .ease-bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .ease-fill { height: 100%; border-radius: 4px; background: var(--primary); transition: width .4s; }
    .score-label { font-size: 12px; color: var(--text-mid); margin-top: 6px; }
  </style>
</head>
<body>
<header>
  <a href="../../">← South Fork Apps</a>
  <h1>Reading Level Analyzer</h1>
</header>
<main>
  <div class="pane">
    <div class="pane-header">Paste Your Text</div>
    <textarea id="inputEl" placeholder="Paste any text here to analyze its reading level..." oninput="analyze()"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">Results</div>
    <div class="results" id="resultsEl">
      <p class="empty">Paste text on the left to see readability analysis.</p>
    </div>
  </div>
</main>
<script>
const inputEl = document.getElementById('inputEl');
const resultsEl = document.getElementById('resultsEl');

const GRADE_NAMES = [
  [1,'1st Grade'],[2,'2nd Grade'],[3,'3rd Grade'],[4,'4th Grade'],[5,'5th Grade'],
  [6,'6th Grade'],[7,'7th Grade'],[8,'8th Grade'],[9,'9th Grade'],[10,'10th Grade'],
  [11,'11th Grade'],[12,'12th Grade'],[13,'College Freshman'],[14,'College Sophomore'],
  [15,'College Junior'],[16,'College Senior'],[17,'Post-Graduate']
];

function gradeName(g) {
  const n = Math.round(g);
  if (n <= 0) return 'Very Easy';
  if (n >= 17) return 'Post-Graduate';
  return (GRADE_NAMES.find(([k]) => k === n) || [0,'Unknown'])[1];
}

function countSyllables(word) {
  word = word.toLowerCase().replace(/[^a-z]/g,'');
  if (!word) return 0;
  if (word.length <= 3) return 1;
  word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
  word = word.replace(/^y/, '');
  const m = word.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}

function analyze() {
  const text = inputEl.value.trim();
  if (!text) { resultsEl.innerHTML = '<p class="empty">Paste text on the left to see readability analysis.</p>'; return; }

  const words = text.match(/\b\w+\b/g) || [];
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 2);
  const syllables = words.reduce((n, w) => n + countSyllables(w), 0);

  const wc = words.length;
  const sc = Math.max(sentences.length, 1);
  const sylc = syllables;

  if (wc < 10) { resultsEl.innerHTML = '<p class="empty">Need at least 10 words for an accurate analysis.</p>'; return; }

  // Flesch-Kincaid Grade Level
  const fkgl = 0.39 * (wc / sc) + 11.8 * (sylc / wc) - 15.59;
  // Flesch Reading Ease
  const fre  = 206.835 - 1.015 * (wc / sc) - 84.6 * (sylc / wc);
  // Gunning Fog
  const complexWords = words.filter(w => countSyllables(w) >= 3).length;
  const fog = 0.4 * ((wc / sc) + 100 * (complexWords / wc));

  const freScore = Math.min(100, Math.max(0, fre));
  const freLabel = fre >= 90 ? 'Very Easy' : fre >= 80 ? 'Easy' : fre >= 70 ? 'Fairly Easy' :
    fre >= 60 ? 'Standard' : fre >= 50 ? 'Fairly Difficult' : fre >= 30 ? 'Difficult' : 'Very Difficult';

  const avgWords = (wc / sc).toFixed(1);
  const avgSyl = (sylc / wc).toFixed(2);
  const chars = text.replace(/\s/g,'').length;
  const paragraphs = text.split(/\n{2,}/).filter(p => p.trim()).length;

  resultsEl.innerHTML = `
    <div class="grade-hero">
      <div class="grade-label">Flesch-Kincaid Grade Level</div>
      <div class="grade-value">${Math.max(1, fkgl).toFixed(1)}</div>
      <div class="grade-name">${gradeName(fkgl)}</div>
    </div>

    <div class="stat" style="grid-column:span 2">
      <div class="stat-label">Flesch Reading Ease — ${freLabel}</div>
      <div class="stat-value">${freScore.toFixed(1)} / 100</div>
      <div class="ease-bar"><div class="ease-fill" style="width:${freScore}%"></div></div>
      <div class="score-label">Higher = easier to read. 60–70 is plain English for most audiences.</div>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Gunning Fog</div><div class="stat-value">${fog.toFixed(1)}</div></div>
      <div class="stat"><div class="stat-label">Words</div><div class="stat-value">${wc.toLocaleString()}</div></div>
      <div class="stat"><div class="stat-label">Sentences</div><div class="stat-value">${sc.toLocaleString()}</div></div>
      <div class="stat"><div class="stat-label">Syllables</div><div class="stat-value">${sylc.toLocaleString()}</div></div>
      <div class="stat"><div class="stat-label">Avg Words/Sentence</div><div class="stat-value">${avgWords}</div></div>
      <div class="stat"><div class="stat-label">Avg Syllables/Word</div><div class="stat-value">${avgSyl}</div></div>
      <div class="stat"><div class="stat-label">Characters</div><div class="stat-value">${chars.toLocaleString()}</div></div>
      <div class="stat"><div class="stat-label">Paragraphs</div><div class="stat-value">${paragraphs}</div></div>
    </div>
  `;
}
</script>
</body>
</html>
