<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calories Burned Calculator | South Fork Apps</title>
  <meta name="description" content="Estimate calories burned during exercise using MET values. Supports 50+ activities, body weight, and duration. Free online calories burned calculator.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(680px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem;}
    h1{margin:0 0 .4rem;font-size:clamp(1.6rem,3.5vw,2.2rem);}
    .sub{margin:0 0 1.5rem;color:var(--muted);line-height:1.6;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
    .field{margin-bottom:.85rem;}
    label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.3rem;}
    input,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.6rem .85rem;font:inherit;font-size:.92rem;outline:none;}
    input:focus,select:focus{border-color:var(--accent);}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
    .unit-toggle{display:flex;gap:.4rem;margin-bottom:.85rem;}
    .unit-btn{padding:.3rem .8rem;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;}
    .unit-btn.active{border-color:var(--accent);background:rgba(125,219,132,.1);color:var(--accent);}
    .result-big{background:var(--surface2);border-radius:10px;padding:1.2rem;text-align:center;margin-bottom:.6rem;}
    .result-num{font-size:3rem;font-weight:800;color:var(--accent);line-height:1;}
    .result-unit{font-size:.85rem;color:var(--muted);margin-top:.2rem;font-weight:700;}
    .equiv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem;}
    .equiv-item{background:var(--surface2);border-radius:8px;padding:.6rem;text-align:center;}
    .equiv-val{font-size:.95rem;font-weight:800;}
    .equiv-label{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.15rem;}
    optgroup{font-weight:700;}
    footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
<!-- SFA_ADS_START -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3076043873825717" crossorigin="anonymous"></script>
<!-- SFA_ADS_END -->
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Calories Burned</span></nav>
<main>
  <h1>Calories Burned Calculator</h1>
  <p class="sub">Estimate calories burned from any activity using metabolic equivalent (MET) values.</p>

  <div class="card">
    <div class="unit-toggle">
      <button class="unit-btn active" id="btnLbs" onclick="setUnit('lbs')">lbs</button>
      <button class="unit-btn" id="btnKg" onclick="setUnit('kg')">kg</button>
    </div>
    <div class="two-col">
      <div class="field"><label id="weightLabel">Weight (lbs)</label><input type="number" id="weight" value="170" min="1" oninput="calc()"></div>
      <div class="field"><label>Duration (minutes)</label><input type="number" id="duration" value="30" min="1" oninput="calc()"></div>
    </div>
    <div class="field">
      <label>Activity</label>
      <select id="activity" onchange="calc()">
        <optgroup label="Walking & Running">
          <option value="3.5">Walking, 3 mph</option>
          <option value="4.3">Walking, 4 mph</option>
          <option value="6.0">Jogging, 5 mph</option>
          <option value="8.3" selected>Running, 6 mph</option>
          <option value="11.0">Running, 7.5 mph</option>
          <option value="14.5">Running, 9 mph</option>
        </optgroup>
        <optgroup label="Cycling">
          <option value="4.0">Cycling, leisure</option>
          <option value="6.8">Cycling, 12–14 mph</option>
          <option value="10.0">Cycling, 16–19 mph</option>
          <option value="12.0">Cycling, 20+ mph</option>
          <option value="5.5">Stationary bike, moderate</option>
        </optgroup>
        <optgroup label="Swimming & Water">
          <option value="6.0">Swimming, leisurely</option>
          <option value="9.8">Swimming, freestyle fast</option>
          <option value="3.0">Water aerobics</option>
        </optgroup>
        <optgroup label="Strength & HIIT">
          <option value="3.5">Weight training, light</option>
          <option value="5.0">Weight training, vigorous</option>
          <option value="8.0">HIIT</option>
          <option value="3.8">Yoga</option>
          <option value="5.0">Pilates</option>
        </optgroup>
        <optgroup label="Sports">
          <option value="7.0">Basketball</option>
          <option value="8.0">Soccer</option>
          <option value="7.3">Tennis</option>
          <option value="4.5">Golf (walking)</option>
          <option value="6.0">Volleyball</option>
          <option value="9.0">Rowing, vigorous</option>
          <option value="12.0">Jump rope</option>
        </optgroup>
        <optgroup label="Daily Activities">
          <option value="2.5">Housework, general</option>
          <option value="3.5">Gardening</option>
          <option value="2.0">Standing</option>
          <option value="1.3">Sitting, light activity</option>
          <option value="5.0">Moving furniture</option>
          <option value="2.8">Cooking, active</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div id="resultArea" style="display:none">
    <div class="result-big">
      <div class="result-num" id="calNum">0</div>
      <div class="result-unit">calories burned</div>
    </div>
    <div class="equiv-grid" id="equivGrid"></div>
  </div>

  <footer>v1.0 · Formula: Calories = MET × weight(kg) × time(hours)</footer>
</main>
<script>
let unit = 'lbs';

function setUnit(u) {
  unit = u;
  document.getElementById('btnLbs').classList.toggle('active', u==='lbs');
  document.getElementById('btnKg').classList.toggle('active', u==='kg');
  document.getElementById('weightLabel').textContent = `Weight (${u})`;
  calc();
}

function calc() {
  const w = parseFloat(document.getElementById('weight').value)||0;
  const mins = parseFloat(document.getElementById('duration').value)||0;
  const met = parseFloat(document.getElementById('activity').value)||0;
  const kg = unit === 'lbs' ? w * 0.453592 : w;
  const cal = Math.round(met * kg * (mins / 60));

  document.getElementById('calNum').textContent = cal.toLocaleString();
  document.getElementById('resultArea').style.display = cal > 0 ? '' : 'none';

  const equivs = [
    { label:'Big Mac equivalent', val:(cal/550).toFixed(2) },
    { label:'Slices of pizza', val:(cal/285).toFixed(2) },
    { label:'Cans of soda', val:(cal/150).toFixed(1) },
    { label:'Minutes to walk off', val:Math.round(cal/(3.5*kg/60)) },
  ];
  document.getElementById('equivGrid').innerHTML = equivs.map(e => `
    <div class="equiv-item"><div class="equiv-val">${e.val}</div><div class="equiv-label">${e.label}</div></div>`).join('');
}

calc();
</script>
</body>
</html>
