<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator | South Fork Apps</title>
  <meta name="description" content="Format, beautify, and validate JSON instantly with syntax highlighting. Free online JSON formatter and minifier.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --danger: #f28b82; --radius: 12px;
      --font: 'Plus Jakarta Sans', sans-serif;
      --j-key: #aaccda; --j-str: #f7c876; --j-num: #b5cea8;
      --j-bool: #569cd6; --j-null: #c586c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .layout { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .pane:last-child { border-right: none; }
    .pane-header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    textarea { flex: 1; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; padding: 16px; border: none; outline: none; resize: none; min-height: 400px; }
    .output { flex: 1; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; padding: 16px; overflow: auto; white-space: pre; min-height: 400px; }
    .toolbar { padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 5px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); }
    .btn.primary { background: var(--primary-dim); color: var(--text); }
    .btn.primary:hover { background: var(--primary); color: #111; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .indent-sel { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 12px; padding: 4px 8px; outline: none; }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 5px; font-weight: 700; }
    .status.ok { background: rgba(125,219,132,.15); color: var(--primary); }
    .status.err { background: rgba(242,139,130,.15); color: var(--danger); }
    .j-key { color: var(--j-key); }
    .j-str { color: var(--j-str); }
    .j-num { color: var(--j-num); }
    .j-bool { color: var(--j-bool); }
    .j-null { color: var(--j-null); }
    .j-punc { color: var(--text-dim); }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>JSON Formatter &amp; Validator</h1>
</header>
<div class="layout">
  <div class="pane">
    <div class="pane-header">
      <span>Input JSON</span>
      <div style="display:flex;gap:6px;">
        <button class="btn ghost" onclick="inputEl.value='';convert()">Clear</button>
        <button class="btn ghost" onclick="paste()">Paste</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="convert()">Format</button>
      <button class="btn ghost" onclick="minify()">Minify</button>
      <label style="font-size:12px;color:var(--text-mid);display:flex;align-items:center;gap:6px;">
        Indent:
        <select class="indent-sel" id="indentSel" onchange="convert()">
          <option value="2" selected>2</option>
          <option value="4">4</option>
          <option value="1">Tab</option>
        </select>
      </label>
      <span class="status" id="statusEl" style="display:none"></span>
    </div>
    <textarea id="inputEl" placeholder='{"paste":"your JSON here"}' oninput="convert()" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span>Formatted Output</span>
      <button class="btn ghost" onclick="copyOutput()">Copy</button>
    </div>
    <div class="output" id="outputEl"></div>
  </div>
</div>
<script>
const inputEl = document.getElementById('inputEl');
const outputEl = document.getElementById('outputEl');
const statusEl = document.getElementById('statusEl');

function getIndent() {
  const v = document.getElementById('indentSel').value;
  return v === '1' ? '\t' : ' '.repeat(parseInt(v));
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function highlight(json) {
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|[{}\[\],:])/g, match => {
    if (/^".*":$/.test(match)) return `<span class="j-key">${esc(match)}</span>`;
    if (/^"/.test(match)) return `<span class="j-str">${esc(match)}</span>`;
    if (/true|false/.test(match)) return `<span class="j-bool">${match}</span>`;
    if (/null/.test(match)) return `<span class="j-null">${match}</span>`;
    if (/[{}\[\]]/.test(match)) return `<span class="j-punc">${match}</span>`;
    if (/,/.test(match)) return `<span class="j-punc">${match}</span>`;
    return `<span class="j-num">${match}</span>`;
  });
}

function setStatus(ok, msg) {
  statusEl.style.display = 'inline-block';
  statusEl.className = 'status ' + (ok ? 'ok' : 'err');
  statusEl.textContent = msg;
}

function convert() {
  const raw = inputEl.value.trim();
  if (!raw) { outputEl.innerHTML = ''; statusEl.style.display = 'none'; return; }
  try {
    const parsed = JSON.parse(raw);
    const indent = getIndent();
    const formatted = JSON.stringify(parsed, null, indent);
    outputEl.innerHTML = highlight(formatted);
    setStatus(true, 'Valid JSON');
  } catch(e) {
    outputEl.textContent = raw;
    setStatus(false, e.message.replace(/^JSON\.parse: /, '').slice(0, 60));
  }
}

function minify() {
  const raw = inputEl.value.trim();
  if (!raw) return;
  try {
    outputEl.textContent = JSON.stringify(JSON.parse(raw));
    setStatus(true, 'Minified');
  } catch(e) {
    setStatus(false, 'Invalid JSON');
  }
}

function copyOutput() { navigator.clipboard.writeText(outputEl.innerText); }

async function paste() {
  try { inputEl.value = await navigator.clipboard.readText(); convert(); } catch(e) {}
}
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
