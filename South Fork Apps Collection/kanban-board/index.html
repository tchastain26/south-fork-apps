<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board | South Fork Apps</title>
  <meta name="description" content="Simple drag-and-drop Kanban board saved in your browser. Add columns, cards, and tags. Free online Kanban tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --danger: #f28b82; --radius: 12px;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); }
    .btn.primary { background: var(--primary-dim); color: var(--text); }
    .btn.primary:hover { background: var(--primary); color: #111; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.ghost:hover { border-color: var(--danger); color: var(--danger); }
    .board { flex: 1; display: flex; gap: 16px; padding: 20px; overflow-x: auto; align-items: flex-start; }
    .column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 280px; flex-shrink: 0; display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
    .column.drag-over { border-color: var(--primary); background: rgba(125,219,132,.05); }
    .col-header { padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
    .col-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .col-title { flex: 1; font-size: 13px; font-weight: 700; outline: none; background: transparent; border: none; color: var(--text); font-family: var(--font); }
    .col-count { font-size: 11px; color: var(--text-dim); background: var(--surface2); border-radius: 10px; padding: 1px 7px; }
    .col-del { background: transparent; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 0 2px; }
    .col-del:hover { color: var(--danger); }
    .cards { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
    .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: grab; position: relative; }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .4; }
    .card.drag-placeholder { border: 2px dashed var(--primary); background: transparent; height: 60px; }
    .card-text { font-size: 13px; line-height: 1.5; color: var(--text); word-break: break-word; outline: none; min-height: 18px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .card-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .card-del { background: transparent; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer; opacity: 0; transition: opacity .15s; }
    .card:hover .card-del { opacity: 1; }
    .card-del:hover { color: var(--danger); }
    .add-card { padding: 8px 10px; display: flex; gap: 6px; border-top: 1px solid var(--border); }
    .add-card input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font); font-size: 13px; }
    .add-card input::placeholder { color: var(--text-dim); }
    .add-card button { background: var(--primary-dim); border: none; border-radius: 6px; color: var(--text); font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; font-family: var(--font); }
    .add-card button:hover { background: var(--primary); color: #111; }
    .add-col-btn { background: rgba(255,255,255,.04); border: 1px dashed var(--border); border-radius: var(--radius); width: 240px; flex-shrink: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--text-dim); font-size: 13px; font-weight: 600; }
    .add-col-btn:hover { border-color: var(--primary); color: var(--primary); }
    .saved-note { font-size: 11px; color: var(--text-dim); }
    .tag-sel { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--font); font-size: 11px; padding: 2px 4px; outline: none; }
  </style>
</head>
<body>
<header>
  <a href="../../">← South Fork Apps</a>
  <h1>Kanban Board</h1>
  <div class="header-right">
    <span class="saved-note" id="savedNote">Saved locally</span>
    <button class="btn ghost" onclick="clearBoard()">Clear All</button>
    <button class="btn ghost" onclick="exportBoard()">Export JSON</button>
  </div>
</header>
<div class="board" id="board"></div>
<script>
const COLORS = ['#7ddb84','#4361ee','#f7c876','#f28b82','#aaccda','#c586c0','#ff6b35','#b5cea8'];
const TAGS = ['','Bug','Feature','Idea','Urgent','Done','Review','Blocked'];
const TAG_COLORS = {'Bug':'#f28b82','Feature':'#4361ee','Idea':'#f7c876','Urgent':'#ff6b35','Done':'#7ddb84','Review':'#aaccda','Blocked':'#c586c0'};

let data = {
  columns: [
    { id: uid(), title: 'To Do', color: '#aaccda', cards: [
      { id: uid(), text: 'Add new feature', tag: 'Feature' },
      { id: uid(), text: 'Review pull request', tag: 'Review' },
    ]},
    { id: uid(), title: 'In Progress', color: '#f7c876', cards: [
      { id: uid(), text: 'Fix login bug', tag: 'Bug' },
    ]},
    { id: uid(), title: 'Done', color: '#7ddb84', cards: [
      { id: uid(), text: 'Update README', tag: 'Done' },
    ]},
  ]
};

let dragCard = null, dragColId = null, placeholder = null;

function uid() { return Math.random().toString(36).slice(2); }

function save() {
  localStorage.setItem('sfa-kanban', JSON.stringify(data));
  const n = document.getElementById('savedNote');
  n.textContent = 'Saved ' + new Date().toLocaleTimeString();
}

function load() {
  const stored = localStorage.getItem('sfa-kanban');
  if (stored) { try { data = JSON.parse(stored); } catch(e) {} }
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  data.columns.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;

    colEl.innerHTML = `
      <div class="col-header">
        <div class="col-color" style="background:${col.color}"></div>
        <input class="col-title" value="${esc(col.title)}" onchange="renameCol('${col.id}', this.value)">
        <span class="col-count">${col.cards.length}</span>
        <button class="col-del" onclick="deleteCol('${col.id}')" title="Delete column">×</button>
      </div>
      <div class="cards" data-col-id="${col.id}"></div>
      <div class="add-card">
        <input placeholder="Add card…" onkeydown="if(event.key==='Enter')addCard('${col.id}',this)">
        <button onclick="addCard('${col.id}',this.previousElementSibling)">+</button>
      </div>
    `;

    const cardsEl = colEl.querySelector('.cards');
    col.cards.forEach(card => {
      const cardEl = makeCard(card, col.id);
      cardsEl.appendChild(cardEl);
    });

    setupDropZone(cardsEl);
    board.appendChild(colEl);
  });

  // Add column button
  const addColBtn = document.createElement('div');
  addColBtn.className = 'add-col-btn';
  addColBtn.innerHTML = '<span>+</span> Add Column';
  addColBtn.onclick = addColumn;
  board.appendChild(addColBtn);
}

function makeCard(card, colId) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.dataset.colId = colId;

  const tagColor = TAG_COLORS[card.tag] || 'transparent';
  const tagBg = card.tag ? `rgba(${hexToRgb(tagColor)}, 0.15)` : '';

  el.innerHTML = `
    <div class="card-text" contenteditable="true" onblur="updateCardText('${colId}','${card.id}',this.textContent)">${esc(card.text)}</div>
    <div class="card-footer">
      <select class="tag-sel" onchange="updateCardTag('${colId}','${card.id}',this.value)">
        ${TAGS.map(t => `<option value="${t}" ${t===card.tag?'selected':''}>${t||'No tag'}</option>`).join('')}
      </select>
      ${card.tag ? `<span class="card-tag" style="background:${tagBg};color:${tagColor}">${card.tag}</span>` : ''}
      <button class="card-del" onclick="deleteCard('${colId}','${card.id}')">×</button>
    </div>
  `;

  el.addEventListener('dragstart', e => {
    dragCard = card.id;
    dragColId = colId;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    if (placeholder) placeholder.remove();
  });

  return el;
}

function setupDropZone(zone) {
  zone.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = getDragAfter(zone, e.clientY);
    if (!placeholder) { placeholder = document.createElement('div'); placeholder.className = 'card drag-placeholder'; }
    if (after) zone.insertBefore(placeholder, after);
    else zone.appendChild(placeholder);
  });

  zone.addEventListener('drop', e => {
    e.preventDefault();
    const toColId = zone.dataset.colId;
    const fromCol = data.columns.find(c => c.id === dragColId);
    const toCol = data.columns.find(c => c.id === toColId);
    if (!fromCol || !toCol || !dragCard) return;

    const cardIdx = fromCol.cards.findIndex(c => c.id === dragCard);
    const card = fromCol.cards.splice(cardIdx, 1)[0];

    // Find insertion index
    const afterEl = getDragAfter(zone, e.clientY);
    if (afterEl) {
      const afterIdx = toCol.cards.findIndex(c => c.id === afterEl.dataset.cardId);
      toCol.cards.splice(afterIdx, 0, card);
    } else {
      toCol.cards.push(card);
    }

    if (placeholder) placeholder.remove();
    dragCard = null; dragColId = null;
    save(); render();
  });
}

function getDragAfter(container, y) {
  const cards = [...container.querySelectorAll('.card:not(.dragging):not(.drag-placeholder)')];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > (closest.offset || -Infinity)) return { offset, element: child };
    return closest;
  }, {}).element;
}

function addCard(colId, input) {
  const text = input.value.trim();
  if (!text) return;
  const col = data.columns.find(c => c.id === colId);
  col.cards.push({ id: uid(), text, tag: '' });
  input.value = '';
  save(); render();
}

function updateCardText(colId, cardId, text) {
  const col = data.columns.find(c => c.id === colId);
  const card = col?.cards.find(c => c.id === cardId);
  if (card) { card.text = text.trim(); save(); }
}

function updateCardTag(colId, cardId, tag) {
  const col = data.columns.find(c => c.id === colId);
  const card = col?.cards.find(c => c.id === cardId);
  if (card) { card.tag = tag; save(); render(); }
}

function deleteCard(colId, cardId) {
  const col = data.columns.find(c => c.id === colId);
  if (col) { col.cards = col.cards.filter(c => c.id !== cardId); save(); render(); }
}

function renameCol(colId, title) {
  const col = data.columns.find(c => c.id === colId);
  if (col) { col.title = title; save(); }
}

function deleteCol(colId) {
  if (!confirm('Delete this column and all its cards?')) return;
  data.columns = data.columns.filter(c => c.id !== colId);
  save(); render();
}

function addColumn() {
  data.columns.push({ id: uid(), title: 'New Column', color: COLORS[data.columns.length % COLORS.length], cards: [] });
  save(); render();
}

function clearBoard() {
  if (!confirm('Clear all columns and cards?')) return;
  data.columns = [];
  save(); render();
}

function exportBoard() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kanban-board.json';
  a.click();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

load();
render();
</script>
</body>
</html>
