<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Generator | South Fork Apps</title>
  <meta name="description" content="Generate glassmorphism CSS visually. Adjust blur, opacity, border, and background to create glass-effect cards and panels. Copy ready CSS instantly. Free online tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav a:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(860px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem;}
    h1{margin:0 0 .4rem;font-size:clamp(1.6rem,3.5vw,2.2rem);}
    .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    @media(max-width:640px){.layout{grid-template-columns:1fr;}}
    .controls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;}
    .field{margin-bottom:.85rem;}
    label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.3rem;}
    label span{color:var(--accent);font-variant-numeric:tabular-nums;}
    input[type=range]{width:100%;accent-color:var(--accent);}
    input[type=color]{width:48px;height:32px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--surface2);cursor:pointer;}
    .color-row{display:flex;gap:.6rem;align-items:center;}
    .color-row input[type=text]{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.4rem .6rem;font:inherit;font-family:monospace;font-size:.85rem;outline:none;}
    .color-row input[type=text]:focus{border-color:var(--accent);}
    .preview-area{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;}
    .preview-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;}
    .preview-stage{flex:1;min-height:200px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:1.5rem;}
    .glass-card{padding:1.5rem;border-radius:12px;width:80%;max-width:260px;text-align:center;}
    .glass-card h3{margin:0 0 .5rem;font-size:1.1rem;}
    .glass-card p{margin:0;font-size:.82rem;opacity:.8;}
    .code-section{margin-top:1rem;}
    pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.85rem;font-size:.78rem;font-family:monospace;overflow-x:auto;line-height:1.6;margin:0;}
    .copy-btn{width:100%;padding:.5rem;border:none;border-radius:7px;background:var(--accent);color:#0a1a0c;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;margin-top:.5rem;}
    .copy-btn:hover{filter:brightness(1.07);}
    footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
  </style>
<!-- SFA_ADS_START -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3076043873825717" crossorigin="anonymous"></script>
<!-- SFA_ADS_END -->
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Glassmorphism Generator</span></nav>
<main>
  <h1>Glassmorphism Generator</h1>
  <p class="sub">Design glass-effect UI panels visually and copy the ready-to-use CSS.</p>

  <div class="layout">
    <div class="controls">
      <div class="field">
        <label>Blur <span id="blurVal">12px</span></label>
        <input type="range" id="blur" min="0" max="40" value="12" oninput="update()">
      </div>
      <div class="field">
        <label>Background opacity <span id="opacityVal">15%</span></label>
        <input type="range" id="opacity" min="0" max="80" value="15" oninput="update()">
      </div>
      <div class="field">
        <label>Border opacity <span id="borderOpVal">30%</span></label>
        <input type="range" id="borderOp" min="0" max="100" value="30" oninput="update()">
      </div>
      <div class="field">
        <label>Border radius <span id="radiusVal">12px</span></label>
        <input type="range" id="radius" min="0" max="40" value="12" oninput="update()">
      </div>
      <div class="field">
        <label>Shadow strength <span id="shadowVal">20%</span></label>
        <input type="range" id="shadow" min="0" max="60" value="20" oninput="update()">
      </div>
      <div class="field">
        <label>Glass color</label>
        <div class="color-row">
          <input type="color" id="glassColor" value="#ffffff" oninput="syncColor()">
          <input type="text" id="glassColorHex" value="#ffffff" oninput="syncHex()" maxlength="7">
        </div>
      </div>
      <div class="field">
        <label>Background gradient</label>
        <div class="color-row">
          <input type="color" id="bg1" value="#6c63ff" oninput="update()">
          <input type="color" id="bg2" value="#3ecfcf" oninput="update()">
        </div>
      </div>
    </div>

    <div>
      <div class="preview-area">
        <div class="preview-label">Live preview</div>
        <div class="preview-stage" id="stage">
          <div class="glass-card" id="glassCard">
            <h3>Glass Card</h3>
            <p>This is your glassmorphism component. Adjust the sliders to tweak the effect.</p>
          </div>
        </div>
      </div>
      <div class="code-section">
        <pre id="cssOutput"></pre>
        <button class="copy-btn" onclick="copyCss()">Copy CSS</button>
      </div>
    </div>
  </div>
  <footer>v1.0</footer>
</main>
<script>
function update() {
  const blur = document.getElementById('blur').value;
  const op = document.getElementById('opacity').value;
  const bOp = document.getElementById('borderOp').value;
  const radius = document.getElementById('radius').value;
  const shadow = document.getElementById('shadow').value;
  const gc = document.getElementById('glassColor').value;
  const bg1 = document.getElementById('bg1').value;
  const bg2 = document.getElementById('bg2').value;

  document.getElementById('blurVal').textContent = blur+'px';
  document.getElementById('opacityVal').textContent = op+'%';
  document.getElementById('borderOpVal').textContent = bOp+'%';
  document.getElementById('radiusVal').textContent = radius+'px';
  document.getElementById('shadowVal').textContent = shadow+'%';

  const r=parseInt(gc.slice(1,3),16),g=parseInt(gc.slice(3,5),16),b=parseInt(gc.slice(5,7),16);
  const opDec=(op/100).toFixed(2);
  const bOpDec=(bOp/100).toFixed(2);
  const shDec=(shadow/100).toFixed(2);

  const stage = document.getElementById('stage');
  stage.style.background = `linear-gradient(135deg, ${bg1}, ${bg2})`;

  const card = document.getElementById('glassCard');
  card.style.cssText = `background:rgba(${r},${g},${b},${opDec});backdrop-filter:blur(${blur}px);-webkit-backdrop-filter:blur(${blur}px);border-radius:${radius}px;border:1px solid rgba(${r},${g},${b},${bOpDec});box-shadow:0 8px 32px rgba(0,0,0,${shDec});padding:1.5rem;width:80%;max-width:260px;text-align:center;`;

  const css = `.glass {
  background: rgba(${r}, ${g}, ${b}, ${opDec});
  backdrop-filter: blur(${blur}px);
  -webkit-backdrop-filter: blur(${blur}px);
  border-radius: ${radius}px;
  border: 1px solid rgba(${r}, ${g}, ${b}, ${bOpDec});
  box-shadow: 0 8px 32px rgba(0, 0, 0, ${shDec});
}`;
  document.getElementById('cssOutput').textContent = css;
}

function syncColor() {
  document.getElementById('glassColorHex').value = document.getElementById('glassColor').value;
  update();
}

function syncHex() {
  const val = document.getElementById('glassColorHex').value;
  if (/^#[0-9a-f]{6}$/i.test(val)) {
    document.getElementById('glassColor').value = val;
    update();
  }
}

function copyCss() {
  navigator.clipboard.writeText(document.getElementById('cssOutput').textContent).catch(()=>{});
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent='Copy CSS',1500);
}

update();
</script>
</body>
</html>
