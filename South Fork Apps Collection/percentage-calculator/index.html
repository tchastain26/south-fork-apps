<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percentage Calculator | South Fork Apps</title>
  <meta name="description" content="Calculate percentages, percentage change, and add or subtract percentages instantly. Free online percentage calculator.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    main { flex: 1; max-width: 620px; margin: 0 auto; width: 100%; padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--text-mid); }
    input[type=number] { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 16px; font-weight: 700; padding: 9px 13px; outline: none; width: 120px; text-align: center; }
    input[type=number]:focus { border-color: var(--primary); }
    .result { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .result-label { font-size: 13px; color: var(--text-mid); }
    .result-value { font-size: 22px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .copy-btn { font-size: 11px; font-weight: 700; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-family: var(--font); }
    .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Percentage Calculator</h1>
</header>
<main>

  <!-- What is X% of Y -->
  <div class="card">
    <div class="card-title">What is X% of Y?</div>
    <div class="row">
      <span>What is</span>
      <input type="number" id="a1" value="15" oninput="calc1()">
      <span>% of</span>
      <input type="number" id="a2" value="200" oninput="calc1()">
      <span>?</span>
    </div>
    <div class="result">
      <span class="result-label">Result</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="result-value" id="r1">30</span>
        <button class="copy-btn" onclick="copyVal('r1')">Copy</button>
      </div>
    </div>
  </div>

  <!-- X is what % of Y -->
  <div class="card">
    <div class="card-title">X is what % of Y?</div>
    <div class="row">
      <input type="number" id="b1" value="30" oninput="calc2()">
      <span>is what % of</span>
      <input type="number" id="b2" value="200" oninput="calc2()">
      <span>?</span>
    </div>
    <div class="result">
      <span class="result-label">Percentage</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="result-value" id="r2">15%</span>
        <button class="copy-btn" onclick="copyVal('r2')">Copy</button>
      </div>
    </div>
  </div>

  <!-- Percentage change -->
  <div class="card">
    <div class="card-title">Percentage Change</div>
    <div class="row">
      <span>From</span>
      <input type="number" id="c1" value="80" oninput="calc3()">
      <span>to</span>
      <input type="number" id="c2" value="100" oninput="calc3()">
    </div>
    <div class="result">
      <span class="result-label" id="changeLabel">Increase</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="result-value" id="r3">+25%</span>
        <button class="copy-btn" onclick="copyVal('r3')">Copy</button>
      </div>
    </div>
  </div>

  <!-- Add/subtract percentage -->
  <div class="card">
    <div class="card-title">Add or Subtract a Percentage</div>
    <div class="row">
      <input type="number" id="d1" value="100" oninput="calc4()">
      <select id="d_op" onchange="calc4()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:15px;padding:9px 10px;outline:none;">
        <option value="add">+ add</option>
        <option value="sub">− subtract</option>
      </select>
      <input type="number" id="d2" value="20" oninput="calc4()">
      <span>%</span>
    </div>
    <div class="result">
      <span class="result-label">Result</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="result-value" id="r4">120</span>
        <button class="copy-btn" onclick="copyVal('r4')">Copy</button>
      </div>
    </div>
  </div>

</main>
<script>
function fmt(n) {
  if (isNaN(n) || !isFinite(n)) return '—';
  return parseFloat(n.toFixed(6)).toLocaleString(undefined, {maximumFractionDigits: 6});
}
function v(id) { return parseFloat(document.getElementById(id).value) || 0; }
function set(id, val) { document.getElementById(id).textContent = val; }

function calc1() { set('r1', fmt(v('a2') * v('a1') / 100)); }
function calc2() {
  const b2 = v('b2');
  set('r2', b2 === 0 ? '—' : fmt(v('b1') / b2 * 100) + '%');
}
function calc3() {
  const from = v('c1'), to = v('c2');
  if (from === 0) { set('r3', '—'); return; }
  const change = ((to - from) / Math.abs(from)) * 100;
  document.getElementById('changeLabel').textContent = change >= 0 ? 'Increase' : 'Decrease';
  set('r3', (change >= 0 ? '+' : '') + fmt(change) + '%');
}
function calc4() {
  const base = v('d1'), pct = v('d2');
  const op = document.getElementById('d_op').value;
  const result = op === 'add' ? base * (1 + pct/100) : base * (1 - pct/100);
  set('r4', fmt(result));
}

function copyVal(id) { navigator.clipboard.writeText(document.getElementById(id).textContent); }

calc1(); calc2(); calc3(); calc4();
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
