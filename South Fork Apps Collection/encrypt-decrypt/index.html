<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypt / Decrypt Message | South Fork Apps</title>
  <meta name="description" content="Encrypt and decrypt messages with a passphrase using AES-256 in your browser. No data leaves your device. Free tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --danger: #f28b82; --radius: 12px;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .privacy-note { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    .privacy-note span { color: var(--primary); font-weight: 700; }
    main { flex: 1; max-width: 680px; margin: 0 auto; width: 100%; padding: 28px 20px; display: flex; flex-direction: column; gap: 20px; }
    .tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; color: var(--text-mid); border: none; background: transparent; font-family: var(--font); transition: all .15s; }
    .tab.active { background: var(--primary-dim); color: var(--text); }
    label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); display: block; margin-bottom: 6px; }
    textarea, input[type=password], input[type=text] {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--font); font-size: 14px; padding: 12px 14px;
      outline: none; transition: border-color .15s;
    }
    textarea:focus, input:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
    .btn { width: 100%; padding: 13px; background: var(--primary-dim); color: var(--text); border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: background .15s; }
    .btn:hover { background: var(--primary); color: #111; }
    .output-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; }
    .output-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .output-text { font-family: 'Courier New', monospace; font-size: 12px; color: var(--text); word-break: break-all; line-height: 1.6; white-space: pre-wrap; }
    .copy-btn { font-size: 11px; font-weight: 700; background: transparent; border: 1px solid var(--border); color: var(--text-mid); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-family: var(--font); }
    .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
    .error { background: rgba(242,139,130,.1); border: 1px solid rgba(242,139,130,.3); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: var(--danger); }
    .hidden { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Encrypt / Decrypt Message</h1>
</header>
<div class="privacy-note"><span>🔒 Private:</span> All encryption happens in your browser. No data is sent anywhere.</div>
<main>
  <div class="tabs">
    <button class="tab active" id="tabEncrypt" onclick="switchTab('encrypt')">Encrypt</button>
    <button class="tab" id="tabDecrypt" onclick="switchTab('decrypt')">Decrypt</button>
  </div>

  <!-- ENCRYPT -->
  <div id="encryptPane">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label>Message</label>
        <textarea id="encMsg" placeholder="Type your message here..."></textarea>
      </div>
      <div class="field">
        <label>Passphrase</label>
        <input type="password" id="encPass" placeholder="Choose a strong passphrase...">
      </div>
      <button class="btn" onclick="encrypt()">Encrypt Message</button>
      <div id="encError" class="error hidden"></div>
      <div id="encOutput" class="output-box hidden">
        <div class="output-label">
          <span>Encrypted Output</span>
          <button class="copy-btn" onclick="copyText('encCiphertext')">Copy</button>
        </div>
        <div class="output-text" id="encCiphertext"></div>
      </div>
    </div>
  </div>

  <!-- DECRYPT -->
  <div id="decryptPane" class="hidden">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label>Encrypted Text</label>
        <textarea id="decCipher" placeholder="Paste the encrypted text here..."></textarea>
      </div>
      <div class="field">
        <label>Passphrase</label>
        <input type="password" id="decPass" placeholder="Enter the passphrase...">
      </div>
      <button class="btn" onclick="decrypt()">Decrypt Message</button>
      <div id="decError" class="error hidden"></div>
      <div id="decOutput" class="output-box hidden">
        <div class="output-label">
          <span>Decrypted Message</span>
          <button class="copy-btn" onclick="copyText('decPlain')">Copy</button>
        </div>
        <div class="output-text" id="decPlain"></div>
      </div>
    </div>
  </div>
</main>
<script>
function switchTab(t) {
  document.getElementById('encryptPane').classList.toggle('hidden', t !== 'encrypt');
  document.getElementById('decryptPane').classList.toggle('hidden', t !== 'decrypt');
  document.getElementById('tabEncrypt').classList.toggle('active', t === 'encrypt');
  document.getElementById('tabDecrypt').classList.toggle('active', t === 'decrypt');
}

async function deriveKey(passphrase, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    keyMat,
    { name: 'AES-GCM', length: 256 },
    false, ['encrypt', 'decrypt']
  );
}

function toB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function fromB64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function encrypt() {
  const msg  = document.getElementById('encMsg').value;
  const pass = document.getElementById('encPass').value;
  const errEl = document.getElementById('encError');
  const outEl = document.getElementById('encOutput');
  errEl.classList.add('hidden');
  outEl.classList.add('hidden');

  if (!msg.trim()) { errEl.textContent = 'Please enter a message.'; errEl.classList.remove('hidden'); return; }
  if (!pass) { errEl.textContent = 'Please enter a passphrase.'; errEl.classList.remove('hidden'); return; }

  try {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(pass, salt);
    const enc  = new TextEncoder();
    const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(msg));

    const payload = JSON.stringify({ s: toB64(salt), i: toB64(iv), c: toB64(ct) });
    const b64 = btoa(payload);

    document.getElementById('encCiphertext').textContent = b64;
    outEl.classList.remove('hidden');
  } catch(e) {
    errEl.textContent = 'Encryption failed: ' + e.message;
    errEl.classList.remove('hidden');
  }
}

async function decrypt() {
  const cipher = document.getElementById('decCipher').value.trim();
  const pass   = document.getElementById('decPass').value;
  const errEl  = document.getElementById('decError');
  const outEl  = document.getElementById('decOutput');
  errEl.classList.add('hidden');
  outEl.classList.add('hidden');

  if (!cipher) { errEl.textContent = 'Please paste encrypted text.'; errEl.classList.remove('hidden'); return; }
  if (!pass)   { errEl.textContent = 'Please enter the passphrase.'; errEl.classList.remove('hidden'); return; }

  try {
    const payload = JSON.parse(atob(cipher));
    const salt = fromB64(payload.s);
    const iv   = fromB64(payload.i);
    const ct   = fromB64(payload.c);
    const key  = await deriveKey(pass, salt);
    const pt   = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    document.getElementById('decPlain').textContent = new TextDecoder().decode(pt);
    outEl.classList.remove('hidden');
  } catch(e) {
    errEl.textContent = 'Decryption failed. Wrong passphrase or corrupted data.';
    errEl.classList.remove('hidden');
  }
}

function copyText(id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent);
}
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
