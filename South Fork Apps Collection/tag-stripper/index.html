<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Stripper | South Fork Apps</title>
  <meta name="description" content="Remove HTML tags, XML tags, or Markdown formatting from any text instantly. Free online tag and markup stripper.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111412; --surface:#1a1f1b; --surface-2:#202722; --border:#2a2f2b; --accent:#7ddb84; --text:#e8e8e8; --muted:#aab5ac; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; }
    .nav { display:flex; align-items:center; gap:1rem; padding:.75rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); }
    .nav a { color:var(--accent); text-decoration:none; font-size:.875rem; font-weight:500; }
    .nav a:hover { text-decoration:underline; }
    .nav-title { color:var(--text); font-size:.875rem; font-weight:600; }
    main { width:min(980px,calc(100% - 2rem)); margin:0 auto; padding:2rem 0; display:grid; gap:1rem; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1.25rem; }
    h1 { margin:0 0 .5rem; font-size:clamp(2rem,7vw,4rem); line-height:1; }
    p { margin:0; color:var(--muted); line-height:1.6; }
    .options { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1rem; }
    label.check { display:flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.875rem; font-weight:600; cursor:pointer; }
    input[type="checkbox"] { accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; }
    @media(max-width:700px) { .layout { grid-template-columns:1fr; } }
    .col label.area-label { display:block; font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:.4rem; }
    textarea { width:100%; min-height:22rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; font-size:.9rem; line-height:1.6; padding:1rem; outline:none; resize:vertical; }
    textarea:focus { border-color:var(--accent); }
    .actions { display:flex; gap:.75rem; margin-top:.75rem; flex-wrap:wrap; }
    button { min-height:2.8rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font:inherit; font-weight:800; padding:0 1.25rem; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .primary { border-color:var(--accent); background:var(--accent); color:#102113; }
    .primary:hover { background:#5ec966; }
    .meta { margin-top:.5rem; color:var(--muted); font-size:.875rem; font-weight:700; min-height:1.4em; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:.75rem; }
    @media(max-width:480px) { .nav { padding-inline:1rem; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="https://southforkapps.com">← South Fork Apps</a>
    <span class="nav-title">Tag Stripper</span>
  </nav>
  <main>
    <section class="panel">
      <h1>Strip the markup.</h1>
      <p>Remove HTML, XML, or Markdown formatting and keep only the plain text.</p>
      <div class="options">
        <label class="check"><input type="checkbox" id="stripHtml" checked onchange="strip()"> Strip HTML / XML tags</label>
        <label class="check"><input type="checkbox" id="stripMd" onchange="strip()"> Strip Markdown formatting</label>
        <label class="check"><input type="checkbox" id="decodeEntities" checked onchange="strip()"> Decode HTML entities (&amp;amp; → &amp;)</label>
        <label class="check"><input type="checkbox" id="collapseWhitespace" onchange="strip()"> Collapse extra whitespace</label>
      </div>
      <div class="layout">
        <div class="col">
          <label class="area-label">Input</label>
          <textarea id="input" placeholder="Paste HTML, XML, or Markdown here..." oninput="strip()"></textarea>
        </div>
        <div class="col">
          <label class="area-label">Plain Text Output</label>
          <textarea id="output" readonly placeholder="Stripped text will appear here..."></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="primary" onclick="strip()">Strip</button>
        <button onclick="copyOutput()">Copy Output</button>
        <button onclick="clearAll()">Clear</button>
      </div>
      <div class="meta" id="meta">Ready.</div>
      <footer>v1.0</footer>
    </section>
  </main>

  <script>
    const ENTITIES = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'",'&nbsp;':' ','&#39;':"'",'&mdash;':'—','&ndash;':'–','&hellip;':'…','&laquo;':'«','&raquo;':'»'};

    function decodeHtmlEntities(str) {
      return str
        .replace(/&[a-z]+;/gi, m => ENTITIES[m.toLowerCase()] || m)
        .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n)))
        .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCharCode(parseInt(h, 16)));
    }

    function stripMarkdown(str) {
      return str
        .replace(/^#{1,6}\s+/gm, '')           // headings
        .replace(/\*\*\*(.+?)\*\*\*/g, '$1')   // bold+italic
        .replace(/\*\*(.+?)\*\*/g, '$1')        // bold
        .replace(/__(.+?)__/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')             // italic
        .replace(/_(.+?)_/g, '$1')
        .replace(/~~(.+?)~~/g, '$1')             // strikethrough
        .replace(/`{3}[\s\S]*?`{3}/g, '')        // code blocks
        .replace(/`([^`]+)`/g, '$1')             // inline code
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1') // images
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')  // links
        .replace(/^[>\s]+/gm, '')                // blockquotes
        .replace(/^[\-\*\+]\s+/gm, '')           // unordered lists
        .replace(/^\d+\.\s+/gm, '')              // ordered lists
        .replace(/^---+$/gm, '')                  // hr
        .replace(/\|/g, ' ');                     // tables
    }

    function strip() {
      const input = document.getElementById('input').value;
      if (!input.trim()) {
        document.getElementById('output').value = '';
        document.getElementById('meta').textContent = 'Paste text above.';
        return;
      }
      let result = input;
      if (document.getElementById('stripHtml').checked) result = result.replace(/<[^>]+>/g, ' ');
      if (document.getElementById('stripMd').checked) result = stripMarkdown(result);
      if (document.getElementById('decodeEntities').checked) result = decodeHtmlEntities(result);
      if (document.getElementById('collapseWhitespace').checked) result = result.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
      document.getElementById('output').value = result;
      const before = input.length, after = result.length;
      document.getElementById('meta').textContent = `${before.toLocaleString()} → ${after.toLocaleString()} chars (removed ${(before-after).toLocaleString()}).`;
    }

    function copyOutput() {
      const val = document.getElementById('output').value;
      if (val) { navigator.clipboard.writeText(val); document.getElementById('meta').textContent = 'Copied to clipboard.'; }
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('meta').textContent = 'Ready.';
    }
  </script>
</body>
</html>
