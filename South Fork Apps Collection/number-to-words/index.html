<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number to Words Converter | South Fork Apps</title>
  <meta name="description" content="Convert numbers to words in standard, currency, and ordinal formats. Great for checks and documents. Free online converter.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    main { flex: 1; max-width: 640px; margin: 0 auto; width: 100%; padding: 32px 20px; display: flex; flex-direction: column; gap: 20px; }
    .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    input[type=text], input[type=number] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 22px; font-weight: 700; padding: 12px 16px; outline: none; }
    input:focus { border-color: var(--primary); }
    .mode-tabs { display: flex; gap: 6px; }
    .mode-tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; color: var(--text-mid); border: 1px solid var(--border); background: transparent; font-family: var(--font); }
    .mode-tab.active { background: var(--primary-dim); color: var(--text); border-color: transparent; }
    .result-card { background: var(--surface); border: 1px solid var(--primary); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .result-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .result-text { font-size: 20px; font-weight: 600; color: var(--primary); line-height: 1.5; }
    .result-text.small { font-size: 16px; }
    .btn-row { display: flex; gap: 8px; }
    .btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font); background: var(--primary-dim); color: var(--text); }
    .btn:hover { background: var(--primary); color: #111; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .ex-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-mid); font-family: var(--font); }
    .ex-btn:hover { border-color: var(--primary); color: var(--primary); }
    .empty { color: var(--text-dim); font-size: 15px; text-align: center; padding: 20px 0; }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  </style>
</head>
<body>
<header>
  <a href="../../">← South Fork Apps</a>
  <h1>Number to Words Converter</h1>
</header>
<main>
  <div class="input-card">
    <label>Enter a Number</label>
    <input type="text" id="numIn" placeholder="e.g. 1234567.89" oninput="convert()" spellcheck="false">
    <div>
      <label style="margin-bottom:8px;display:block">Mode</label>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-standard" onclick="setMode('standard')">Standard</button>
        <button class="mode-tab" id="tab-currency" onclick="setMode('currency')">Currency (USD)</button>
        <button class="mode-tab" id="tab-ordinal" onclick="setMode('ordinal')">Ordinal</button>
      </div>
    </div>
  </div>

  <div id="resultArea"><p class="empty">Enter a number above to convert it to words.</p></div>

  <div>
    <div class="section-label" style="margin-bottom:8px">Quick Examples</div>
    <div class="examples">
      <button class="ex-btn" onclick="setNum('1')">1</button>
      <button class="ex-btn" onclick="setNum('13')">13</button>
      <button class="ex-btn" onclick="setNum('100')">100</button>
      <button class="ex-btn" onclick="setNum('1000')">1,000</button>
      <button class="ex-btn" onclick="setNum('1234567')">1,234,567</button>
      <button class="ex-btn" onclick="setNum('1000000000')">1 Billion</button>
      <button class="ex-btn" onclick="setNum('99.99')">99.99</button>
      <button class="ex-btn" onclick="setNum('1000000000000')">1 Trillion</button>
    </div>
  </div>
</main>
<script>
let mode = 'standard';

const ONES = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const SCALES = ['','thousand','million','billion','trillion','quadrillion'];
const ORDINALS = {one:'first',two:'second',three:'third',four:'fourth',five:'fifth',six:'sixth',seven:'seventh',eight:'eighth',nine:'ninth',ten:'tenth',eleven:'eleventh',twelve:'twelfth',thirteen:'thirteenth',fifteen:'fifteenth',twenty:'twentieth',thirty:'thirtieth',forty:'fortieth',fifty:'fiftieth',sixty:'sixtieth',seventy:'seventieth',eighty:'eightieth',ninety:'ninetieth'};

function hundreds(n) {
  if (n === 0) return '';
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n/10)] + (n%10 ? '-'+ONES[n%10] : '');
  return ONES[Math.floor(n/100)] + ' hundred' + (n%100 ? ' '+hundreds(n%100) : '');
}

function toWords(n) {
  if (n === 0) return 'zero';
  if (n < 0) return 'negative ' + toWords(-n);
  const chunks = [];
  let scale = 0;
  while (n > 0) {
    const chunk = n % 1000;
    if (chunk !== 0) {
      const h = hundreds(chunk);
      chunks.unshift(h + (SCALES[scale] ? ' '+SCALES[scale] : ''));
    }
    n = Math.floor(n / 1000);
    scale++;
  }
  return chunks.join(', ');
}

function ordinalSuffix(word) {
  if (ORDINALS[word]) return ORDINALS[word];
  if (word.endsWith('t')) return word + 'h';
  if (word.endsWith('e')) return word.slice(0,-1) + 'th';
  return word + 'th';
}

function toOrdinal(n) {
  const words = toWords(n).split(' ');
  const last = words[words.length-1];
  const lastParts = last.split('-');
  lastParts[lastParts.length-1] = ordinalSuffix(lastParts[lastParts.length-1]);
  words[words.length-1] = lastParts.join('-');
  return words.join(' ');
}

function setMode(m) {
  mode = m;
  ['standard','currency','ordinal'].forEach(x => document.getElementById('tab-'+x).classList.toggle('active', x===m));
  convert();
}

function setNum(n) { document.getElementById('numIn').value = n; convert(); }

function convert() {
  const raw = document.getElementById('numIn').value.replace(/,/g,'').trim();
  if (!raw) { document.getElementById('resultArea').innerHTML = '<p class="empty">Enter a number above to convert it to words.</p>'; return; }

  const num = parseFloat(raw);
  if (isNaN(num)) { document.getElementById('resultArea').innerHTML = '<p class="empty" style="color:var(--danger,#f28b82)">Not a valid number.</p>'; return; }

  const intPart = Math.floor(Math.abs(num));
  const isNeg = num < 0;

  let result = '';
  let sub = '';

  if (mode === 'standard') {
    const decPart = raw.includes('.') ? raw.split('.')[1] : null;
    result = (isNeg ? 'negative ' : '') + toWords(intPart);
    if (decPart) {
      result += ' point ' + decPart.split('').map(d => ONES[parseInt(d)]||'zero').join(' ');
    }
  } else if (mode === 'currency') {
    const cents = Math.round((Math.abs(num) - intPart) * 100);
    result = (isNeg ? 'negative ' : '') + toWords(intPart) + ' dollar' + (intPart !== 1 ? 's' : '');
    if (cents > 0) {
      result += ' and ' + toWords(cents) + ' cent' + (cents !== 1 ? 's' : '');
    }
    sub = 'Check format: ' + result.replace(/^\w/, c=>c.toUpperCase()) + (result.endsWith('s') ? '' : '') + ' only ——';
  } else {
    result = (isNeg ? 'negative ' : '') + toOrdinal(intPart);
  }

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="result-label">Words</div>
      <div class="result-text ${result.length > 80 ? 'small' : ''}">${result}</div>
      ${sub ? `<div class="result-text small" style="color:var(--text-mid);font-size:14px">${sub}</div>` : ''}
      <div class="btn-row">
        <button class="btn" onclick="navigator.clipboard.writeText('${result.replace(/'/g,"\\'")}')">Copy</button>
        <button class="btn ghost" onclick="navigator.clipboard.writeText('${result.charAt(0).toUpperCase()+result.slice(1).replace(/'/g,"\\'")}')">Copy Capitalized</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
