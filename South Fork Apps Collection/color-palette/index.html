<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator | South Fork Apps</title>
  <meta name="description" content="Generate complementary, analogous, triadic, and square color palettes from any base color. Free online color palette tool.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .toolbar { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); background: var(--primary-dim); color: var(--text); }
    .btn:hover { background: var(--primary); color: #111; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .controls { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .control-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-mid); }
    input[type=color] { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; padding: 2px; }
    select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 13px; padding: 8px 12px; outline: none; }
    select:focus { border-color: var(--primary); }
    .palette-area { flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
    .scheme { display: flex; flex-direction: column; gap: 10px; }
    .scheme-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
    .swatch-box { width: 80px; height: 80px; border-radius: 10px; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
    .swatch:hover .swatch-box { transform: scale(1.05); border-color: rgba(255,255,255,.3); }
    .swatch-hex { font-size: 11px; font-weight: 700; text-align: center; color: var(--text-dim); font-family: 'Courier New', monospace; }
    .swatch-copied { font-size: 10px; text-align: center; color: var(--primary); height: 14px; }
    .shades-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .shade { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
    .shade-box { width: 52px; height: 52px; border-radius: 6px; border: 1px solid transparent; transition: transform .15s; }
    .shade:hover .shade-box { transform: scale(1.08); border-color: rgba(255,255,255,.2); }
    .shade-label { font-size: 9px; text-align: center; color: var(--text-dim); font-family: monospace; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>Color Palette Generator</h1>
  <div class="toolbar">
    <button class="btn ghost" onclick="randomColor()">Random</button>
    <button class="btn" onclick="copyAll()">Copy All HEX</button>
  </div>
</header>
<div class="controls">
  <div class="control-group">
    <label>Base Color</label>
    <input type="color" id="basePicker" value="#7ddb84" oninput="generate()">
    <code id="baseHex" style="font-size:13px;color:var(--primary)">#7ddb84</code>
  </div>
  <div class="control-group">
    <label>Shades</label>
    <input type="range" id="shadesCount" min="3" max="11" value="7" oninput="generate()" style="accent-color:var(--primary);width:80px">
    <span id="shadesVal" style="color:var(--primary);font-size:13px;font-weight:700">7</span>
  </div>
</div>
<div class="palette-area" id="paletteArea"></div>
<script>
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2;
  let h=0,s=0;
  if (max !== min) {
    const d = max-min; s = l>0.5 ? d/(2-max-min) : d/(max+min);
    h = max===r ? (g-b)/d+(g<b?6:0) : max===g ? (b-r)/d+2 : (r-g)/d+4;
    h /= 6;
  }
  return [h*360, s*100, l*100];
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n+h/30)%12;
  const a = s*Math.min(l,1-l);
  const f = n => l - a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex = x => Math.round(x*255).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}

function hueShift(hex, deg) {
  const [h,s,l] = hexToHsl(hex);
  return hslToHex((h+deg+360)%360, s, l);
}

function lighten(hex, pct) {
  const [h,s,l] = hexToHsl(hex);
  return hslToHex(h, s, Math.min(95, l+pct));
}

function darken(hex, pct) {
  const [h,s,l] = hexToHsl(hex);
  return hslToHex(h, s, Math.max(5, l-pct));
}

function saturate(hex, pct) {
  const [h,s,l] = hexToHsl(hex);
  return hslToHex(h, Math.min(100, s+pct), l);
}

let allColors = [];

function generate() {
  const base = document.getElementById('basePicker').value;
  const shadesN = parseInt(document.getElementById('shadesCount').value);
  document.getElementById('baseHex').textContent = base;
  document.getElementById('shadesVal').textContent = shadesN;

  const [h,s,l] = hexToHsl(base);

  const SCHEMES = [
    { name: 'Complementary', colors: [base, hueShift(base,180)] },
    { name: 'Analogous', colors: [hueShift(base,-30), base, hueShift(base,30)] },
    { name: 'Triadic', colors: [base, hueShift(base,120), hueShift(base,240)] },
    { name: 'Split Complementary', colors: [base, hueShift(base,150), hueShift(base,210)] },
    { name: 'Square', colors: [base, hueShift(base,90), hueShift(base,180), hueShift(base,270)] },
    { name: 'Tetradic', colors: [base, hueShift(base,60), hueShift(base,180), hueShift(base,240)] },
  ];

  // Shades
  const shadeStep = 90 / (shadesN - 1);
  const shades = Array.from({length:shadesN}, (_,i) => hslToHex(h, s, 5 + i * shadeStep));

  allColors = [...new Set([...SCHEMES.flatMap(s=>s.colors), ...shades])];

  const area = document.getElementById('paletteArea');
  area.innerHTML = `
    ${SCHEMES.map(sc => `
      <div class="scheme">
        <div class="scheme-title">${sc.name}</div>
        <div class="swatches">${sc.colors.map(c => makeSwatch(c)).join('')}</div>
      </div>
    `).join('')}
    <div class="scheme">
      <div class="scheme-title">Shades (${shadesN} steps)</div>
      <div class="shades-row">${shades.map((c,i) => makeShade(c, i)).join('')}</div>
    </div>
  `;
}

function makeSwatch(hex) {
  return `<div class="swatch" onclick="copySwatch(this,'${hex}')">
    <div class="swatch-box" style="background:${hex}"></div>
    <div class="swatch-hex">${hex}</div>
    <div class="swatch-copied"></div>
  </div>`;
}

function makeShade(hex, i) {
  return `<div class="shade" onclick="copySwatch(this,'${hex}')">
    <div class="shade-box" style="background:${hex}"></div>
    <div class="shade-label">${hex}</div>
  </div>`;
}

function copySwatch(el, hex) {
  navigator.clipboard.writeText(hex);
  const note = el.querySelector('.swatch-copied') || el.querySelector('.shade-label');
  if (el.querySelector('.swatch-copied')) { note.textContent = 'Copied!'; setTimeout(()=>note.textContent='',1500); }
}

function randomColor() {
  const hex = '#' + Math.floor(Math.random()*0xFFFFFF).toString(16).padStart(6,'0');
  document.getElementById('basePicker').value = hex;
  generate();
}

function copyAll() {
  navigator.clipboard.writeText(allColors.join('\n'));
}

generate();
</script>

<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
