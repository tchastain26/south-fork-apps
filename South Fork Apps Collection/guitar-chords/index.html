<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Chords | South Fork Apps</title>
  <meta name="description" content="Guitar chord diagram browser. View fingering diagrams for open and barre chords across all roots and types including major, minor, 7th, and sus chords.">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111412;--surface:#1a1f1b;--surface2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
  .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .nav a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
  .nav a:hover{text-decoration:underline;}
  .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
  main{width:min(1000px,calc(100% - 2rem));margin:0 auto;padding:2rem 0;}
  h1{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);}
  .sub{margin:0 0 1.25rem;color:var(--muted);line-height:1.6;}
  .filters{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:flex-end;}
  .fgroup{display:flex;flex-direction:column;gap:.3rem;}
  .fgroup label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:7px;font:inherit;font-size:.88rem;cursor:pointer;}
  .chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;}
  .chord-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem;text-align:center;transition:border-color .15s;}
  .chord-card:hover{border-color:rgba(125,219,132,.4);}
  .chord-card h3{margin:0 0 .6rem;font-size:1rem;color:var(--accent);}
  svg.diagram{width:100%;max-width:110px;margin:0 auto;display:block;}
  .finger-label{font-size:.72rem;color:var(--muted);margin-top:.4rem;}
  .no-results{color:var(--muted);padding:2rem;text-align:center;width:100%;}
  footer{margin-top:2rem;color:var(--muted);font-size:.8rem;text-align:center;}
</style>
</head>
<body>
<nav class="nav"><a href="https://southforkapps.com">&#8592; South Fork Apps</a><span class="nav-title">Guitar Chords</span></nav>
<main>
  <h1>Guitar Chords</h1>
  <p class="sub">Fingering diagrams for open and common barre chords. Strings shown left-to-right (low E to high E). × = muted, ○ = open.</p>
  <div class="filters">
    <div class="fgroup">
      <label>Root</label>
      <select id="rootSel"><option value="all">All Roots</option></select>
    </div>
    <div class="fgroup">
      <label>Type</label>
      <select id="typeSel"><option value="all">All Types</option></select>
    </div>
  </div>
  <div class="chord-grid" id="grid"></div>
  <footer>v1.0</footer>
</main>
<script>
// frets: [s6,s5,s4,s3,s2,s1] — -1=muted, 0=open, N=fret
// fingers: optional [f6,f5,f4,f3,f2,f1] 1-4, 0=open/mute
const CHORDS=[
  {name:'A',  root:'A', type:'Major', frets:[-1,0,2,2,2,0], fingers:[0,0,1,2,3,0]},
  {name:'Am', root:'A', type:'Minor', frets:[-1,0,2,2,1,0], fingers:[0,0,2,3,1,0]},
  {name:'A7', root:'A', type:'Dom 7', frets:[-1,0,2,0,2,0], fingers:[0,0,2,0,3,0]},
  {name:'Amaj7',root:'A',type:'Maj 7',frets:[-1,0,2,1,2,0],fingers:[0,0,3,1,2,0]},
  {name:'Am7',root:'A',type:'Min 7',frets:[-1,0,2,0,1,0],fingers:[0,0,2,0,1,0]},
  {name:'Asus2',root:'A',type:'Sus 2',frets:[-1,0,2,2,0,0],fingers:[0,0,1,2,0,0]},
  {name:'Asus4',root:'A',type:'Sus 4',frets:[-1,0,2,2,3,0],fingers:[0,0,1,2,4,0]},
  {name:'B7', root:'B', type:'Dom 7', frets:[-1,2,1,2,0,2], fingers:[0,2,1,3,0,4]},
  {name:'Bm', root:'B', type:'Minor', frets:[-1,2,4,4,3,2], fingers:[0,1,3,4,2,1],barre:{fret:2,from:1,to:5}},
  {name:'Bm7',root:'B',type:'Min 7',frets:[-1,2,4,2,3,2],fingers:[0,1,3,1,2,1],barre:{fret:2,from:1,to:5}},
  {name:'C',  root:'C', type:'Major', frets:[-1,3,2,0,1,0], fingers:[0,3,2,0,1,0]},
  {name:'Cm', root:'C', type:'Minor', frets:[-1,3,5,5,4,3], fingers:[0,1,3,4,2,1],barre:{fret:3,from:1,to:5}},
  {name:'Cmaj7',root:'C',type:'Maj 7',frets:[-1,3,2,0,0,0],fingers:[0,3,2,0,0,0]},
  {name:'C7', root:'C', type:'Dom 7', frets:[-1,3,2,3,1,0], fingers:[0,3,2,4,1,0]},
  {name:'D',  root:'D', type:'Major', frets:[-1,-1,0,2,3,2], fingers:[0,0,0,1,3,2]},
  {name:'Dm', root:'D', type:'Minor', frets:[-1,-1,0,2,3,1], fingers:[0,0,0,2,3,1]},
  {name:'D7', root:'D', type:'Dom 7', frets:[-1,-1,0,2,1,2], fingers:[0,0,0,2,1,3]},
  {name:'Dmaj7',root:'D',type:'Maj 7',frets:[-1,-1,0,2,2,2],fingers:[0,0,0,1,2,3]},
  {name:'Dm7',root:'D',type:'Min 7',frets:[-1,-1,0,2,1,1],fingers:[0,0,0,2,1,1]},
  {name:'E',  root:'E', type:'Major', frets:[0,2,2,1,0,0], fingers:[0,2,3,1,0,0]},
  {name:'Em', root:'E', type:'Minor', frets:[0,2,2,0,0,0], fingers:[0,2,3,0,0,0]},
  {name:'E7', root:'E', type:'Dom 7', frets:[0,2,0,1,0,0], fingers:[0,2,0,1,0,0]},
  {name:'Emaj7',root:'E',type:'Maj 7',frets:[0,2,1,1,0,0],fingers:[0,3,1,2,0,0]},
  {name:'Em7',root:'E',type:'Min 7',frets:[0,2,2,0,3,0],fingers:[0,2,3,0,4,0]},
  {name:'F',  root:'F', type:'Major', frets:[1,3,3,2,1,1], fingers:[1,3,4,2,1,1],barre:{fret:1,from:0,to:5}},
  {name:'Fm', root:'F', type:'Minor', frets:[1,3,3,1,1,1], fingers:[1,3,4,1,1,1],barre:{fret:1,from:0,to:5}},
  {name:'F7', root:'F', type:'Dom 7', frets:[1,3,1,2,1,1], fingers:[1,3,1,2,1,1],barre:{fret:1,from:0,to:5}},
  {name:'G',  root:'G', type:'Major', frets:[3,2,0,0,0,3], fingers:[2,1,0,0,0,3]},
  {name:'Gm', root:'G', type:'Minor', frets:[3,5,5,3,3,3], fingers:[1,3,4,1,1,1],barre:{fret:3,from:0,to:5}},
  {name:'G7', root:'G', type:'Dom 7', frets:[3,2,0,0,0,1], fingers:[3,2,0,0,0,1]},
  {name:'Gmaj7',root:'G',type:'Maj 7',frets:[3,2,0,0,0,2],fingers:[3,2,0,0,0,1]},
];

const TYPES=[...new Set(CHORDS.map(c=>c.type))];
const ROOTS=[...new Set(CHORDS.map(c=>c.root))];

document.getElementById('rootSel').innerHTML+= ROOTS.map(r=>`<option value="${r}">${r}</option>`).join('');
document.getElementById('typeSel').innerHTML+= TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');

function drawDiagram(chord){
  const frets=chord.frets;
  const barre=chord.barre;
  const validFrets=frets.filter(f=>f>0);
  const minFret=validFrets.length?Math.min(...validFrets):1;
  const maxFret=validFrets.length?Math.max(...validFrets):4;
  const startFret=minFret<=4?1:minFret;
  const W=110,H=130,padL=14,padR=8,padT=24,padB=10;
  const gW=W-padL-padR,gH=H-padT-padB;
  const nFrets=5,nStrings=6;
  const sStep=gW/(nStrings-1),fStep=gH/(nFrets);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="diagram" xmlns="http://www.w3.org/2000/svg">`;
  // nut or fret number
  if(startFret===1){
    svg+=`<rect x="${padL}" y="${padT}" width="${gW}" height="3" fill="#e8e8e8" rx="1"/>`;
  } else {
    svg+=`<text x="${padL-4}" y="${padT+fStep*.6}" text-anchor="end" font-size="9" fill="#aab5ac" font-family="Plus Jakarta Sans,sans-serif">${startFret}fr</text>`;
    svg+=`<line x1="${padL}" y1="${padT}" x2="${padL+gW}" y2="${padT}" stroke="#3a4a3b" stroke-width="1.5"/>`;
  }
  // fret lines
  for(let f=1;f<=nFrets;f++){
    const y=padT+f*fStep;
    svg+=`<line x1="${padL}" y1="${y}" x2="${padL+gW}" y2="${y}" stroke="#2a2f2b" stroke-width="1"/>`;
  }
  // string lines
  for(let s=0;s<nStrings;s++){
    const x=padL+s*sStep;
    svg+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+gH}" stroke="#3a4a3b" stroke-width="1.2"/>`;
  }
  // barre
  if(barre){
    const by=padT+(barre.fret-startFret+0.5)*fStep;
    const bx1=padL+barre.from*sStep;
    const bx2=padL+barre.to*sStep;
    svg+=`<rect x="${bx1}" y="${by-5}" width="${bx2-bx1}" height="10" rx="5" fill="#7ddb84"/>`;
  }
  // open/muted markers above nut, dots
  for(let s=0;s<nStrings;s++){
    const x=padL+s*sStep;
    const f=frets[s];
    if(f===-1){
      svg+=`<text x="${x}" y="${padT-8}" text-anchor="middle" font-size="9" fill="#aab5ac" font-family="monospace">×</text>`;
    } else if(f===0){
      svg+=`<circle cx="${x}" cy="${padT-8}" r="4" fill="none" stroke="#aab5ac" stroke-width="1.2"/>`;
    } else {
      const fy=padT+(f-startFret+0.5)*fStep;
      const isOnBarre=barre&&f===barre.fret&&s>=barre.from&&s<=barre.to;
      if(!isOnBarre){
        svg+=`<circle cx="${x}" cy="${fy}" r="5.5" fill="#7ddb84"/>`;
      }
    }
  }
  svg+='</svg>';
  return svg;
}

function render(){
  const root=document.getElementById('rootSel').value;
  const type=document.getElementById('typeSel').value;
  const filtered=CHORDS.filter(c=>(root==='all'||c.root===root)&&(type==='all'||c.type===type));
  const grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML='<div class="no-results">No chords found for that combination.</div>';return;}
  grid.innerHTML=filtered.map(c=>`
    <div class="chord-card">
      <h3>${c.name}</h3>
      ${drawDiagram(c)}
      <div class="finger-label">${c.type}</div>
    </div>`).join('');
}

document.getElementById('rootSel').addEventListener('change',render);
document.getElementById('typeSel').addEventListener('change',render);
render();
</script>
</body>
</html>
