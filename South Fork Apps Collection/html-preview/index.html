<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Live Preview | South Fork Apps</title>
  <meta name="description" content="Write HTML and see it rendered live in a preview pane. Includes templates and download. Free online HTML editor.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111412; --surface: #1d201e; --surface2: #282b29;
      --primary: #7ddb84; --primary-dim: #27863a;
      --text: #e1e3df; --text-mid: #becaba; --text-dim: #899486;
      --border: #3f493e; --radius: 12px; --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header a { color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; opacity: .7; }
    header a:hover { opacity: 1; }
    h1 { font-size: 18px; font-weight: 700; }
    .toolbar { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 5px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); }
    .btn.primary { background: var(--primary-dim); color: var(--text); }
    .btn.primary:hover { background: var(--primary); color: #111; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .layout { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
    .pane:last-child { border-right: none; }
    .pane-header { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-mid); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    textarea { flex: 1; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.7; padding: 16px; border: none; outline: none; resize: none; tab-size: 2; }
    iframe { flex: 1; border: none; background: white; }
    .char-count { font-size: 11px; color: var(--text-dim); }
    .template-sel { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 12px; padding: 4px 8px; outline: none; }
    .preview-bg-toggle { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
    input[type=checkbox] { accent-color: var(--primary); }
  </style>
</head>
<body>
<header>
  <a href="https://southforkapps.com">← South Fork Apps</a>
  <h1>HTML Live Preview</h1>
  <div class="toolbar">
    <select class="template-sel" id="templateSel" onchange="loadTemplate()">
      <option value="">Load template…</option>
      <option value="blank">Blank page</option>
      <option value="basic">Basic HTML5</option>
      <option value="flexbox">Flexbox demo</option>
      <option value="grid">CSS Grid demo</option>
      <option value="form">Form example</option>
      <option value="table">Table example</option>
      <option value="animation">CSS Animation</option>
    </select>
    <button class="btn ghost" onclick="copyHTML()">Copy HTML</button>
    <button class="btn ghost" onclick="downloadHTML()">Download</button>
    <button class="btn primary" onclick="fullscreen()">Fullscreen Preview</button>
  </div>
</header>
<div class="layout">
  <div class="pane">
    <div class="pane-header">
      <span>HTML Editor</span>
      <span class="char-count" id="charCount">0 chars</span>
    </div>
    <textarea id="editor" spellcheck="false" oninput="update()"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span>Live Preview</span>
      <label class="preview-bg-toggle">
        <input type="checkbox" id="darkBg" onchange="updateBg()"> Dark bg
      </label>
    </div>
    <iframe id="preview" sandbox="allow-scripts"></iframe>
  </div>
</div>
<script>
const TEMPLATES = {
  blank: '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n</head>\n<body>\n  \n</body>\n</html>',
  basic: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { color: #2d6a4f; }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <p>Start editing your HTML here.</p>
</body>
</html>`,
  flexbox: `<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: system-ui; background: #f0f4f8; }
  .container { display: flex; gap: 16px; padding: 24px; flex-wrap: wrap; }
  .card { background: white; border-radius: 12px; padding: 20px; flex: 1; min-width: 120px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
  .card h2 { margin: 0 0 8px; color: #2d6a4f; font-size: 1.1rem; }
  .card p { margin: 0; color: #666; font-size: .875rem; }
  .justify-row { display: flex; gap: 8px; padding: 0 24px 24px; }
  .j-btn { flex: 1; padding: 8px; border: 2px solid #2d6a4f; border-radius: 8px; background: none; cursor: pointer; color: #2d6a4f; font-weight: 700; }
  .j-btn:hover { background: #2d6a4f; color: white; }
</style>
</head>
<body>
  <div class="container" id="flex">
    <div class="card"><h2>Flex Item 1</h2><p>flex: 1</p></div>
    <div class="card"><h2>Flex Item 2</h2><p>flex: 1</p></div>
    <div class="card"><h2>Flex Item 3</h2><p>flex: 1</p></div>
  </div>
  <div class="justify-row">
    <button class="j-btn" onclick="setJustify('flex-start')">Start</button>
    <button class="j-btn" onclick="setJustify('center')">Center</button>
    <button class="j-btn" onclick="setJustify('flex-end')">End</button>
    <button class="j-btn" onclick="setJustify('space-between')">Space Between</button>
  </div>
  <script>function setJustify(v){document.getElementById('flex').style.justifyContent=v}<\/script>
</body>
</html>`,
  grid: `<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: system-ui; background: #f0f4f8; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell { background: #2d6a4f; color: white; padding: 20px; border-radius: 8px; text-align: center; font-weight: 700; }
  .cell:nth-child(1) { grid-column: span 2; background: #1a3a2a; }
  .cell:nth-child(4) { grid-row: span 2; background: #40916c; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell">Spans 2 cols</div>
    <div class="cell">3</div>
    <div class="cell">4 — spans 2 rows</div>
    <div class="cell">5</div>
    <div class="cell">6</div>
    <div class="cell">7</div>
  </div>
</body>
</html>`,
  form: `<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: .875rem; }
  input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #2d6a4f; box-shadow: 0 0 0 2px rgba(45,106,79,.2); }
  button { background: #2d6a4f; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:hover { background: #40916c; }
</style>
</head>
<body>
  <h2>Contact Form</h2>
  <form onsubmit="alert('Submitted!');return false">
    <div class="field"><label>Name</label><input type="text" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Topic</label><select><option>General</option><option>Support</option><option>Feedback</option></select></div>
    <div class="field"><label>Message</label><textarea rows="4" placeholder="Your message…"></textarea></div>
    <button type="submit">Send Message</button>
  </form>
</body>
</html>`,
  table: `<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: system-ui; padding: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { background: #2d6a4f; color: white; padding: 10px 14px; text-align: left; }
  td { padding: 9px 14px; border-bottom: 1px solid #e5e7eb; }
  tr:hover td { background: #f0fdf4; }
  tr:nth-child(even) td { background: #f9fafb; }
  tr:nth-child(even):hover td { background: #f0fdf4; }
</style>
</head>
<body>
  <table>
    <thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Alice Johnson</td><td>Designer</td><td>Product</td><td>✅ Active</td></tr>
      <tr><td>Bob Smith</td><td>Engineer</td><td>Engineering</td><td>✅ Active</td></tr>
      <tr><td>Carol Davis</td><td>Manager</td><td>Operations</td><td>⏸ On Leave</td></tr>
      <tr><td>Dan Wilson</td><td>Analyst</td><td>Finance</td><td>✅ Active</td></tr>
      <tr><td>Eve Martinez</td><td>Director</td><td>Marketing</td><td>✅ Active</td></tr>
    </tbody>
  </table>
</body>
</html>`,
  animation: `<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 32px; }
  .spinner { width: 60px; height: 60px; border: 4px solid rgba(125,219,132,.2); border-top-color: #7ddb84; border-radius: 50%; animation: spin 1s linear infinite; }
  .pulse { width: 60px; height: 60px; background: #4361ee; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
  .bounce { width: 20px; height: 20px; background: #f7c876; border-radius: 50%; animation: bounce 0.8s ease infinite alternate; }
  .slide { width: 80px; height: 20px; background: #f28b82; border-radius: 10px; animation: slide 2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:.6} }
  @keyframes bounce { to { transform: translateY(-40px); } }
  @keyframes slide { 0%,100%{transform:translateX(-60px)} 50%{transform:translateX(60px)} }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="pulse"></div>
  <div class="bounce"></div>
  <div class="slide"></div>
</body>
</html>`
};

const DEFAULT = TEMPLATES.basic;
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');

function update() {
  const html = editor.value;
  document.getElementById('charCount').textContent = html.length.toLocaleString() + ' chars';
  try {
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
  } catch(e) {}
}

function loadTemplate() {
  const key = document.getElementById('templateSel').value;
  if (!key) return;
  editor.value = TEMPLATES[key];
  document.getElementById('templateSel').value = '';
  update();
}

function updateBg() {
  preview.style.background = document.getElementById('darkBg').checked ? '#111' : 'white';
}

function copyHTML() { navigator.clipboard.writeText(editor.value); }

function downloadHTML() {
  const a = document.createElement('a');
  a.download = 'index.html';
  a.href = URL.createObjectURL(new Blob([editor.value], {type:'text/html'}));
  a.click();
}

function fullscreen() {
  const win = window.open('', '_blank');
  win.document.write(editor.value);
  win.document.close();
}

// Tab key support
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    update();
  }
});

editor.value = DEFAULT;
update();
</script>
<p style="text-align:center;color:#aab5ac;font-size:0.78rem;padding:0.75rem 0 1rem">v1.0</p>
</body>
</html>
