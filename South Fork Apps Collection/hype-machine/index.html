<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hype Machine | South Fork Apps</title>
  <meta name="description" content="Type anything mundane and watch it become legendary. Free online hype generator that transforms boring text into epic marketing copy.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#111412;--surface:#1a1f1b;--surface-2:#202722;--border:#2a2f2b;--accent:#7ddb84;--text:#e8e8e8;--muted:#aab5ac;}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
    .nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .nav-back{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;}
    .nav-back:hover{text-decoration:underline;}
    .nav-title{color:var(--text);font-size:.875rem;font-weight:600;}
    main{width:min(660px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 3rem;display:grid;gap:1rem;}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.75rem;}
    h1{margin:0 0 .3rem;font-size:clamp(1.9rem,6vw,3rem);line-height:1;letter-spacing:-.02em;}
    .tagline{margin:0 0 1.75rem;color:var(--muted);line-height:1.6;font-size:.95rem;}

    /* Level Selector */
    .level-label-row{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.6rem;}
    .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.25rem;}
    .lvl-btn{padding:.85rem .5rem;border:2px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--muted);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;text-align:center;line-height:1.3;transition:border-color .2s,color .2s,background .2s;}
    .lvl-btn small{display:block;font-size:.7rem;font-weight:500;margin-top:.2rem;opacity:.75;}
    .lvl-btn:hover{border-color:rgba(125,219,132,.4);color:var(--text);}
    .lvl-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(125,219,132,.07);}
    .lvl-btn.overdrive.active{border-color:var(--accent);background:var(--accent);color:#0d1f0f;}
    .lvl-btn.overdrive.active small{opacity:.7;}
    @keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(125,219,132,.4);}50%{box-shadow:0 0 0 4px rgba(125,219,132,.12);}}
    .lvl-btn.overdrive.active{animation:pulse-border 2s ease infinite;}

    /* Input */
    .input-wrap{position:relative;margin-bottom:.75rem;}
    textarea{width:100%;min-height:120px;padding:.9rem 1rem;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font:inherit;font-size:.95rem;resize:vertical;outline:none;transition:border-color .15s;line-height:1.65;}
    textarea::placeholder{color:var(--muted);}
    textarea:focus{border-color:rgba(125,219,132,.5);}
    .char-count{position:absolute;bottom:.6rem;right:.85rem;font-size:.72rem;color:var(--muted);pointer-events:none;}

    /* Hype Button */
    .hype-btn{width:100%;padding:1.1rem;background:var(--accent);border:none;border-radius:10px;color:#0d1f0f;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;letter-spacing:.06em;transition:background .15s,transform .1s;}
    .hype-btn:hover{background:#6be073;}
    .hype-btn:active{transform:scale(.98);}
    .hype-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;}

    /* Output */
    .output{margin-top:1.25rem;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;pointer-events:none;}
    .output.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.1rem;background:var(--surface-2);border-bottom:1px solid var(--border);}
    .output-badge{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);}
    .hype-score-wrap{display:flex;align-items:center;gap:.6rem;}
    .hs-label{font-size:.72rem;color:var(--muted);}
    .hs-val{font-size:.95rem;font-weight:800;color:var(--accent);}
    .hs-bar{width:64px;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
    .hs-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease;}
    .output-body{padding:1.35rem 1.25rem;font-size:.975rem;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;}
    .output-footer{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.1rem;border-top:1px solid var(--border);background:var(--surface-2);}
    .output-hint{font-size:.75rem;color:var(--muted);}
    .copy-btn{padding:.45rem 1.1rem;background:none;border:1.5px solid var(--border);border-radius:7px;color:var(--muted);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;}
    .copy-btn:hover{border-color:var(--accent);color:var(--accent);}
    .copy-btn.copied{border-color:var(--accent);color:var(--accent);}

    .hint-row{margin-top:.75rem;font-size:.78rem;color:var(--muted);text-align:center;}
    footer{margin-top:.75rem;text-align:center;color:var(--muted);font-size:.8rem;}
  </style>
</head>
<body>
<nav class="nav">
  <a href="https://southforkapps.com" class="nav-back">← South Fork Apps</a>
  <span class="nav-title">The Hype Machine</span>
</nav>
<main>
  <section class="panel">
    <h1>The Hype Machine</h1>
    <p class="tagline">Type anything. Watch it become legendary.</p>

    <div class="level-label-row">Hype Level</div>
    <div class="levels">
      <button class="lvl-btn active" id="l1" onclick="setLevel(1)">
        Mild
        <small>Subtle boost</small>
      </button>
      <button class="lvl-btn" id="l2" onclick="setLevel(2)">
        Turbo
        <small>Full hype</small>
      </button>
      <button class="lvl-btn overdrive" id="l3" onclick="setLevel(3)">
        MAXIMUM<br>OVERDRIVE
        <small>Unhinged</small>
      </button>
    </div>

    <div class="input-wrap">
      <textarea id="inputText" placeholder="I made a sandwich. I watered my plant. I remembered to take out the trash." maxlength="800" oninput="updateCount()"></textarea>
      <span class="char-count" id="charCount">0 / 800</span>
    </div>

    <button class="hype-btn" onclick="runHype()">HYPE IT</button>
    <p class="hint-row">Cmd+Enter to generate</p>

    <div class="output" id="output">
      <div class="output-header">
        <span class="output-badge">Hyped Version</span>
        <div class="hype-score-wrap">
          <span class="hs-label">Hype Score</span>
          <div class="hs-bar"><div class="hs-fill" id="hsFill" style="width:0%"></div></div>
          <span class="hs-val" id="hsVal">-</span>
        </div>
      </div>
      <div class="output-body" id="outputText"></div>
      <div class="output-footer">
        <span class="output-hint">Generated by The Hype Machine</span>
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
      </div>
    </div>

    <footer>v1.0</footer>
  </section>
</main>
<script>
  let currentLevel = 1;

  const VERB_MAP = {
    made:'engineered',did:'executed',went:'ventured',ate:'strategically consumed',
    slept:'fully recovered',worked:'delivered peak performance',helped:'transformed',
    talked:'synergized',fixed:'permanently solved',started:'launched',
    finished:'conquered',bought:'invested in',found:'discovered',
    used:'leveraged',got:'secured',took:'claimed',called:'connected with',
    wrote:'authored',read:'deeply absorbed',said:'declared',thought:'strategized',
    saw:'witnessed',tried:'pioneered',came:'emerged',ran:'powered through',
    gave:'delivered',had:'commanded',sent:'dispatched',
    kept:'sustained',moved:'repositioned',turned:'transformed',played:'dominated',
    looked:'evaluated',asked:'queried',told:'briefed',felt:'experienced',
    walked:'navigated',cleaned:'optimized',cooked:'curated',drank:'consumed',
    drove:'navigated',opened:'unlocked',woke:'activated',watched:'monitored',
    listened:'deeply absorbed',learned:'mastered',built:'engineered',
    created:'pioneered',designed:'architected',met:'connected with',
    // present
    make:'engineer',do:'execute',eat:'strategically consume',
    sleep:'optimize recovery',work:'deliver peak performance',help:'transform',
    talk:'synergize',fix:'permanently solve',start:'launch',finish:'conquer',
    buy:'invest in',find:'discover',use:'leverage',get:'secure',take:'claim',
    write:'author',think:'strategize',see:'witness',try:'pioneer',come:'emerge',
    give:'deliver',send:'dispatch',move:'reposition',turn:'transform',
    play:'dominate',walk:'navigate',clean:'optimize',cook:'curate',
    drive:'navigate',open:'unlock',watch:'monitor',listen:'absorb',
    learn:'master',build:'engineer',create:'pioneer',design:'architect',
  };

  const POWER_ADJS = [
    'game-changing','unprecedented','world-class','elite','next-level',
    'industry-defining','revolutionary','high-impact','cutting-edge',
    'transformative','record-breaking','boundary-pushing','best-in-class',
    'paradigm-shifting','breakthrough','unparalleled','visionary',
  ];

  const HYPE_INSERTS = [
    'Against all odds.',
    'Industry experts are speechless.',
    'In a world-first achievement.',
    'Defying conventional wisdom.',
    'With laser-focused precision.',
    'Rewriting the rulebook entirely.',
    'The data speaks for itself.',
    'No one saw this coming.',
    'The bar has been permanently raised.',
    'History in the making.',
    'The results? Staggering.',
    'At an unprecedented scale.',
    'Bold. Decisive. Legendary.',
  ];

  const OPENINGS = [
    'BREAKING: In a move that has left industry experts completely speechless,',
    'History will remember this as the day everything changed.',
    'Prepare to have your entire worldview recalibrated.',
    'What happened next defied every single expectation.',
    'In what is being called a paradigm-shattering development:',
    'The moment the world has been quietly waiting for has arrived.',
    'Sources confirm what top analysts have suspected for years:',
    'Exclusive: A watershed moment has just occurred, and you need to hear about it.',
    'Nobody predicted this. Yet here we are.',
  ];

  const CLOSINGS = [
    'The era has begun. Act accordingly.',
    'This is not a moment. This is a movement.',
    'The game has officially changed. Welcome to the future.',
    'Consider the standard: permanently raised.',
    'The results are in. The verdict is clear. Nothing will ever be the same.',
    'This changes everything. And we are just getting started.',
    'Bold. Unprecedented. Inevitable.',
    'You have just witnessed history. The question is: what will YOU do with this information?',
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function replaceVerbs(text) {
    return text.replace(/\b(\w+)\b/g, word => {
      const lower = word.toLowerCase();
      if (!VERB_MAP[lower]) return word;
      const r = VERB_MAP[lower];
      return (word[0] >= 'A' && word[0] <= 'Z') ? r[0].toUpperCase() + r.slice(1) : r;
    });
  }

  function addPowerAdjs(text, density) {
    return text.replace(/\b(a|an|the|my|your|our|their|this|that)\s+([a-zA-Z]{4,})\b/gi, (m, art, noun) => {
      if (Math.random() > density) return m;
      return `${art} ${pick(POWER_ADJS)} ${noun}`;
    });
  }

  function splitSentences(text) {
    return text.match(/[^.!?]+[.!?]+\s*/g) || [text];
  }

  function addRandomCaps(text) {
    return text.replace(/\b([a-z]{5,})\b/g, w => Math.random() < 0.1 ? w.toUpperCase() : w);
  }

  function hyper(text, level) {
    if (!text.trim()) return '';
    let sentences = splitSentences(text.trim());
    if (!sentences.length) sentences = [text.trim()];
    sentences = sentences.map(s => replaceVerbs(s.trim()));
    const density = level === 1 ? 0.25 : level === 2 ? 0.5 : 0.72;
    sentences = sentences.map(s => addPowerAdjs(s, density));
    let result = sentences[0];
    for (let i = 1; i < sentences.length; i++) {
      const chance = level === 1 ? 0.2 : level === 2 ? 0.5 : 0.75;
      result += Math.random() < chance
        ? ' ' + pick(HYPE_INSERTS) + ' ' + sentences[i].trim()
        : ' ' + sentences[i].trim();
    }
    if (level >= 2) {
      const opening = pick(OPENINGS);
      result = opening + ' ' + result.charAt(0).toLowerCase() + result.slice(1);
    }
    if (level >= 3) result += ' ' + pick(CLOSINGS);
    if (level >= 3) result = addRandomCaps(result);
    return result;
  }

  function setLevel(n) {
    currentLevel = n;
    [1,2,3].forEach(i => document.getElementById('l'+i).classList.remove('active'));
    document.getElementById('l'+n).classList.add('active');
  }

  function updateCount() {
    const val = document.getElementById('inputText').value.length;
    document.getElementById('charCount').textContent = `${val} / 800`;
  }

  function scoreForLevel(level) {
    const [lo,hi] = [[36,63],[70,88],[93,100]][level-1];
    return Math.floor(Math.random() * (hi - lo + 1)) + lo;
  }

  function runHype() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) return;
    const result = hyper(text, currentLevel);
    const score = scoreForLevel(currentLevel);
    document.getElementById('outputText').textContent = result;
    document.getElementById('hsVal').textContent = score + '/100';
    document.getElementById('hsFill').style.width = score + '%';
    const out = document.getElementById('output');
    out.classList.add('visible');
    document.getElementById('copyBtn').textContent = 'Copy';
    document.getElementById('copyBtn').classList.remove('copied');
    out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function copyOutput() {
    const text = document.getElementById('outputText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  document.getElementById('inputText').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runHype();
  });
</script>
</body>
</html>
