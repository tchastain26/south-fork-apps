<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<title>Page Not Found | South Fork Apps</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Work+Sans:wght@300;400;500;900&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --background: #111412;
    --surface-container: #1d201e;
    --on-surface: #e1e3df;
    --on-surface-variant: #becaba;
    --primary: #7ddb84;
    --primary-container: #27863a;
    --outline-variant: #3f493e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--background);
    color: var(--on-surface);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(125, 219, 132, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(170, 204, 218, 0.06) 0%, transparent 40%),
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(125, 219, 132, 0.03) 40px, rgba(125, 219, 132, 0.03) 41px);
    background-size: cover;
    background-attachment: fixed;
  }
  .panel {
    background: rgba(17, 20, 18, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid var(--outline-variant);
    border-radius: 0.75rem;
    padding: 3rem 2.5rem;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .code {
    font-family: "Epilogue", sans-serif;
    font-weight: 800;
    font-size: clamp(4rem, 12vw, 6.5rem);
    line-height: 1;
    margin: 0 0 0.5rem;
    background: linear-gradient(135deg, #7ddb84 0%, #27863a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.04em;
  }
  h2 {
    font-family: "Epilogue", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    margin: 0 0 0.75rem;
    color: var(--on-surface);
  }
  p {
    color: var(--on-surface-variant);
    font-size: 1rem;
    line-height: 1.55;
    margin: 0 0 1.75rem;
  }
  .btn {
    display: inline-block;
    font-family: "Work Sans", sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    padding: 0.75rem 1.5rem;
    border-radius: 9999px;
    background: linear-gradient(135deg, #7ddb84 0%, #27863a 100%);
    color: #003910;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(125, 219, 132, 0.25);
  }
  .label {
    display: inline-block;
    font-family: "Work Sans", sans-serif;
    font-weight: 500;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>
<main class="panel">
  <span class="label">Error</span>
  <h1 class="code">404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has moved. Head back to the homepage to keep browsing free online tools.</p>
  <a class="btn" href="/">Back to South Fork Apps</a>
</main>
</body>
</html>
